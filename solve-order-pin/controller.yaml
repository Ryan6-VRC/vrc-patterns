# solve-order-pin — pins where the VRC constraint solver cuts a cyclic group, by handing one
# constraint a dependency path deeper than any other in the avatar. The ladder itself is the
# prefab's 16 chained weight-0 constraints; this controller exists only to switch the module's
# own root off once they have registered, so the rig costs nothing per frame after load.
#
# THE ROOT MUST SHIP ACTIVE, and this controller is the only reason it can stop costing
# anything. Constraints join the solver on OnEnable at instantiation and stay joined when the
# object is later deactivated; deactivated BEFORE load they never join and the pin is absent.
# OnEnable precedes any animation of them, so no delay machinery is needed here and none exists.
# ../README.md carries the consequences for anyone editing the rig.
#
# The direct-tree shape is load-bearing, not stylistic: d4rk's FX-layer pass folds a single-state
# layer whose only disqualifier is "blend tree" into the combined direct tree, so this module ships
# no extra layer on an optimized avatar. A state-machine layer would not merge.

schema: 1
controller: SolveOrderPin_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  One: { type: float, default: 1.0 }   # constant, never driven — carries the direct child at full weight

layers:
  - name: SolveOrderPin
    states:
      Park:
        motion:
          tree: direct
          children:
            - { clip: ladder_off, directWeight: One }
    default: Park
    layout:
      nodes: { Park: [30, 180] }
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

# The one binding, deliberately PATH-LESS: VRCFury resolves an empty path to the GameObject
# carrying the FullController — this module's own root — so the write follows the mount wherever
# a consumer puts it and whatever they rename it to. Naming a path here instead would be worse
# than wrong: a path that misses does not fail, it CLIMBS to the parent and retries, so a stale
# one silently lands on some unrelated node of the consumer's avatar.
clips:
  ladder_off:
    set:
      "GameObject.m_IsActive": 0
