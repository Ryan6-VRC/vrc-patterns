      Wrap:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/R20: 0, SyncProbe/Cnt/R20: 1 } }
        transitions:
          - { to: Tick, when: [ SyncProbe/True is true ] }   # one extra frame per 256 ticks, declared
    default: Split
    layout:
      nodes:
        Split: [30, 180]
        Dead:  [270, 180]
        Tick:  [-210, 260]
        Hop:   [-450, 260]
        Wrap:  [-450, 350]
  # Torn pair: A and B = 255 - A written by ONE driver each 0.1s tick, from two
  # complementary counters (a convertRange inversion truncates on the Int copy —
  # measured 205 -> 49); both copies read their counters before the increment
  # behaviour runs, so the pair is exact and same-frame by construction.
  - name: SyncProbe/Torn
    states:
      Split:
        motion: ~
        transitions:
          - { to: Dead, when: [ IsLocal is false ] }
          - { to: Tick, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      Tick:
        motion: ~
        behaviours:
          - driver:
              localOnly: true
              copy:
                SyncProbe/TornA: SyncProbe/Cnt/Torn
                SyncProbe/TornB: SyncProbe/Cnt/TornB
          - driver: { localOnly: true, add: { SyncProbe/Cnt/Torn: 1, SyncProbe/Cnt/TornB: -1 } }
        transitions:
          - { to: Hop, when: [], exitTime: 0.1 }
      Hop:
        motion: ~
        transitions:
          - { to: Wrap, when: [ SyncProbe/Cnt/Torn greater 255.5 ] }
          - { to: Tick, when: [ SyncProbe/True is true ] }
      Wrap:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/TornA: 0, SyncProbe/TornB: 255, SyncProbe/Cnt/Torn: 1, SyncProbe/Cnt/TornB: 254 } }
        transitions:
          - { to: Tick, when: [ SyncProbe/True is true ] }
    default: Split
    layout:
      nodes:
        Split: [30, 180]
        Dead:  [270, 180]
        Tick:  [-210, 260]
        Hop:   [-450, 260]
        Wrap:  [-450, 350]
  # Frametime rig, lifted from vrc-patterns/blendtree-math (owned there; the
  # tangents: linear ramp makes Time equal elapsed seconds).
  - name: SyncProbe/FrameTime
    states:
      "FrameTime (WD ON)":
        motion:
          tree: direct
          name: FrameTime
          children:
            - { clip: ft_time_ramp, directWeight: SyncProbe/One }
            - tree: direct
              name: "FrameTime = Time - LastTime"
              directWeight: SyncProbe/One
              children:
                - { clip: ft_pos, directWeight: SyncProbe/Ft/Time }
                - { clip: ft_neg, directWeight: SyncProbe/Ft/LastTime }
                - { clip: ft_stage, directWeight: SyncProbe/Ft/Time }
    default: "FrameTime (WD ON)"
  # FpsBand: Watch's ladder routes on the FrameTime AAP (transitions read AAPs one
  # frame behind); each band state Sets the index and hops straight back. Repeated
  # Sets of an unchanged value cost nothing on the wire (OSC emission is change-only).
