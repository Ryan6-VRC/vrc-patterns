        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/FpsBand: 0 } }
        transitions:
          - { to: Watch, when: [ SyncProbe/True is true ] }
      Band1:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/FpsBand: 1 } }
        transitions:
          - { to: Watch, when: [ SyncProbe/True is true ] }
      Band2:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/FpsBand: 2 } }
        transitions:
          - { to: Watch, when: [ SyncProbe/True is true ] }
      Band3:
        motion: ~
        behaviours:
