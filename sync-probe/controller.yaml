          - { to: S3, when: [ SyncProbe/Dc/R05/Delta greater -253.5, SyncProbe/Dc/R05/Delta less -252.5 ] }
          - { to: S4, when: [ SyncProbe/Dc/R05/Delta greater 3.5, SyncProbe/Dc/R05/Delta less 15.5 ] }
          - { to: S4, when: [ SyncProbe/Dc/R05/Delta greater -252.5, SyncProbe/Dc/R05/Delta less -240.5 ] }
          - { to: Big, when: [ SyncProbe/Dc/R05/Delta greater 15.5, SyncProbe/Dc/R05/Delta less 255.5 ] }
          - { to: Big, when: [ SyncProbe/Dc/R05/Delta greater -240.5, SyncProbe/Dc/R05/Delta less -0.5 ] }
      S1:
        motion: ~
        behaviours:
