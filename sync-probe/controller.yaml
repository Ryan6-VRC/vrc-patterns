              name: "Delta R05 = Cur - Prev"
              directWeight: SyncProbe/One
              children:
                - { clip: delta_r05_pos, directWeight: SyncProbe/Dc/R05/Cur }
                - { clip: delta_r05_neg, directWeight: SyncProbe/Dc/R05/Prev }
            - tree: direct
              name: "Delta R10B = Cur - Prev"
              directWeight: SyncProbe/One
              children:
                - { clip: delta_r10b_pos, directWeight: SyncProbe/Dc/R10B/Cur }
                - { clip: delta_r10b_neg, directWeight: SyncProbe/Dc/R10B/Prev }
            - tree: direct
              name: "Delta R10G = Cur - Prev"
              directWeight: SyncProbe/One
              children:
                - { clip: delta_r10g_pos, directWeight: SyncProbe/Dc/R10G/Cur }
                - { clip: delta_r10g_neg, directWeight: SyncProbe/Dc/R10G/Prev }
            - tree: direct
              name: "Delta R20 = Cur - Prev"
              directWeight: SyncProbe/One
              children:
                - { clip: delta_r20_pos, directWeight: SyncProbe/Dc/R20/Cur }
                - { clip: delta_r20_neg, directWeight: SyncProbe/Dc/R20/Prev }
            - tree: direct
              name: "TornSum = TnA + TnB"
