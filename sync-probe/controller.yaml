layers:
  # R05: 0.05s cadence, Send/Extra guard hop.
  # Publish-then-increment as two driver behaviours (list-order execution);
  # Wrap publishes 0 by Set (a driver Add clips a synced Int at 255) and
  # re-seeds the counter at 1, so the wire walks ...254, 255, 0, 1...
  - name: SyncProbe/Rung/R05
    states:
      Split:
        motion: ~
        transitions:
          - { to: Dead, when: [ IsLocal is false ] }
          - { to: Tick, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      Tick:
        motion: ~
        behaviours:
          - driver: { localOnly: true, copy: { SyncProbe/R05: SyncProbe/Cnt/R05 } }
          - driver: { localOnly: true, add: { SyncProbe/Cnt/R05: 1 } }
        transitions:
          - { to: Hop, when: [], exitTime: 0.05 }   # empty state: exitTime is literal seconds
      Hop:
        motion: ~
        transitions:
          - { to: Wrap, when: [ SyncProbe/Cnt/R05 greater 255.5 ] }
          - { to: Tick, when: [ SyncProbe/True is true ] }   # conditional hop = the guaranteed +1 frame
      Wrap:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/R05: 0, SyncProbe/Cnt/R05: 1 } }
        transitions:
          - { to: Tick, when: [ SyncProbe/True is true ] }   # one extra frame per 256 ticks, declared
    default: Split
    layout:
      nodes:
        Split: [30, 180]
        Dead:  [270, 180]
        Tick:  [-210, 260]
        Hop:   [-450, 260]
        Wrap:  [-450, 350]
  # R10B: 0.1s cadence, BARE exit-time flip-flop (no hop).
  # Publish-then-increment as two driver behaviours (list-order execution);
  # Wrap publishes 0 by Set (a driver Add clips a synced Int at 255) and
  # re-seeds the counter at 1, so the wire walks ...254, 255, 0, 1...
  - name: SyncProbe/Rung/R10B
    states:
      Split:
        motion: ~
        transitions:
          - { to: Dead, when: [ IsLocal is false ] }
          - { to: TickA, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      # Pure exit-time chain — no conditional hop anywhere between ticks: the
      # wrap states are themselves ticks (they publish 0 by Set on schedule).
      TickA:
        motion: ~
        behaviours:
          - driver: { localOnly: true, copy: { SyncProbe/R10B: SyncProbe/Cnt/R10B } }
          - driver: { localOnly: true, add: { SyncProbe/Cnt/R10B: 1 } }
        transitions:
          - { to: WrapB, when: [ SyncProbe/Cnt/R10B greater 255.5 ], exitTime: 0.1 }
          - { to: TickB, when: [], exitTime: 0.1 }
      TickB:
        motion: ~
        behaviours:
          - driver: { localOnly: true, copy: { SyncProbe/R10B: SyncProbe/Cnt/R10B } }
          - driver: { localOnly: true, add: { SyncProbe/Cnt/R10B: 1 } }
        transitions:
          - { to: WrapA, when: [ SyncProbe/Cnt/R10B greater 255.5 ], exitTime: 0.1 }
          - { to: TickA, when: [], exitTime: 0.1 }
      WrapA:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/R10B: 0, SyncProbe/Cnt/R10B: 1 } }
        transitions:
          - { to: TickB, when: [], exitTime: 0.1 }
      WrapB:
        motion: ~
        behaviours:
          - driver: { localOnly: true, set: { SyncProbe/R10B: 0, SyncProbe/Cnt/R10B: 1 } }
        transitions:
          - { to: TickA, when: [], exitTime: 0.1 }
    default: Split
    layout:
      nodes:
        Split: [30, 180]
        Dead:  [270, 180]
        TickA: [-210, 260]
        TickB: [-450, 260]
        WrapA: [-210, 350]
        WrapB: [-450, 350]
  # R10G: 0.1s cadence, Send/Extra guard hop.
  # Publish-then-increment as two driver behaviours (list-order execution);
  # Wrap publishes 0 by Set (a driver Add clips a synced Int at 255) and
  # re-seeds the counter at 1, so the wire walks ...254, 255, 0, 1...
  - name: SyncProbe/Rung/R10G
    states:
      Split:
        motion: ~
        transitions:
          - { to: Dead, when: [ IsLocal is false ] }
          - { to: Tick, when: [ IsLocal is true ] }
      Dead:
