# receiver. Sender half (IsLocal): a four-rung rate ladder of 8-bit counters
# (word-channel's Send/Extra cadence idiom; the R10B rung alone drops the +1-frame
# guard hop — the experimental deviation), a same-driver torn pair B = 255 - A, and
# an FpsBand ladder over an owned frametime rig. Receiver half (the remote copy on
# the observing client): wire Ints pumped to floats, relayed as ANALOG world
# positions (pos.z = rest + value*step — same-frame; a per-bit AAP cascade settles
# incoherently over ~15 frames, docs/gimmicks.md one-frame-per-hop), stride tallies
# bucketed 1/2/3/4+/big with mod-256 wrap rungs, a torn-persistence counter, a
# 21-register scan bus (value/select/strobe), a complementary GO-active heartbeat,
# and a Reset clear that re-stages Prev from Cur. generate.py's docstring carries
# the design; the README carries the rig, the calibration, and the declared limits.

