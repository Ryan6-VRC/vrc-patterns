        transitions:
          - { to: Reg15, when: [], exitTime: 1.5 }
      Reg15:   # R20/S1
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Sc/SelIdx: 15
                SyncProbe/Sc/Strobe: 1
              copy:
                SyncProbe/Sc/Val: { source: SyncProbe/Ty/R20/S1, sourceMin: 0, sourceMax: 255, destMin: 0, destMax: 255 }
        transitions:
          - { to: Reg16, when: [], exitTime: 1.5 }
      Reg16:   # R20/S2
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Sc/SelIdx: 16
                SyncProbe/Sc/Strobe: 0
              copy:
                SyncProbe/Sc/Val: { source: SyncProbe/Ty/R20/S2, sourceMin: 0, sourceMax: 255, destMin: 0, destMax: 255 }
        transitions:
          - { to: Reg17, when: [], exitTime: 1.5 }
      Reg17:   # R20/S3
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Sc/SelIdx: 17
                SyncProbe/Sc/Strobe: 1
              copy:
                SyncProbe/Sc/Val: { source: SyncProbe/Ty/R20/S3, sourceMin: 0, sourceMax: 255, destMin: 0, destMax: 255 }
        transitions:
          - { to: Reg18, when: [], exitTime: 1.5 }
      Reg18:   # R20/S4
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Sc/SelIdx: 18
                SyncProbe/Sc/Strobe: 0
              copy:
                SyncProbe/Sc/Val: { source: SyncProbe/Ty/R20/S4, sourceMin: 0, sourceMax: 255, destMin: 0, destMax: 255 }
        transitions:
          - { to: Reg19, when: [], exitTime: 1.5 }
      Reg19:   # R20/Big
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Sc/SelIdx: 19
                SyncProbe/Sc/Strobe: 1
              copy:
                SyncProbe/Sc/Val: { source: SyncProbe/Ty/R20/Big, sourceMin: 0, sourceMax: 255, destMin: 0, destMax: 255 }
        transitions:
          - { to: Reg20, when: [], exitTime: 1.5 }
      Reg20:   # TornCount
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Sc/SelIdx: 20
                SyncProbe/Sc/Strobe: 0
              copy:
                SyncProbe/Sc/Val: { source: SyncProbe/Ty/TornCount, sourceMin: 0, sourceMax: 255, destMin: 0, destMax: 255 }
        transitions:
          - { to: Reg0, when: [], exitTime: 1.5 }
    default: Split
  # Reset: the wearer's menu button clears tallies on EVERY client (localOnly
  # false) and re-stages Prev from Cur so the first post-reset delivery is not a
  # spurious big-jump.
  - name: SyncProbe/Reset
    states:
      Idle:
        motion: ~
        transitions:
          - { to: Clear, when: [ SyncProbe/Reset is true ] }
      Clear:
        motion: ~
        behaviours:
          - driver:
              set:
                SyncProbe/Ty/R05/S1: 0
                SyncProbe/Ty/R05/S2: 0
                SyncProbe/Ty/R05/S3: 0
                SyncProbe/Ty/R05/S4: 0
                SyncProbe/Ty/R05/Big: 0
                SyncProbe/Ty/R10B/S1: 0
                SyncProbe/Ty/R10B/S2: 0
                SyncProbe/Ty/R10B/S3: 0
                SyncProbe/Ty/R10B/S4: 0
                SyncProbe/Ty/R10B/Big: 0
                SyncProbe/Ty/R10G/S1: 0
                SyncProbe/Ty/R10G/S2: 0
                SyncProbe/Ty/R10G/S3: 0
                SyncProbe/Ty/R10G/S4: 0
                SyncProbe/Ty/R10G/Big: 0
                SyncProbe/Ty/R20/S1: 0
                SyncProbe/Ty/R20/S2: 0
                SyncProbe/Ty/R20/S3: 0
                SyncProbe/Ty/R20/S4: 0
                SyncProbe/Ty/R20/Big: 0
                SyncProbe/Ty/TornCount: 0
              copy:
                SyncProbe/Dc/R05/Prev: SyncProbe/Dc/R05/Cur
                SyncProbe/Dc/R10B/Prev: SyncProbe/Dc/R10B/Cur
                SyncProbe/Dc/R10G/Prev: SyncProbe/Dc/R10G/Cur
                SyncProbe/Dc/R20/Prev: SyncProbe/Dc/R20/Cur
        transitions:
          - { to: Idle, when: [ SyncProbe/Reset is false ] }
    default: Idle

clips:
  # Frametime rig. tangents: linear is REQUIRED — flat tangents stair-step Time.
  ft_time_ramp: { curves: { SyncProbe/Ft/Time: { tangents: linear, keys: [ [0, 0], [10000000, 10000000] ] } } }
  ft_pos:   { set: { SyncProbe/Ft/FrameTime: 1.0 } }
  ft_neg:   { set: { SyncProbe/Ft/FrameTime: -1.0 } }
  ft_stage: { set: { SyncProbe/Ft/LastTime: 1.0 } }
  # Delta / sum endpoints.
  delta_r05_pos: { set: { SyncProbe/Dc/R05/Delta: 1.0 } }
  delta_r05_neg: { set: { SyncProbe/Dc/R05/Delta: -1.0 } }
  delta_r10b_pos: { set: { SyncProbe/Dc/R10B/Delta: 1.0 } }
  delta_r10b_neg: { set: { SyncProbe/Dc/R10B/Delta: -1.0 } }
  delta_r10g_pos: { set: { SyncProbe/Dc/R10G/Delta: 1.0 } }
  delta_r10g_neg: { set: { SyncProbe/Dc/R10G/Delta: -1.0 } }
  delta_r20_pos: { set: { SyncProbe/Dc/R20/Delta: 1.0 } }
  delta_r20_neg: { set: { SyncProbe/Dc/R20/Delta: -1.0 } }
  tornsum_a: { set: { SyncProbe/Dc/TornSum: 1.0 } }
  tornsum_b: { set: { SyncProbe/Dc/TornSum: 1.0 } }
  # Relay rest: every sender's full rest vector in ONE clip (weight One), so each
  # m_LocalPosition is written whole across the tree's union.
  relay_rest:
    set:
      "Rig/R05/S/Transform.m_LocalPosition.x": 0
      "Rig/R05/S/Transform.m_LocalPosition.y": 0
      "Rig/R05/S/Transform.m_LocalPosition.z": 0.15
      "Rig/R10B/S/Transform.m_LocalPosition.x": 0
      "Rig/R10B/S/Transform.m_LocalPosition.y": 0
      "Rig/R10B/S/Transform.m_LocalPosition.z": 0.15
      "Rig/R10G/S/Transform.m_LocalPosition.x": 0
      "Rig/R10G/S/Transform.m_LocalPosition.y": 0
      "Rig/R10G/S/Transform.m_LocalPosition.z": 0.15
      "Rig/R20/S/Transform.m_LocalPosition.x": 0
      "Rig/R20/S/Transform.m_LocalPosition.y": 0
      "Rig/R20/S/Transform.m_LocalPosition.z": 0.15
      "Rig/Torn/A/S/Transform.m_LocalPosition.x": 0
      "Rig/Torn/A/S/Transform.m_LocalPosition.y": 0
      "Rig/Torn/A/S/Transform.m_LocalPosition.z": 0.15
      "Rig/Torn/B/S/Transform.m_LocalPosition.x": 0
      "Rig/Torn/B/S/Transform.m_LocalPosition.y": 0
      "Rig/Torn/B/S/Transform.m_LocalPosition.z": 0.15
      "Rig/Scan/Val/S/Transform.m_LocalPosition.x": 0
      "Rig/Scan/Val/S/Transform.m_LocalPosition.y": 0
      "Rig/Scan/Val/S/Transform.m_LocalPosition.z": 0.15
      "Rig/Scan/Sel/S/Transform.m_LocalPosition.x": 0
      "Rig/Scan/Sel/S/Transform.m_LocalPosition.y": 0
      "Rig/Scan/Sel/S/Transform.m_LocalPosition.z": 0.15
  # Per-channel step endpoints: pos.z contribution = value * step.
  relay_r05_step: { set: { "Rig/R05/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_r10b_step: { set: { "Rig/R10B/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_r10g_step: { set: { "Rig/R10G/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_r20_step: { set: { "Rig/R20/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_torna_step: { set: { "Rig/Torn/A/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_tornb_step: { set: { "Rig/Torn/B/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_scanval_step: { set: { "Rig/Scan/Val/S/Transform.m_LocalPosition.z": 0.02 } }
  relay_scansel_step: { set: { "Rig/Scan/Sel/S/Transform.m_LocalPosition.z": 0.24 } }
  # Strobe rides sender scale (0 or 1 — driver-set), read by a Constant receiver.
  relay_strobe_on:
    set:
      "Rig/Scan/SStrobe/Transform.m_LocalScale.x": 1
      "Rig/Scan/SStrobe/Transform.m_LocalScale.y": 1
      "Rig/Scan/SStrobe/Transform.m_LocalScale.z": 1
  # Heartbeat: complementary GO actives, half-period per clip.
  hb_a:
    seconds: 0.5
    set:
      "Rig/Hb/SA/GameObject.m_IsActive": 1
      "Rig/Hb/SB/GameObject.m_IsActive": 0
  hb_b:
    seconds: 0.5
    set:
      "Rig/Hb/SA/GameObject.m_IsActive": 0
      "Rig/Hb/SB/GameObject.m_IsActive": 1

menu:
  - button: Reset
    param: SyncProbe/Reset
