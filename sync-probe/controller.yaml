      Split:
        motion: ~
        transitions:
          - { to: Dead, when: [ IsLocal is false ] }
          - { to: Watch, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      Watch:
        motion: ~
        transitions:
          - { to: Band0, when: [ SyncProbe/Ft/FrameTime less 0.011765 ] }
          - { to: Band1, when: [ SyncProbe/Ft/FrameTime greater 0.011765, SyncProbe/Ft/FrameTime less 0.015152 ] }
          - { to: Band2, when: [ SyncProbe/Ft/FrameTime greater 0.015152, SyncProbe/Ft/FrameTime less 0.019231 ] }
          - { to: Band3, when: [ SyncProbe/Ft/FrameTime greater 0.019231, SyncProbe/Ft/FrameTime less 0.027027 ] }
          - { to: Band4, when: [ SyncProbe/Ft/FrameTime greater 0.027027, SyncProbe/Ft/FrameTime less 0.037037 ] }
          - { to: Band5, when: [ SyncProbe/Ft/FrameTime greater 0.037037, SyncProbe/Ft/FrameTime less 0.057143 ] }
          - { to: Band6, when: [ SyncProbe/Ft/FrameTime greater 0.057143, SyncProbe/Ft/FrameTime less 0.08 ] }
          - { to: Band7, when: [ SyncProbe/Ft/FrameTime greater 0.08, SyncProbe/Ft/FrameTime less 0.111111 ] }
          - { to: Band8, when: [ SyncProbe/Ft/FrameTime greater 0.111111 ] }
