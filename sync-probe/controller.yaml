  # Stride tallies. Idle's ladder fires when Delta leaves (-0.5, 0.5); every bucket
  # has its positive range and its mod-256 wrap range as separate OR rungs. The
  # bucket driver Adds the tally and re-stages Prev; two Cool frames let the Delta
  # AAP settle against the new Prev before Idle re-arms — so classification is
  # valid only while the delivery interval clears ~5-6 frames (README: the 0.05s
  # rung's tally is advisory; its truth is the live relay stream).
  - name: SyncProbe/Tally/R05
    states:
      Split:
        motion: ~
        transitions:
          - { to: Idle, when: [ IsLocal is false ] }
          - { to: Dead, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      Idle:
        motion: ~
        transitions:
          - { to: S1, when: [ SyncProbe/Dc/R05/Delta greater 0.5, SyncProbe/Dc/R05/Delta less 1.5 ] }
          - { to: S1, when: [ SyncProbe/Dc/R05/Delta greater -255.5, SyncProbe/Dc/R05/Delta less -254.5 ] }
          - { to: S2, when: [ SyncProbe/Dc/R05/Delta greater 1.5, SyncProbe/Dc/R05/Delta less 2.5 ] }
          - { to: S2, when: [ SyncProbe/Dc/R05/Delta greater -254.5, SyncProbe/Dc/R05/Delta less -253.5 ] }
