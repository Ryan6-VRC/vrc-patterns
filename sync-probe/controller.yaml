  # Heartbeat: 0.5s half-period flip-flop of complementary GO-active clips — pure
  # local time. Exactly one of HbA/HbB active at any instant on a healthy relay.
  - name: SyncProbe/Heartbeat
    states:
      HbA:
        motion: { clip: hb_a }
        transitions:
          - { to: HbB, when: [], exitTime: 1.0 }
      HbB:
        motion: { clip: hb_b }
        transitions:
          - { to: HbA, when: [], exitTime: 1.0 }
    default: HbA
  # Scan bus: 21 registers round-robined at 1.5s per register onto three
  # analog lines. Val saturates at 255 (the convertRange clamp — reset between
  # segments keeps tallies under it); the strobe flips as each register latches,
  # so a logger reads Val/Sel only between strobe edges.
  - name: SyncProbe/Scan
    states:
      Split:
        motion: ~
        transitions:
          - { to: Reg0, when: [ IsLocal is false ] }
          - { to: Dead, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      Reg0:   # R05/S1
        motion: ~
