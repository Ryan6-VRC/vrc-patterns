  # Torn tally: Sum != 255 persisting 3 frames counts one torn event; Count
  # waits for the pair to re-agree so one event never counts twice.
  - name: SyncProbe/TornTally
    states:
      Split:
        motion: ~
        transitions:
          - { to: Idle, when: [ IsLocal is false ] }
          - { to: Dead, when: [ IsLocal is true ] }
      Dead:
        motion: ~
      Idle:
        motion: ~
        transitions:
          - { to: Susp1, when: [ SyncProbe/Dc/TornSum less 254.5 ] }
          - { to: Susp1, when: [ SyncProbe/Dc/TornSum greater 255.5 ] }
      Susp1:
        motion: ~
        transitions:
          - { to: Idle, when: [ SyncProbe/Dc/TornSum greater 254.5, SyncProbe/Dc/TornSum less 255.5 ] }
          - { to: Susp2, when: [ SyncProbe/True is true ] }
      Susp2:
        motion: ~
        transitions:
          - { to: Idle, when: [ SyncProbe/Dc/TornSum greater 254.5, SyncProbe/Dc/TornSum less 255.5 ] }
          - { to: Susp3, when: [ SyncProbe/True is true ] }
      Susp3:
        motion: ~
        transitions:
          - { to: Idle, when: [ SyncProbe/Dc/TornSum greater 254.5, SyncProbe/Dc/TornSum less 255.5 ] }
          - { to: Count, when: [ SyncProbe/True is true ] }
      Count:
        motion: ~
        behaviours:
          - driver: { add: { SyncProbe/Ty/TornCount: 1 } }
        transitions:
          - { to: Idle, when: [ SyncProbe/Dc/TornSum greater 254.5, SyncProbe/Dc/TornSum less 255.5 ] }
