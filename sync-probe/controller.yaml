  # MirrorPump: wire Ints -> scratch floats, every frame (a blend tree reads an Int
  # as 0 — CheckAnimator's non-float-blend-param rule). Runs on every copy; on the
  # wearer's own it harmlessly mirrors the values being sent.
  - name: SyncProbe/Pump
    states:
      PumpA:
        motion: ~
        behaviours:
          - driver:
              copy:
