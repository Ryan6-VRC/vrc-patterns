# The leash's one FX layer. generate.py's docstring is the state-by-state record; rig.json is the prefab's numbers.
# Published, bare (globalParams): Leash/Right, Leash/Up, Leash/Forward, Leash/Present, Leash/Held, Leash/Planted, Leash/Chain*. Leash/Held is 1 in Held and PHeld,
# Leash/Planted is 1 in Plant and Planted, both latching. Leash/Enable is the one intent (synced, saved) and takes the instance prefix.
# Fades: plant 10 frames, pick-up 15 frames, proxy cycle 3 frames. L (rest chord of the chain) 0.9 m.

