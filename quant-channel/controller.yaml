  QC/U/Tau0_15: { type: float, aap: true, scratch: true }
  QC/Keep/Tau0_15: { type: float, aap: true, scratch: true }

layers:
  - name: QuantChannel
    states:
      "Local (WD ON)":
        motion:
          tree: direct
          name: LocalRoot
          children:
            - tree: 1d
              name: "QDemo/LX smooth (local)"
              param: QC/QDemo/LX/LambdaL
              directWeight: QC/One
              children:
                - tree: 1d
                  name: "QDemo/LX take input"
                  param: QDemo/LX
                  threshold: 0.0
                  children:
                    - { clip: Sm_QDemo_LX_neg, threshold: -1.0 }
                    - { clip: Sm_QDemo_LX_pos, threshold: 1.0 }
                - tree: 1d
                  name: "QDemo/LX keep old"
                  param: QDemo/LX/Smoothed
                  threshold: 1.0
                  children:
