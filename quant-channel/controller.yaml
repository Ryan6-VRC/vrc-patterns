                    - { clip: Dec_QDemo_RX_p2, directWeight: QDemo/RX2 }
                    - { clip: Dec_QDemo_RX_p4, directWeight: QDemo/RX4 }
                - tree: direct
                  name: "QDemo/RX -mag"
