                    - { clip: Sm_QDemo_RY_pos, threshold: 1.0 }
        transitions:
          - { to: "Remote (WD ON)", when: [ IsLocal is false ] }
          - { to: "Remote (WD ON)", when: [ QC/PreviewRemote is true ] }
      "Remote (WD ON)":
        motion:
          tree: direct
          name: RemoteRoot
          children:
            - { clip: QC_Time_Ramp, directWeight: QC/One }
            - tree: direct
              name: "FrameTime = Time - LastTime"
              directWeight: QC/One
              children:
                - { clip: QC_FrameTime_Pos, directWeight: QC/Time }
                - { clip: QC_FrameTime_Neg, directWeight: QC/LastTime }
                - { clip: QC_LastTime_Set,  directWeight: QC/Time }
            - tree: direct
              name: "U = dt/tau (Tau0_15)"
              directWeight: QC/One
              children:
                - tree: direct
                  directWeight: QC/FrameTime
                  children:
                    - { clip: U_One_Tau0_15, directWeight: QC/InvTau/Tau0_15 }
            - tree: direct
              name: "Keep = 1/(1+U) (Tau0_15)"
              directWeight: QC/One
              normalized: true
              children:
                - { clip: Keep_Dummy, directWeight: QC/U/Tau0_15 }
                - { clip: Keep_One_Tau0_15, directWeight: QC/One }
            - tree: 1d
              name: "QDemo/LX decode"
              param: QDemo/LXNegative
              directWeight: QC/One
              children:
                - tree: direct
                  name: "QDemo/LX +mag"
                  threshold: 0.0
                  children:
                    - { clip: Dec_QDemo_LX_p1, directWeight: QDemo/LX1 }
                    - { clip: Dec_QDemo_LX_p2, directWeight: QDemo/LX2 }
                    - { clip: Dec_QDemo_LX_p4, directWeight: QDemo/LX4 }
                - tree: direct
                  name: "QDemo/LX -mag"
