                - tree: 1d
                  name: "QDemo/LY keep old"
                  param: QDemo/LY/Smoothed
                  threshold: 1.0
                  children:
                    - { clip: Sm_QDemo_LY_neg, threshold: -1.0 }
                    - { clip: Sm_QDemo_LY_pos, threshold: 1.0 }
            - tree: 1d
              name: "QDemo/RX smooth (local)"
              param: QC/QDemo/RX/LambdaL
              directWeight: QC/One
              children:
                - tree: 1d
                  name: "QDemo/RX take input"
                  param: QDemo/RX
                  threshold: 0.0
                  children:
                    - { clip: Sm_QDemo_RX_neg, threshold: -1.0 }
                    - { clip: Sm_QDemo_RX_pos, threshold: 1.0 }
                - tree: 1d
                  name: "QDemo/RX keep old"
                  param: QDemo/RX/Smoothed
                  threshold: 1.0
                  children:
                    - { clip: Sm_QDemo_RX_neg, threshold: -1.0 }
                    - { clip: Sm_QDemo_RX_pos, threshold: 1.0 }
            - tree: 1d
              name: "QDemo/RY smooth (local)"
              param: QC/QDemo/RY/LambdaL
              directWeight: QC/One
              children:
                - tree: 1d
                  name: "QDemo/RY take input"
