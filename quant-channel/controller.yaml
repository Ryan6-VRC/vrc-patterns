  QDemo/RY/Smoothed: { type: float, aap: true }   # the output consumers bind
  QC/QDemo/RY/Decoded: { type: float, aap: true, scratch: true }
  QC/QDemo/RY/LambdaL: { type: float, default: 0, scratch: true }   # fixed keep, install-tunable
  QDemo/Enable: { type: float, vrc: { type: bool, synced: true, saved: false } }   # gate — consumers weight trees on it
  # Frametime rig (QC-internal; duplicated into each IsLocal state that compensates)
  QC/Time: { type: float, aap: true, scratch: true }
  QC/LastTime: { type: float, aap: true, scratch: true }
  QC/FrameTime: { type: float, aap: true, scratch: true }
  QC/Dummy: { type: float, aap: true, scratch: true }   # divide-idiom weight-sum inflator
