  # OSCQuery to pick the manifest. Synced unchecked, never NotSynced (a NotSynced param
  # is not registered and 404s). The SDK inspector truncates a >255 default on any
  # keystroke in its row — regenerate, don't hand-edit.
  QuantChannel/Manifest: { type: int, default: 1, vrc: { synced: false, saved: false } }
  # Preview door: force the Remote branch on the WEARER — their own /Smoothed then shows
  # the stepped decode. Unsynced (zero wire bits), unsaved, QC-prefixed so a merged build
  # instance-prefixes it; drive it by the name OSCQuery serves.
  QC/PreviewRemote: { type: bool, default: false, vrc: { synced: false, saved: false } }
  # QDemo/LX: 3-bit signed channel (4 synced bits + free unsynced float)
  QDemo/LX: { type: float, vrc: { synced: false } }   # OSC float companion — declared (osc.md: leave nothing OSC-written animator-only)
  QDemo/LX1: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LX2: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LX4: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LXNegative: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LX/Smoothed: { type: float, aap: true }   # the output consumers bind
  QC/QDemo/LX/Decoded: { type: float, aap: true, scratch: true }
  QC/QDemo/LX/LambdaL: { type: float, default: 0, scratch: true }   # fixed keep, install-tunable
  # QDemo/LY: 3-bit signed channel (4 synced bits + free unsynced float)
  QDemo/LY: { type: float, vrc: { synced: false } }   # OSC float companion — declared (osc.md: leave nothing OSC-written animator-only)
  QDemo/LY1: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LY2: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LY4: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LYNegative: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/LY/Smoothed: { type: float, aap: true }   # the output consumers bind
  QC/QDemo/LY/Decoded: { type: float, aap: true, scratch: true }
  QC/QDemo/LY/LambdaL: { type: float, default: 0, scratch: true }   # fixed keep, install-tunable
  # QDemo/RX: 3-bit signed channel (4 synced bits + free unsynced float)
  QDemo/RX: { type: float, vrc: { synced: false } }   # OSC float companion — declared (osc.md: leave nothing OSC-written animator-only)
  QDemo/RX1: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/RX2: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/RX4: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/RXNegative: { type: float, vrc: { type: bool, synced: true, saved: false } }
  QDemo/RX/Smoothed: { type: float, aap: true }   # the output consumers bind
  QC/QDemo/RX/Decoded: { type: float, aap: true, scratch: true }
  QC/QDemo/RX/LambdaL: { type: float, default: 0, scratch: true }   # fixed keep, install-tunable
  # QDemo/RY: 3-bit signed channel (4 synced bits + free unsynced float)
  QDemo/RY: { type: float, vrc: { synced: false } }   # OSC float companion — declared (osc.md: leave nothing OSC-written animator-only)
  QDemo/RY1: { type: float, vrc: { type: bool, synced: true, saved: false } }
