# selective-animation — tag one player by pointing at them; their copy of your avatar holds the state.
# Mechanism from VRLabs' MIT Selective-Animation (github.com/VRLabs/Selective-Animation), rebuilt on the
# native VRCRaycast the SDK has since shipped: the ancestor reconstructed a hit flag out of FinalIK
# Grounders and spatial coincidence because no component reported one. `_Hit` reports it directly.
#
# WHY THIS IS POSSIBLE AT ALL, in one paragraph, because every condition below rests on it:
# every client runs its own copy of this raycast, and the ONLY player collider on a given client is that
# client's own capsule (runtime.md §Other load-bearing components). So the ray evaluates a different world
# on every machine, and `_Hit` is true on exactly the machines whose owner the ray crosses. A latch keyed
# on (_Hit AND a synced command) therefore fires per-observer, and NOTHING identifying an observer ever
# crosses the wire -- which is the only reason per-player targeting is reachable at all, since an avatar
# has no way to address or name an observer.
#
# THE LATCH IS THE STATE, NOT A PARAMETER. `Tagged` is a state this layer sits in, so the animator's own
# position is the memory -- no parameter driver is needed to hold it, and a mirror clone (which replays
# params but runs no StateMachineBehaviours, runtime.md) reaches it through the entry ladder. The state's
# driver exports SelectiveAnimation/Tagged for consumers gating their OWN layers; the export is what a
# mirror clone misses, not the latch.
#
# Durability is `runtime.md`'s cull table, measured in-game: view cull and distance-hide PAUSE the
# observer's animator without rebuilding it (the latch survives both), manual hide/show is the sole
# rebuild path (the latch dies). Avatar switch and re-load likewise. Re-pointing is the only repair, which
# is why the command is HELD rather than pulsed -- see the Command layer.
#
# SYNCED SURFACE IS 3 BITS: Enable, Paint, Erase. The raycast's own params are never synced (a natively
# driven param is re-driven every frame locally, so a synced copy is a wasted bit AND reads the wearer's
# replicated value on a clone rather than that clone's own ray -- docs/verify.md). SelfTag and PaintMenu
# are unsynced: both are wearer-local intents whose only outcome is on the wearer's own screen.

schema: 1
controller: SelectiveAnimation_Fx
basis: mount-root          # paths bind against the module prefab root (VRCFury FullController seam)
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  # --- the sync surface (3 bits) ---
  SelectiveAnimation/Enable: { type: bool, default: false, vrc: { synced: true, saved: false } }
  # The held command. Stamped by the wearer's localOnly drivers in the Command layer; every observer's
  # latch reads it. Synced because an observer must know the wearer is commanding right now.
  SelectiveAnimation/Paint:  { type: bool, default: false, vrc: { synced: true, saved: false } }
  # The mode, not a second command: it flips what a hit WRITES. Synced for the same reason as Paint.
  SelectiveAnimation/Erase:  { type: bool, default: false, vrc: { synced: true, saved: false } }

  # --- wearer-local intents, 0 synced bits ---
  # Self-tag. Purely local: your own copy is the one you see, so nothing needs to reach an observer.
  # Read by the Latch layer's TRANSITIONS (never a driver) so the mirror clone follows it too.
  SelectiveAnimation/SelfTag:   { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Menu parity for the point gesture (gimmicks.md §In-game UX: every affordance-reachable intent is also
  # menu-reachable). ORed with the gesture into the one synced Paint, so parity costs no extra bit.
  SelectiveAnimation/PaintMenu: { type: bool, default: false, vrc: { synced: false, saved: false } }

  # --- sensing: the two rays. Never synced, never saved, never menu-exposed. ---
  # Ray = the player ray, masked to PlayerLocal ALONE (see the prefab's Rig section). Wall = the world ray
  # whose only job is to keep the tag from passing through geometry.
  SelectiveAnimation/Ray_Hit:    bool
  SelectiveAnimation/Ray_Ratio:  float
  SelectiveAnimation/Wall_Ratio: float

  # --- computed ---
  # Clearance = Wall_Ratio - Ray_Ratio: positive when the player hit is NEARER than the world hit, i.e.
  # nothing solid stands between. Both rays share one `distance`, which is what makes their ratios
  # comparable -- the constants table's one hard invariant.
  SelectiveAnimation/Clear:  { type: float, aap: true }
  # The export. Written by the Latch states (localOnly false: every client stamps its own) so a consumer
  # can gate an existing layer on one bool instead of copying this machine.
  SelectiveAnimation/Tagged: { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Constant-1 Direct-tree weight.
  SelectiveAnimation/One:    { type: float, default: 1.0, scratch: true }

  IsLocal:      bool         # VRC built-in
  GestureRight: int          # VRC built-in — 3 is FingerPoint, the affordance

layers:
  # ===== Compute — always-on WD-ON Direct root: the clearance test and the beam's length =====
  # Both are pure arithmetic over the two rays' ratios, so they share one always-on state. An optimizer
  # flattens always-on Direct-tree layers regardless (gimmicks.md "Layers are author-time legibility").
  - name: SelectiveAnimation/Compute
    states:
      "Compute (WD ON)":
        motion:
          tree: direct
          name: Compute
          children:
            # Clearance = Wall_Ratio - Ray_Ratio. The sign lives in the clip's curve value, never in the
            # weight -- Unity clamps a directWeight to >=0 (vrc-patterns/blendtree-math §Subtract).
            - tree: direct
              name: Clearance
              directWeight: SelectiveAnimation/One
              children:
                - { clip: sa_clear_pos, directWeight: SelectiveAnimation/Wall_Ratio }
                - { clip: sa_clear_neg, directWeight: SelectiveAnimation/Ray_Ratio }
            # Beam length rides the WORLD ray, which is the only one that reports a real distance on the
            # wearer's own machine: their player ray registers no remote capsule, so Ray_Ratio is pinned
            # at 1 for them and could never shorten the beam. The beam therefore shows reach and occlusion
            # honestly, and stops short only at geometry.
            - tree: 1d
              name: "Beam length"
              param: SelectiveAnimation/Wall_Ratio
              directWeight: SelectiveAnimation/One
              children:
                - { clip: sa_beam_min, threshold: 0.0 }
                - { clip: sa_beam_max, threshold: 1.0 }
    default: "Compute (WD ON)"

  # ===== Latch — the feature. The state IS the per-observer memory. =====
  # Tagged and SelfTagged play the SAME payload clip and differ only in why they were entered, because
  # they must leave on different conditions: an observer's tag ends on the ray or the all-clear, the
  # wearer's ends when the menu bool drops. One shared state could not tell the two apart -- its exit
  # would either strand the wearer's copy or untag every observer the instant it read SelfTag false.
  - name: SelectiveAnimation/Latch
    states:
      Untagged:
        behaviours:
          - driver: { set: { SelectiveAnimation/Tagged: 0 } }
        motion: { clip: sa_untagged }
        transitions:
          # The wearer's own copy: self-tag is a menu intent, never the ray. SelfTag needs no IsLocal
          # guard because being UNSYNCED is already the discriminator -- it never crosses the wire, so a
          # remote reads its default forever (measured), while a mirror clone replays the wearer's value.
          # Testing the param rather than IsLocal is what lets a mirror clone that is ALREADY spawned
          # follow a self-tag; an IsLocal-gated rung would leave it stale until its next entry.
          # Keep it unsynced: declaring it synced would broadcast your self-tag to everyone.
          - { to: SelfTagged, when: [ SelectiveAnimation/Enable is true, SelectiveAnimation/SelfTag is true ] }
          # The observer's copy. Clear fences the tag behind geometry; Erase false makes this the paint case.
          - { to: Tagged, when: [ IsLocal is false, SelectiveAnimation/Enable is true, SelectiveAnimation/Paint is true, SelectiveAnimation/Erase is false, SelectiveAnimation/Ray_Hit is true, SelectiveAnimation/Clear greater -0.02 ] }
      Tagged:
        behaviours:
          - driver: { set: { SelectiveAnimation/Tagged: 1 } }
        motion: { clip: sa_tagged }
        transitions:
          # Enable-off IS the all-clear, on every client at once -- which is why this entry ships no
          # separate failsafe control (gimmicks.md §In-game UX splits enable / options / failsafe, and
          # off-is-reset already fills the third slot here).
          - { to: Untagged, when: [ SelectiveAnimation/Enable is false ] }
          # Point-to-untag: the same gesture and the same ray, with Erase flipping what the hit writes.
          - { to: Untagged, when: [ SelectiveAnimation/Paint is true, SelectiveAnimation/Erase is true, SelectiveAnimation/Ray_Hit is true, SelectiveAnimation/Clear greater -0.02 ] }
      SelfTagged:
        behaviours:
          - driver: { set: { SelectiveAnimation/Tagged: 1 } }
        motion: { clip: sa_tagged }
        transitions:
          - { to: Untagged, when: [ SelectiveAnimation/Enable is false ] }
          - { to: Untagged, when: [ SelectiveAnimation/SelfTag is false ] }
    # A mirror clone traverses fresh from Entry, so the wearer's self-tag must also be reachable as an
    # entry rung or a clone spawned while already self-tagged starts untagged -- and a mirror is the one
    # place a wearer sees their own avatar at all.
    entry:
      - { to: SelfTagged, when: [ SelectiveAnimation/Enable is true, SelectiveAnimation/SelfTag is true ] }
    default: Untagged
    # Lifecycle descends from Untagged; the two tagged lanes fan below it, the wearer's outboard right.
    layout:
      nodes:
        Untagged:   [30, 180]
        Tagged:     [-90, 280]
        SelfTagged: [150, 280]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

  # ===== Command — the wearer's surface: stamps the synced command, drives the wearer-only beam. =====
  # Runs on every client but leaves Off only on IsLocal, so remotes never render the beam and never stamp.
  - name: SelectiveAnimation/Command
    states:
      Disabled:
        behaviours:
          - driver: { localOnly: true, set: { SelectiveAnimation/Paint: 0 } }
        motion: { clip: sa_beam_off }
        transitions:
          - { to: Ready, when: [ IsLocal is true, SelectiveAnimation/Enable is true ] }
      # Armed, not commanding. The beam is up so the wearer can see their reach and who stands in it
      # BEFORE committing -- the ray tags everyone whose capsule the line crosses, so seeing the line is
      # the only defence against over-painting.
      Ready:
        behaviours:
          - driver: { localOnly: true, set: { SelectiveAnimation/Paint: 0 } }
        motion: { clip: sa_beam_ready }
        transitions:
          - { to: Disabled, when: [ SelectiveAnimation/Enable is false ] }
          - { to: Erasing,  when: [ SelectiveAnimation/Erase is true, GestureRight equals 3 ] }
          - { to: Erasing,  when: [ SelectiveAnimation/Erase is true, SelectiveAnimation/PaintMenu is true ] }
          - { to: Painting, when: [ GestureRight equals 3 ] }
          - { to: Painting, when: [ SelectiveAnimation/PaintMenu is true ] }
      # HELD, not pulsed. An observer who has the wearer view-culled is not evaluating this avatar's
      # animator at all, so a momentary command rises and falls unseen (runtime.md); a held one latches
      # the frame they turn back and resume. Holding is also what makes re-painting a room after reloads
      # one sweep rather than N presses.
      Painting:
        behaviours:
          - driver: { localOnly: true, set: { SelectiveAnimation/Paint: 1 } }
        motion: { clip: sa_beam_paint }
        transitions:
          - { to: Disabled, when: [ SelectiveAnimation/Enable is false ] }
          - { to: Erasing, when: [ SelectiveAnimation/Erase is true ] }
          - { to: Ready,   when: [ GestureRight notEqual 3, SelectiveAnimation/PaintMenu is false ] }
      Erasing:
        behaviours:
          - driver: { localOnly: true, set: { SelectiveAnimation/Paint: 1 } }
        motion: { clip: sa_beam_erase }
        transitions:
          - { to: Disabled, when: [ SelectiveAnimation/Enable is false ] }
          - { to: Painting, when: [ SelectiveAnimation/Erase is false ] }
          - { to: Ready,    when: [ GestureRight notEqual 3, SelectiveAnimation/PaintMenu is false ] }
    default: Disabled
    # Lifecycle descends Off -> Ready; the two command modes fan one row below Ready.
    layout:
      nodes:
        Disabled: [30, 180]
        Ready:    [30, 260]
        Painting: [-90, 340]
        Erasing:  [150, 340]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

# Rig: Aim (MA BoneProxy -> Right Hand) / Origin carries both raycasts and the beam; Payload is the
# placeholder output. Every clip owns its full property set explicitly (no reliance on WD revert; survives
# WD-OFF conversion), and every transform-vector clip writes all three components -- the animator drives an
# unbound component to 0 rather than leaving it at rest (docs/animator-schema.md §clips).
clips:
  # Clearance endpoints: bare declared-parameter writes, so they compile to animator-parameter curves.
  sa_clear_pos: { set: { SelectiveAnimation/Clear: 1 } }
  sa_clear_neg: { set: { SelectiveAnimation/Clear: -1 } }

  # Beam length is unitless here: Beam's scale.z of 1 IS full range, because BeamMesh is authored to span
  # the range in the prefab. So retuning the range touches the prefab only, never this document.
  sa_beam_min:
    set:
      "Aim/Origin/Beam/Transform.m_LocalScale.x": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.y": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.z": 0
  sa_beam_max:
    set:
      "Aim/Origin/Beam/Transform.m_LocalScale.x": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.y": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.z": 1

  # Beam mode. Colour is the wearer's ONLY readout of which mode a hit will write, and they are otherwise
  # blind -- no hit ever registers on the pointer's own machine, so nothing else can confirm the command.
  sa_beam_off:
    set:
      "Aim/Origin/Beam/GameObject.m_IsActive": 0
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.r": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.g": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.b": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.a": 1
  sa_beam_ready:
    set:
      "Aim/Origin/Beam/GameObject.m_IsActive": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.r": 0.6
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.g": 0.6
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.b": 0.6
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.a": 1
  sa_beam_paint:
    set:
      "Aim/Origin/Beam/GameObject.m_IsActive": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.r": 0.1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.g": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.b": 0.3
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.a": 1
  sa_beam_erase:
    set:
      "Aim/Origin/Beam/GameObject.m_IsActive": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.r": 1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.g": 0.2
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.b": 0.1
      "Aim/Origin/Beam/BeamMesh/MeshRenderer.material._Color.a": 1

  # The payload, and the whole of it: swap this pair's content (or the Payload child) for your effect.
  sa_untagged: { set: { "Payload/GameObject.m_IsActive": 0 } }
  sa_tagged:   { set: { "Payload/GameObject.m_IsActive": 1 } }
