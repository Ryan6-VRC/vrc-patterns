# selective-animation — tag one player by pointing at them; their copy of your avatar holds the state.
# Mechanism from VRLabs' MIT Selective-Animation (github.com/VRLabs/Selective-Animation), rebuilt on the
# native VRCRaycast the SDK has since shipped: the ancestor reconstructed a hit flag out of FinalIK
# Grounders and spatial coincidence because no component reported one. `_Hit` reports it directly.
#
# WHY THIS IS POSSIBLE AT ALL, in one paragraph, because every condition below rests on it:
# every client runs its own copy of this raycast, and the ONLY player collider on a given client is that
# client's own capsule (runtime.md §Other load-bearing components). So the ray evaluates a different world
# on every machine, and `_Hit` is true on exactly the machines whose owner the ray crosses. A latch keyed
# on (_Hit AND a synced command) therefore fires per-observer, and NOTHING identifying an observer ever
# crosses the wire -- which is the only reason per-player targeting is reachable at all, since an avatar
# has no way to address or name an observer.
#
# THE LATCH IS THE STATE, NOT A PARAMETER. `Tagged_*` is a state this layer sits in, so the animator's own
# position is the memory and no parameter driver is needed to hold it. The state's driver also exports
# SelectiveAnimation/Tagged for consumers gating their OWN layers -- and that export is what makes the
# latch survive cloning: a mirror clone traverses fresh from Entry and runs no StateMachineBehaviours, so
# it cannot re-derive the latch, but it does INHERIT the driven parameter value (vrc-patterns/mirror-detect
# rests on exactly that: "the mirror clone enters later with the driver-set true value"). The entry ladder
# reads the export back, which is the only reason a tagged observer sees the tag in a mirror too.
#
# THERE IS NO ENABLE AND NO ARMED STATE. The module is intrinsically off: the rig casts only while the Tag
# button is held, so a wearer who is not tagging bills nothing but this controller's own evaluation. The
# two on-ramps are the held command and the erase generation, with nothing persistent sitting between them.
#
# ERASE IS A PARITY BIT, NOT A COMMAND. `Gen` flips on each erase and every latch remembers the generation
# it was made under, so an erase is level-triggered forever rather than for as long as it is asserted --
# an observer whose animator is paused picks it up whenever they resume. THE KNOWN RESIDUE: parity, not a
# counter. An EVEN number of erases spanning one pause leaves that observer tagged, and the wearer cannot
# see that it happened (they never register a hit -- see the Rig section). A wider counter would cost one
# Tagged state per value; the trade was priced and refused.
#
# SYNCED SURFACE IS 2 BITS: Tag and Gen. Erase and SelfTag are unsynced -- both are wearer-local intents,
# and Erase being unsynced is what parks every remote in the Flip layer's Idle structurally. The raycast's
# own params are never synced (a natively driven param is re-driven every frame locally, so a synced copy
# is a wasted bit AND reads the wearer's replicated value on a clone rather than that clone's own ray --
# docs/verify.md).

schema: 1
controller: SelectiveAnimation_Fx
basis: mount-root          # paths bind against the module prefab root (VRCFury FullController seam)
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  # --- the sync surface (2 bits) ---
  # The held command, and the rig's whole lifecycle: a menu Button holds it while pressed (the SDK holds a
  # Button active for a minimum 0.2 s, so a tap still spans ~2 sync ticks). FLOAT on the animator and BOOL
  # on the params asset -- a blend tree weight reads only Float, and a name-matched Bool does not error, it
  # reads 0 and sits on the zero branch forever (vut ControllerRules §nonFloatBlendParam, measured live).
  # So this is one synced bit that a tree can also weight.
  SelectiveAnimation/Tag: { type: float, default: 0.0, vrc: { type: bool, synced: true, saved: false } }
  # The erase generation. Read by transitions only -- never a tree weight, so it stays a plain bool.
  SelectiveAnimation/Gen: { type: bool, default: false, vrc: { synced: true, saved: false } }

  # --- wearer-local intents, 0 synced bits ---
  # The erase button. Unsynced, which is load-bearing twice over: it is why the Flip layer needs no IsLocal
  # gate (a remote reads the default forever and never leaves Idle) and why only the flipped Gen crosses.
  SelectiveAnimation/Erase:   { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Self-tag. Purely local: your own copy is the one you see, so nothing needs to reach an observer.
  # Read by the Latch layer's TRANSITIONS (never a driver) so the mirror clone follows it too.
  SelectiveAnimation/SelfTag: { type: bool, default: false, vrc: { synced: false, saved: false } }

  # --- sensing: the two rays. Never synced, never saved, never menu-exposed. ---
  # Ray = the player ray, masked to PlayerLocal ALONE (see the prefab's Rig section). Wall = the world ray
  # whose only job is to keep the tag from passing through geometry.
  SelectiveAnimation/Ray_Hit:    bool
  SelectiveAnimation/Ray_Ratio:  float
  SelectiveAnimation/Wall_Ratio: float

  # --- computed ---
  # Clearance = Wall_Ratio - Ray_Ratio: positive when the player hit is NEARER than the world hit, i.e.
  # nothing solid stands between. Both rays share one `distance`, which is what makes their ratios
  # comparable -- the constants table's one hard invariant.
  SelectiveAnimation/Clear:   { type: float, aap: true }
  # The two-stage gate on Clear. Each is read one evaluation after it is written (a clip's write is
  # invisible until the next evaluation), so chaining them holds Clear at 0 for two frames after the rig
  # comes up. See the Compute layer -- this is what makes a frozen sensing set unreachable.
  SelectiveAnimation/Casting: { type: float, aap: true }
  SelectiveAnimation/Armed:   { type: float, aap: true }
  # The export. Written by the Latch states (localOnly false: every client stamps its own) so a consumer
  # can gate an existing layer on one bool instead of copying this machine.
  SelectiveAnimation/Tagged:  { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Constant-1 Direct-tree weight.
  SelectiveAnimation/One:     { type: float, default: 1.0, scratch: true }

  # VRC built-in, declared FLOAT so the beam can be a tree branch rather than a state gate. The reserved
  # list carries names without types, and shipping vendor controllers declare it both ways. The cost is
  # legibility: every condition on it reads `greater 0.5` / `less 0.5`, because Unity forbids float
  # equality and the compiler validates the operator against the declared type.
  IsLocal: float

layers:
  # ===== Compute — the whole rig, as one always-on WD-ON Direct root =====
  # Everything here is either arithmetic or an on/off flag, which is exactly what a Direct tree does
  # statelessly; none of it needs a state machine, and a separate layer for it is per-frame cost for
  # nothing (gimmicks.md "Layers are author-time legibility").
  - name: SelectiveAnimation/Compute
    states:
      "Compute (WD ON)":
        motion:
          tree: direct
          name: Compute
          children:
            # The rig's lifecycle. A 1D tree rather than a weighted Direct child because m_IsActive is a
            # DISCRETE binding: Unity does not interpolate it, so a lone Direct child at weight 0 is not
            # reliably off, while a 1D pair puts full weight on an explicit stowed clip at Tag 0.
            - tree: 1d
              name: Rig
              param: SelectiveAnimation/Tag
              directWeight: SelectiveAnimation/One
              children:
                - { clip: sa_rig_stowed,  threshold: 0.0 }
                - { clip: sa_rig_casting, threshold: 1.0 }
            # Gate stage two. Weighted by Casting, writing Armed, so Armed trails Tag by two evaluations.
            - { clip: sa_armed, directWeight: SelectiveAnimation/Casting }
            # Clearance = Wall_Ratio - Ray_Ratio. The sign lives in the clip's curve value, never in the
            # weight -- Unity clamps a directWeight to >=0 (vrc-patterns/blendtree-math §Subtract).
            # Gated on Armed rather than One, and that gate is the entry's one real safety mechanism: a
            # disabled raycast FREEZES its parameters at their last values rather than zeroing them, so
            # pressing Tag while pointing at nothing would otherwise commit the previous press's hit on
            # the first frame. Two frames of zeroed Clear outlast the rig's activation latency.
            - tree: direct
              name: Clearance
              directWeight: SelectiveAnimation/Armed
              children:
                - { clip: sa_clear_pos, directWeight: SelectiveAnimation/Wall_Ratio }
                - { clip: sa_clear_neg, directWeight: SelectiveAnimation/Ray_Ratio }
            # The beam is gated on IsLocal ALONE. Held-only comes from the hierarchy instead: Beam is a
            # child of Origin, which this layer stows whenever Tag is released, so a remote needs only the
            # IsLocal branch and the wearer needs no second condition. Reparenting Beam out of Origin
            # would leave it lit permanently -- the Rig section is the spec that keeps that from happening.
            - tree: 1d
              name: "Beam visibility"
              param: IsLocal
              directWeight: SelectiveAnimation/One
              children:
                - { clip: sa_beam_off, threshold: 0.0 }
                - { clip: sa_beam_on,  threshold: 1.0 }
            # Beam length rides the WORLD ray, which is the only one that reports a distance the wearer
            # can act on: their player ray never registers the person they are aiming at (no remote
            # carries a capsule on their machine), so it reports either their own body or nothing, and
            # could not shorten the beam toward a target. The beam shows reach and occlusion honestly,
            # and stops short only at geometry.
            - tree: 1d
              name: "Beam length"
              param: SelectiveAnimation/Wall_Ratio
              directWeight: SelectiveAnimation/One
              children:
                - { clip: sa_beam_min, threshold: 0.0 }
                - { clip: sa_beam_max, threshold: 1.0 }
    default: "Compute (WD ON)"

  # ===== Latch — the feature. The state IS the per-observer memory. =====
  # Tagged_Off and Tagged_On play the SAME payload clip and carry the SAME driver. They are two states
  # because the generation a latch was made under is the only thing that can invalidate it, and a state
  # machine remembers a generation by being in a different state.
  - name: SelectiveAnimation/Latch
    states:
      Untagged:
        behaviours:
          - driver: { set: { SelectiveAnimation/Tagged: 0 } }
        motion: { clip: sa_untagged }
        transitions:
          # The observer's copy. Ray_Hit is belt-and-braces: under SnapToEnd a miss reports _Ratio 1.0, so
          # Clear > 0 already implies a player hit. It guards the invariant rather than the frame, and a
          # behaviorOnMiss change would break the implication without touching this line.
          - { to: Tagged_Off, when: [ IsLocal less 0.5, SelectiveAnimation/Tag greater 0.5, SelectiveAnimation/Ray_Hit is true, SelectiveAnimation/Clear greater 0, SelectiveAnimation/Gen is false ] }
          - { to: Tagged_On,  when: [ IsLocal less 0.5, SelectiveAnimation/Tag greater 0.5, SelectiveAnimation/Ray_Hit is true, SelectiveAnimation/Clear greater 0, SelectiveAnimation/Gen is true ] }
          # The wearer's own copy: self-tag is a menu intent, never the ray. IsLocal is true on the wearer
          # AND on their mirror clone (vrc-patterns/mirror-detect routes on exactly that), so this one
          # condition covers both and excludes every remote structurally -- belt to SelfTag's unsynced
          # braces, which matters because SelfTag keeps whatever flags a host avatar already declaring
          # that name gave it.
          - { to: Tagged_Off, when: [ IsLocal greater 0.5, SelectiveAnimation/SelfTag is true, SelectiveAnimation/Gen is false ] }
          - { to: Tagged_On,  when: [ IsLocal greater 0.5, SelectiveAnimation/SelfTag is true, SelectiveAnimation/Gen is true ] }
      Tagged_Off:
        behaviours:
          - driver: { set: { SelectiveAnimation/Tagged: 1 } }
        motion: { clip: sa_tagged }
        transitions:
          - { to: Untagged, when: [ SelectiveAnimation/Gen is true ] }
      Tagged_On:
        behaviours:
          - driver: { set: { SelectiveAnimation/Tagged: 1 } }
        motion: { clip: sa_tagged }
        transitions:
          - { to: Untagged, when: [ SelectiveAnimation/Gen is false ] }
    # A clone traverses fresh from Entry and cannot re-derive the latch -- it runs no drivers, and a
    # mirror clone of a remote has no ray hit to re-acquire from. It does inherit the driven Tagged value,
    # so reading the export back here is what keeps a tagged avatar tagged in an observer's mirror; the
    # clone re-enters under the CURRENT generation, which is correct because an erase since the tag would
    # have cleared the export it is reading.
    entry:
      - { to: Tagged_Off, when: [ SelectiveAnimation/Tagged is true, SelectiveAnimation/Gen is false ] }
      - { to: Tagged_On,  when: [ SelectiveAnimation/Tagged is true, SelectiveAnimation/Gen is true ] }
    default: Untagged
    # Lifecycle descends Untagged -> the two generation lanes.
    layout:
      nodes:
        Untagged:   [30, 180]
        Tagged_Off: [-90, 280]
        Tagged_On:  [150, 280]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

  # ===== Flip — turns an erase press into a generation flip. =====
  # A menu Button cannot flip a bit: it holds a value while pressed and resets on release. So the flip
  # needs drivers, and drivers need states -- this is the one thing in this entry a Direct tree cannot do.
  # THE RELEASE RUNG IS THE DEBOUNCE, not decoration: the SDK holds a Button active for a minimum 0.2 s,
  # so a two-state form would re-flip every frame for the whole press. The Set states double as the wait.
  - name: SelectiveAnimation/Flip
    states:
      Idle:
        motion: { clip: sa_flip_idle }
        transitions:
          - { to: SetOn,  when: [ SelectiveAnimation/Erase is true, SelectiveAnimation/Gen is false ] }
          - { to: SetOff, when: [ SelectiveAnimation/Erase is true, SelectiveAnimation/Gen is true ] }
      SetOn:
        behaviours:
          - driver: { localOnly: true, set: { SelectiveAnimation/Gen: 1 } }
        motion: { clip: sa_flip_idle }
        transitions:
          - { to: Idle, when: [ SelectiveAnimation/Erase is false ] }
      SetOff:
        behaviours:
          - driver: { localOnly: true, set: { SelectiveAnimation/Gen: 0 } }
        motion: { clip: sa_flip_idle }
        transitions:
          - { to: Idle, when: [ SelectiveAnimation/Erase is false ] }
    default: Idle
    layout:
      nodes:
        Idle:   [30, 180]
        SetOn:  [-90, 280]
        SetOff: [150, 280]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

# Rig: Aim (VRCFury ArmatureLink -> Right Hand) / Origin carries both raycasts and the beam; Payload is
# the placeholder output. The anchor is VRCFury's and not MA's because this document animates through it:
# these clips are merged by a VRCFury FullController, and a binding pathing through a node MA moved out of
# the module subtree vanishes from the merged FX silently (nondestructive.md owns the build-order
# mechanism, and its rule -- one framework for both moving and animating -- is what picks the seam here).
# Every clip owns its full property set explicitly (no reliance on WD revert; survives WD-OFF conversion),
# and every transform-vector clip writes all three components -- the animator drives an unbound component
# to 0 rather than leaving it at rest (docs/animator-schema.md §clips).
clips:
  # Clearance endpoints: bare declared-parameter writes, so they compile to animator-parameter curves.
  sa_clear_pos: { set: { SelectiveAnimation/Clear: 1 } }
  sa_clear_neg: { set: { SelectiveAnimation/Clear: -1 } }
  sa_armed:     { set: { SelectiveAnimation/Armed: 1 } }

  # Both raycasts live on Aim/Origin, so its active flag is the rig's whole lifecycle. Casting rides the
  # same pair because the gate must track the rig exactly, and a second source could drift from it.
  sa_rig_stowed:
    set:
      "Aim/Origin/GameObject.m_IsActive": 0
      SelectiveAnimation/Casting: 0
  sa_rig_casting:
    set:
      "Aim/Origin/GameObject.m_IsActive": 1
      SelectiveAnimation/Casting: 1

  # The beam carries one meaning -- you are tagging right now -- so its colour is a material value rather
  # than an animated one. There is no mode left for a second colour to signal.
  sa_beam_off: { set: { "Aim/Origin/Beam/GameObject.m_IsActive": 0 } }
  sa_beam_on:  { set: { "Aim/Origin/Beam/GameObject.m_IsActive": 1 } }

  # Beam length is unitless here: Beam's scale.z of 1 IS full range, because BeamMesh is authored to span
  # the range in the prefab. So retuning the range touches the prefab only, never this document.
  sa_beam_min:
    set:
      "Aim/Origin/Beam/Transform.m_LocalScale.x": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.y": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.z": 0
  sa_beam_max:
    set:
      "Aim/Origin/Beam/Transform.m_LocalScale.x": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.y": 1
      "Aim/Origin/Beam/Transform.m_LocalScale.z": 1

  # The payload, and the whole of it: swap this pair's content (or the Payload child) for your effect.
  sa_untagged: { set: { "Payload/GameObject.m_IsActive": 0 } }
  sa_tagged:   { set: { "Payload/GameObject.m_IsActive": 1 } }

  # Carrier: the Flip layer animates nothing, it only runs drivers.
  sa_flip_idle: { seconds: 0.1 }
