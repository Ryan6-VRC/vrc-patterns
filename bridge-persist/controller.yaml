# The avatar side of the bridge's persistence exchange (wire contract version 4), as one layer merged through the consumer's
# FullController beside its glue. generate.py's docstring is the state-by-state design record.
# Namespace BridgePersist/Example: Id, Announce, Boot, Restore, Scope reserved; every other name under it is payload and is reset here.
# Flag Persist/Example/Hold: local, outside the namespace, raised for the hold; the consumer's glue places from the payload while it is up.
# Id default 90: a variant declares its own in a controller listed first in both FullController lists; 0 switches this layer off.

schema: 1
controller: BridgePersist_Example_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  BridgePersist/Example/Id: { type: int, default: 90, vrc: { synced: false, saved: false } }   # the prefab's identity, carried as the default
  BridgePersist/Example/Announce: { type: int, default: 0, vrc: { synced: false, saved: false } }   # a copy of Id, written with Boot
  BridgePersist/Example/Boot: { type: float, default: 0, vrc: { synced: false, saved: false } }   # a random in (0, 1], once per load
  BridgePersist/Example/Scope: { type: int, default: 0, vrc: { synced: false, saved: false } }   # how long the bridge keeps this state: 0 swap, 1 instance, 2 instance-keep-reset; the Boot state sets it
  BridgePersist/Example/Restore: { type: int, default: 0, vrc: { synced: false, saved: false } }   # the bridge writes 1 after the payload, 3 to hold a calibration restore, 2 to release it; rests at 0
  BridgePersist/Example/Enabled: { type: bool, default: true, vrc: { synced: false, saved: false } }   # payload: the enable state; default Enable's
  BridgePersist/Example/Placed: { type: bool, default: false, vrc: { synced: true, saved: false } }
  BridgePersist/Example/Value: { type: float, default: 0, vrc: { synced: false, saved: false } }
  Example/Enable: { type: bool, default: true, vrc: { synced: true, saved: false } }
  Persist/Example/Hold: { type: bool, default: false, scratch: true }   # local, never published: up for the hold
  IsLocal: bool

layers:
  - name: Persist
    states:
      # A remote, and a wearer at Id 0, stay here for the session. Level rung: IsLocal lands after the entry rungs run.
      Load:
        motion: ~
        transitions:
          - { to: Quiesce, when: [ IsLocal is true, BridgePersist/Example/Id notEqual 0 ] }
      Quiesce:
        behaviours:
          - driver: { localOnly: true, set: { Example/Enable: 0, BridgePersist/Example/Placed: 0, BridgePersist/Example/Value: 0, BridgePersist/Example/Enabled: 1 } }
        motion: { clip: step }
        transitions:
          - { to: Boot, when: [ ], exitTime: 1.0 }
      # The first writing state's writes do not reach the client's parameters, so the quiesce and the reset are written again here.
      Boot:
        behaviours:
          - driver: { localOnly: true, copy: { BridgePersist/Example/Announce: BridgePersist/Example/Id } }
          - driver: { localOnly: true, set: { BridgePersist/Example/Scope: 0 } }
          - driver: { localOnly: true, random: { BridgePersist/Example/Boot: { min: 0.001, max: 1 } } }
          - driver: { localOnly: true, set: { Example/Enable: 0, BridgePersist/Example/Placed: 0, BridgePersist/Example/Value: 0, BridgePersist/Example/Enabled: 1 } }
        motion: { clip: step }
        transitions:
          - { to: Wait, when: [ ], exitTime: 1.0 }
      # The window, entered the evaluation after Boot's write so a load hitch on that frame cannot spend it.
      Wait:
        motion: { clip: window }
        transitions:
          - { to: Hold,   when: [ BridgePersist/Example/Restore greater 0, BridgePersist/Example/Placed is true ] }
          - { to: Finish, when: [ BridgePersist/Example/Restore greater 0 ] }   # restored, nothing placed: no hold
          - { to: Finish, when: [ ], exitTime: 1.0 }   # no bridge, or nothing to restore
      Hold:
        behaviours:
          - driver: { localOnly: true, set: { Persist/Example/Hold: 1 } }
        motion: { clip: hold }
        transitions:
          - { to: Await,  when: [ BridgePersist/Example/Restore greater 1 ], exitTime: 1.0 }   # a calibration restore: hold until released
          - { to: Finish, when: [ ], exitTime: 1.0 }   # a swap restore
      # Flag up, Enable still off, until the bridge's release: after a calibration reload the client solves no constraint until the user accepts.
      Await:
        motion: { clip: release }
        transitions:
          - { to: Settle, when: [ BridgePersist/Example/Restore equals 2 ] }   # the bridge's release: the user accepted
          - { to: Finish, when: [ Example/Enable is true ] }   # Enable switched on from the menu
          - { to: Finish, when: [ ], exitTime: 1.0 }   # no release: give up
      # The consumer's hold again, flag still up, so the placement settles on solving constraints before the flag falls.
      Settle:
        motion: { clip: hold }
        transitions:
          - { to: Finish, when: [ ], exitTime: 1.0 }
      # Two drivers, both run on entry to this one state: the glue sees the flag fall in the evaluation Enable returns.
      Finish:
        behaviours:
          - driver: { localOnly: true, copy: { Example/Enable: BridgePersist/Example/Enabled } }
          - driver: { localOnly: true, set: { BridgePersist/Example/Restore: 0, Persist/Example/Hold: 0 } }
        motion: { clip: step }
        transitions:
          - { to: Mirror On,  when: [ Example/Enable is true ], exitTime: 1.0 }
          - { to: Mirror Off, when: [ ], exitTime: 1.0 }
      # Idle. The mirror is written only here; a late or doubled Restore, or a late 3 or 2, re-enters, restoring the mirror and Restore 0.
      Mirror On:
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/Example/Enabled: 1, BridgePersist/Example/Restore: 0 } }
        motion: ~
        transitions:
          - { to: Mirror Off, when: [ Example/Enable is false ] }
          - { to: Mirror On, when: [ BridgePersist/Example/Restore equals 1 ] }
          - { to: Mirror On, when: [ BridgePersist/Example/Restore greater 1 ] }
      Mirror Off:
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/Example/Enabled: 0, BridgePersist/Example/Restore: 0 } }
        motion: ~
        transitions:
          - { to: Mirror On, when: [ Example/Enable is true ] }
          - { to: Mirror Off, when: [ BridgePersist/Example/Restore equals 1 ] }
          - { to: Mirror Off, when: [ BridgePersist/Example/Restore greater 1 ] }
    default: Load
    layout:
      nodes: { Load: [30, 180], Quiesce: [30, 250], Boot: [30, 320], Wait: [30, 390], Hold: [270, 460], Await: [510, 460], Settle: [270, 530], Finish: [30, 530], Mirror On: [-90, 600], Mirror Off: [150, 600] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

clips:
  step: { seconds: 0.02 }
  window: { seconds: 1.0 }   # WINDOW_SECS, the wire contract's
  hold: { seconds: 0.5 }   # CONFIG's hold
  release: { seconds: 120.0 }   # RELEASE_TIMEOUT_SECS, the wire contract's
