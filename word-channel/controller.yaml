# word-channel: a multiplexing transport for a declared word table over a narrow
# synced channel: 3 index bits + 2 synced int slots + 2 synced bool slots
# = 21 synced bits carrying 28 bits of words (2 bytes + 1 ranged float + 4 bools)
# in 2 batches, atomic=set (~0.23s full refresh; two loops worst case after a dropped
# snapshot). Protocol provenance: VRCFury Parameter Compressor, hardened — generate.py's
# docstring carries the design; the README's pause fixture carries the measured failure
# the hardenings answer.
#
# Sender (IsLocal): a 4-value batch counter (2 loops of 2 batches) walks Send states;
# the first batch of each loop latches the whole table minus its own batch (its own
# words go to the wire live, so no driver reads a latch it wrote the same frame —
# VRCFury's trick), then each batch holds 0.1s plus one guaranteed frame (the Extra
# states; an exit-time alone can fire early and outrun the sync tick, losing a
# snapshot). Receiver (!IsLocal): routes purely on the wire counter — enters only at
# a loop head from Lost, advances only on the exact successor value, falls to Lost on
# any other, and applies the buffered set atomically at each loop tail (Cycle
# increments there: the freshness signal). A receiver resumed from a culling pause
# re-derives its position from the counter; only a pause spanning exactly the counter
# period (P ~ 1/4 per resume) can slip one mixed apply through, whole words only,
# corrected at the next apply.

schema: 1
controller: WordChannel_Fx
basis: mount-root          # no scene bindings; drivers + AAP trees only
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  IsLocal: bool              # VRC built-in
  WordChannel/True: { type: bool, default: true, scratch: true }   # constant for +1-frame hops
  # Interface — the word table. Producers write these on the wearer; consumers read
  # them on every client. Unsynced (the wire below carries them); in the params asset
  # for legibility and OSC reach.
  Pos/Hi: float            # byte word: integral 0..255
  Pos/Lo: float            # byte word: integral 0..255
  Level: float            # float word: [-1,1], 255 wire steps
  Flag/A: bool
  Flag/B: bool
  Flag/C: bool
  Flag/D: bool
  WordChannel/Cycle: float           # remote freshness: +1 per applied cycle (float: driver Add clips an Int at 255)
  # Wire — the only synced params.
  WordChannel/Wire/Idx0: { type: bool, vrc: { synced: true, saved: false } }
  WordChannel/Wire/Idx1: { type: bool, vrc: { synced: true, saved: false } }
  WordChannel/Wire/Idx2: { type: bool, vrc: { synced: true, saved: false } }
  WordChannel/Wire/Num0: { type: int, vrc: { synced: true, saved: false } }
  WordChannel/Wire/Num1: { type: int, vrc: { synced: true, saved: false } }
  WordChannel/Wire/Bool0: { type: bool, vrc: { synced: true, saved: false } }
  WordChannel/Wire/Bool1: { type: bool, vrc: { synced: true, saved: false } }
  # Latches — the double buffer, both directions. Scratch: internal residue.
  WordChannel/Latch/Pos/Hi: { type: float, scratch: true }
  WordChannel/Latch/Pos/Lo: { type: float, scratch: true }
  WordChannel/Latch/Level: { type: float, scratch: true }
  WordChannel/Latch/Flag/A: { type: bool, scratch: true }
  WordChannel/Latch/Flag/B: { type: bool, scratch: true }
  WordChannel/Latch/Flag/C: { type: bool, scratch: true }
  WordChannel/Latch/Flag/D: { type: bool, scratch: true }
  Pos/Assembled: { type: float, aap: true }   # hi*256+lo, one-frame lag

layers:
  - name: WordChannel/Sync
    states:
      Split:
        motion: ~
        transitions:
          - { to: Lost, when: [ IsLocal is false ] }
          - { to: Send0, when: [ IsLocal is true ] }
      # counter 1/4 = batch 1/2: Pos/Hi, Pos/Lo, Flag/A, Flag/B
      Send0:
        motion: ~
        behaviours:
          # coherent snapshot: latch every word this batch does not itself send
          - driver:
              copy:
                WordChannel/Latch/Level: Level
                WordChannel/Latch/Flag/C: Flag/C
                WordChannel/Latch/Flag/D: Flag/D
          - driver:
              set:
                WordChannel/Wire/Idx0: 0
                WordChannel/Wire/Idx1: 0
                WordChannel/Wire/Idx2: 1
              copy:
                WordChannel/Wire/Num0: Pos/Hi
                WordChannel/Wire/Num1: Pos/Lo
                WordChannel/Wire/Bool0: Flag/A
                WordChannel/Wire/Bool1: Flag/B
        transitions:
          - { to: Extra0, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra0:
        motion: ~
        transitions:
          - { to: Send1, when: [ WordChannel/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 2/4 = batch 2/2: Level, Flag/C, Flag/D
      Send1:
        motion: ~
        behaviours:
          - driver:
              set:
                WordChannel/Wire/Idx0: 0
                WordChannel/Wire/Idx1: 1
                WordChannel/Wire/Idx2: 0
