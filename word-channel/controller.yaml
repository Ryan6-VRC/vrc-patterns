                WordChannel/Wire/Num0: { source: WordChannel/Latch/Level, sourceMin: -1, sourceMax: 1, destMin: 0, destMax: 254 }
                WordChannel/Wire/Bool0: WordChannel/Latch/Flag/C
                WordChannel/Wire/Bool1: WordChannel/Latch/Flag/D
        transitions:
          - { to: Extra1, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra1:
        motion: ~
        transitions:
          - { to: Send2, when: [ WordChannel/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 3/4 = batch 1/2: Pos/Hi, Pos/Lo, Flag/A, Flag/B
      Send2:
        motion: ~
        behaviours:
          # coherent snapshot: latch every word this batch does not itself send
          - driver:
              copy:
                WordChannel/Latch/Level: Level
                WordChannel/Latch/Flag/C: Flag/C
                WordChannel/Latch/Flag/D: Flag/D
          - driver:
              set:
                WordChannel/Wire/Idx0: 0
                WordChannel/Wire/Idx1: 1
                WordChannel/Wire/Idx2: 1
              copy:
                WordChannel/Wire/Num0: Pos/Hi
                WordChannel/Wire/Num1: Pos/Lo
                WordChannel/Wire/Bool0: Flag/A
                WordChannel/Wire/Bool1: Flag/B
        transitions:
          - { to: Extra2, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra2:
        motion: ~
        transitions:
          - { to: Send3, when: [ WordChannel/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 4/4 = batch 2/2: Level, Flag/C, Flag/D
      Send3:
        motion: ~
        behaviours:
          - driver:
              set:
                WordChannel/Wire/Idx0: 1
                WordChannel/Wire/Idx1: 0
                WordChannel/Wire/Idx2: 0
              copy:
