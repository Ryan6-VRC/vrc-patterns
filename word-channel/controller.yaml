      Recv0:
        motion: ~
        behaviours:
          - driver:
              copy:
                WordChannel/Latch/Pos/Hi: WordChannel/Wire/Num0
                WordChannel/Latch/Pos/Lo: WordChannel/Wire/Num1
                WordChannel/Latch/Flag/A: WordChannel/Wire/Bool0
                WordChannel/Latch/Flag/B: WordChannel/Wire/Bool1
        transitions:
          - { to: Recv1, when: [ WordChannel/Wire/Idx0 is false, WordChannel/Wire/Idx1 is true, WordChannel/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WordChannel/Wire/Idx0 is true ] }
          - { to: Lost, when: [ WordChannel/Wire/Idx1 is false, WordChannel/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WordChannel/Wire/Idx1 is true, WordChannel/Wire/Idx2 is true ] }
