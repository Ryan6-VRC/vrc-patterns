# GENERATED by generate.py — edit its CONFIG and rerun; never hand-edit this file.
# word-channel: a multiplexing transport for a declared word table over a narrow
# synced channel: 3 index bits + 2 synced int slots + 2 synced bool slots
# = 21 synced bits carrying 28 bits of words (2 bytes + 1 ranged float + 4 bools)
# in 2 batches, atomic=set (~0.23s full refresh; two loops worst case after a dropped
# snapshot). Protocol provenance: VRCFury Parameter Compressor, hardened — generate.py's
# docstring carries the design; the README's pause fixture carries the measured failure
# the hardenings answer.
#
# Sender (IsLocal): a 4-value batch counter (2 loops of 2 batches) walks Send states;
# the first batch of each loop latches the whole table minus its own batch (its own
# words go to the wire live, so no driver reads a latch it wrote the same frame —
# VRCFury's trick), then each batch holds 0.1s plus one guaranteed frame (the Extra
# states; an exit-time alone can fire early and outrun the sync tick, losing a
# snapshot). Receiver (!IsLocal): routes purely on the wire counter — enters only at
# a loop head from Lost, advances only on the exact successor value, falls to Lost on
# any other, and applies the buffered set atomically at each loop tail. A receiver
# resumed from a culling pause re-derives its position from the counter; only a pause
# spanning exactly the counter period (P ~ 1/4 per resume) can slip one mixed apply
# through, whole words only, corrected at the next apply.
#
# Each loop tail also adds 1 to Cycle (liveness — a per-client rate, running vs wedged)
# and copies SawHead into Acquired (correctness — a complete table has landed on this
# client since the last reset). Heads set SawHead, Lost copies Acquired back into it, and
# the Reset layer zeroes both when IsAnimatorEnabled goes false; generate.py's docstring
# carries why Lost copies rather than clears.

schema: 1
controller: WordChannel_Fx
basis: mount-root          # no scene bindings; drivers + AAP trees only
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  IsLocal: bool              # VRC built-in
  IsAnimatorEnabled: { type: bool, default: true }   # VRC built-in
  WC/True: { type: bool, default: true, scratch: true }   # constant for +1-frame hops
  # Interface — the word table. Producers write these on the wearer; consumers read
  # them on every client. Unsynced (the wire below carries them); in the params asset
  # for legibility and OSC reach.
  WDemo/Pos/Hi: float            # byte word: integral 0..255
  WDemo/Pos/Lo: float            # byte word: integral 0..255
  WDemo/Level: float            # float word: [-1,1], 255 wire steps
  WDemo/Flag/A: bool
  WDemo/Flag/B: bool
  WDemo/Flag/C: bool
  WDemo/Flag/D: bool
  # Correctness: false on load, false after a distance-cull pause, true once THIS
  # client's receiver has applied a complete word table since then. The interface
  # output a consumer gates on; false on the wearer forever (sender layers only).
  WordChannel/Acquired: { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  WC/SawHead: { type: bool, scratch: true }   # internal: a head has been walked since the last reset
  WC/Cycle: float           # liveness, not correctness: +1 per loop tail on each client's own
  # receiver, so a rate distinguishes running from wedged where Acquired cannot. It sits
  # under the internal prefix, so no published wildcard reaches it and a host avatar
  # declaring the name cannot capture it — structural, not a list entry. Float because a
  # driver `add` on a bool is nonsense — no clip-at-255 rationale is involved, that
  # reaches synced Ints only and this is unsynced.
  # Wire — the only synced params.
  WC/Wire/Idx0: { type: bool, vrc: { synced: true, saved: false } }
  WC/Wire/Idx1: { type: bool, vrc: { synced: true, saved: false } }
  WC/Wire/Idx2: { type: bool, vrc: { synced: true, saved: false } }
  WC/Wire/Num0: { type: int, vrc: { synced: true, saved: false } }
  WC/Wire/Num1: { type: int, vrc: { synced: true, saved: false } }
  WC/Wire/Bool0: { type: bool, vrc: { synced: true, saved: false } }
  WC/Wire/Bool1: { type: bool, vrc: { synced: true, saved: false } }
  # Latches — the double buffer, both directions. Scratch: internal residue.
  WC/Latch/WDemo/Pos/Hi: { type: float, scratch: true }
  WC/Latch/WDemo/Pos/Lo: { type: float, scratch: true }
  WC/Latch/WDemo/Level: { type: float, scratch: true }
  WC/Latch/WDemo/Flag/A: { type: bool, scratch: true }
  WC/Latch/WDemo/Flag/B: { type: bool, scratch: true }
  WC/Latch/WDemo/Flag/C: { type: bool, scratch: true }
  WC/Latch/WDemo/Flag/D: { type: bool, scratch: true }
  WDemo/Pos/Assembled: { type: float, aap: true }   # hi*256+lo, one-frame lag

layers:
  - name: WordChannel/Sync
    states:
      Split:
        motion: ~
        transitions:
          - { to: Lost, when: [ IsLocal is false ] }
          - { to: Send0, when: [ IsLocal is true ] }
      # counter 1/4 = batch 1/2: WDemo/Pos/Hi, WDemo/Pos/Lo, WDemo/Flag/A, WDemo/Flag/B
      Send0:
        motion: ~
        behaviours:
          # coherent snapshot: latch every word this batch does not itself send
          - driver:
              copy:
                WC/Latch/WDemo/Level: WDemo/Level
                WC/Latch/WDemo/Flag/C: WDemo/Flag/C
                WC/Latch/WDemo/Flag/D: WDemo/Flag/D
          - driver:
              set:
                WC/Wire/Idx0: 0
                WC/Wire/Idx1: 0
                WC/Wire/Idx2: 1
              copy:
                WC/Wire/Num0: WDemo/Pos/Hi
                WC/Wire/Num1: WDemo/Pos/Lo
                WC/Wire/Bool0: WDemo/Flag/A
                WC/Wire/Bool1: WDemo/Flag/B
        transitions:
          - { to: Extra0, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra0:
        motion: ~
        transitions:
          - { to: Send1, when: [ WC/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 2/4 = batch 2/2: WDemo/Level, WDemo/Flag/C, WDemo/Flag/D
      Send1:
        motion: ~
        behaviours:
          - driver:
              set:
                WC/Wire/Idx0: 0
                WC/Wire/Idx1: 1
                WC/Wire/Idx2: 0
              copy:
                WC/Wire/Num0: { source: WC/Latch/WDemo/Level, sourceMin: -1, sourceMax: 1, destMin: 0, destMax: 254 }
                WC/Wire/Bool0: WC/Latch/WDemo/Flag/C
                WC/Wire/Bool1: WC/Latch/WDemo/Flag/D
        transitions:
          - { to: Extra1, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra1:
        motion: ~
        transitions:
          - { to: Send2, when: [ WC/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 3/4 = batch 1/2: WDemo/Pos/Hi, WDemo/Pos/Lo, WDemo/Flag/A, WDemo/Flag/B
      Send2:
        motion: ~
        behaviours:
          # coherent snapshot: latch every word this batch does not itself send
          - driver:
              copy:
                WC/Latch/WDemo/Level: WDemo/Level
                WC/Latch/WDemo/Flag/C: WDemo/Flag/C
                WC/Latch/WDemo/Flag/D: WDemo/Flag/D
          - driver:
              set:
                WC/Wire/Idx0: 0
                WC/Wire/Idx1: 1
                WC/Wire/Idx2: 1
              copy:
                WC/Wire/Num0: WDemo/Pos/Hi
                WC/Wire/Num1: WDemo/Pos/Lo
                WC/Wire/Bool0: WDemo/Flag/A
                WC/Wire/Bool1: WDemo/Flag/B
        transitions:
          - { to: Extra2, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra2:
        motion: ~
        transitions:
          - { to: Send3, when: [ WC/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 4/4 = batch 2/2: WDemo/Level, WDemo/Flag/C, WDemo/Flag/D
      Send3:
        motion: ~
        behaviours:
          - driver:
              set:
                WC/Wire/Idx0: 1
                WC/Wire/Idx1: 0
                WC/Wire/Idx2: 0
              copy:
                WC/Wire/Num0: { source: WC/Latch/WDemo/Level, sourceMin: -1, sourceMax: 1, destMin: 0, destMax: 254 }
                WC/Wire/Bool0: WC/Latch/WDemo/Flag/C
                WC/Wire/Bool1: WC/Latch/WDemo/Flag/D
        transitions:
          - { to: Extra3, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra3:
        motion: ~
        transitions:
          - { to: Send0, when: [ WC/True is true ] }   # conditional hop = the guaranteed +1 frame
      Lost:
        motion: ~
        behaviours:
          # Copy, never clear: cold this writes 0 and the next certification needs a
          # contiguous head->tail walk; already certified it writes 1 back, so a dropped
          # counter value cannot knock a real table's flag down. Only the Reset layer
          # zeroes the pair (docstring).
          - driver:
              copy:
                WC/SawHead: WordChannel/Acquired
        transitions:
          - { to: Recv0, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx1 is false, WC/Wire/Idx2 is true ] }   # re-lock only at a loop head
          - { to: Recv2, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx1 is true, WC/Wire/Idx2 is true ] }   # re-lock only at a loop head
      Recv0:
        motion: ~
        behaviours:
          - driver:
              set:
                WC/SawHead: 1   # head of a batch walk
              copy:
                WC/Latch/WDemo/Pos/Hi: WC/Wire/Num0
                WC/Latch/WDemo/Pos/Lo: WC/Wire/Num1
                WC/Latch/WDemo/Flag/A: WC/Wire/Bool0
                WC/Latch/WDemo/Flag/B: WC/Wire/Bool1
        transitions:
          - { to: Recv1, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx1 is true, WC/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx1 is false, WC/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WC/Wire/Idx1 is true, WC/Wire/Idx2 is true ] }
      Recv1:
        motion: ~
        behaviours:
          - driver:
              copy:
                WDemo/Level: { source: WC/Wire/Num0, sourceMin: 0, sourceMax: 254, destMin: -1, destMax: 1 }
                WDemo/Flag/C: WC/Wire/Bool0
                WDemo/Flag/D: WC/Wire/Bool1
                # atomic apply: the earlier batches' buffered words land with this batch's
                WDemo/Pos/Hi: WC/Latch/WDemo/Pos/Hi
                WDemo/Pos/Lo: WC/Latch/WDemo/Pos/Lo
                WDemo/Flag/A: WC/Latch/WDemo/Flag/A
                WDemo/Flag/B: WC/Latch/WDemo/Flag/B
          - driver:
              add: { WC/Cycle: 1 }
              copy:
                WordChannel/Acquired: WC/SawHead   # tail of a walk that began at a head
        transitions:
          - { to: Recv2, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx1 is true, WC/Wire/Idx2 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx1 is false ] }
      Recv2:
        motion: ~
        behaviours:
          - driver:
              set:
                WC/SawHead: 1   # head of a batch walk
              copy:
                WC/Latch/WDemo/Pos/Hi: WC/Wire/Num0
                WC/Latch/WDemo/Pos/Lo: WC/Wire/Num1
                WC/Latch/WDemo/Flag/A: WC/Wire/Bool0
                WC/Latch/WDemo/Flag/B: WC/Wire/Bool1
        transitions:
          - { to: Recv3, when: [ WC/Wire/Idx0 is true, WC/Wire/Idx1 is false, WC/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx1 is false ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is true, WC/Wire/Idx1 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is true, WC/Wire/Idx2 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx1 is false, WC/Wire/Idx2 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx1 is true, WC/Wire/Idx2 is false ] }
      Recv3:
        motion: ~
        behaviours:
          - driver:
              copy:
                WDemo/Level: { source: WC/Wire/Num0, sourceMin: 0, sourceMax: 254, destMin: -1, destMax: 1 }
                WDemo/Flag/C: WC/Wire/Bool0
                WDemo/Flag/D: WC/Wire/Bool1
                # atomic apply: the earlier batches' buffered words land with this batch's
                WDemo/Pos/Hi: WC/Latch/WDemo/Pos/Hi
                WDemo/Pos/Lo: WC/Latch/WDemo/Pos/Lo
                WDemo/Flag/A: WC/Latch/WDemo/Flag/A
                WDemo/Flag/B: WC/Latch/WDemo/Flag/B
          - driver:
              add: { WC/Cycle: 1 }
              copy:
                WordChannel/Acquired: WC/SawHead   # tail of a walk that began at a head
        transitions:
          - { to: Recv0, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx1 is false, WC/Wire/Idx2 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx1 is true ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is false, WC/Wire/Idx2 is false ] }
          - { to: Lost, when: [ WC/Wire/Idx0 is true, WC/Wire/Idx2 is true ] }
    default: Split
    layout:
      nodes:
        Split:  [30, 180]
        Lost:   [510, 180]
        Send0: [-330, 260]
        Extra0: [-570, 260]
        Recv0: [270, 260]
        Send1: [-330, 350]
        Extra1: [-570, 350]
        Recv1: [270, 350]
        Send2: [-330, 440]
        Extra2: [-570, 440]
        Recv2: [270, 440]
        Send3: [-330, 530]
        Extra3: [-570, 530]
        Recv3: [270, 530]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: WordChannel/Reset
    # The pause reset. A distance-hide fires IsAnimatorEnabled false one frame before the
    # animator stops, which is the frame this driver lands on; a manual hide/show rebuilds
    # the animator instead, restarting Sync at Split -> Lost with both params at their
    # defaults, so it is covered without a signal. View cull does neither and is the
    # consumer's to close by composing anti-cull. Partial coverage, declared (see the
    # coverage table in docs/runtime.md).
    states:
      Enabled:
        motion: ~
        transitions:
          - { to: Disabling, when: [ IsAnimatorEnabled is false ] }
      Disabling:
        motion: ~
        behaviours:
          - driver:
              set:
                WordChannel/Acquired: 0
                WC/SawHead: 0
        transitions:
          - { to: Enabled, when: [ IsAnimatorEnabled is true ] }
    default: Enabled
    layout:
      nodes:
        Enabled:   [30, 180]
        Disabling: [270, 180]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: WordChannel/Assemble
    states:
      Assemble:
        motion:
          tree: direct
          name: AssembleSum
          children:
            - { clip: asm_wdemo_pos_assembled_hi, directWeight: WDemo/Pos/Hi }
            - { clip: asm_wdemo_pos_assembled_lo, directWeight: WDemo/Pos/Lo }
    default: Assemble

# Reassembly endpoints: each writes the AAP scaled per limb; the Direct tree's
# weight (the limb param, 0..255) multiplies it, so the sum is hi*256 + lo.
clips:
  asm_wdemo_pos_assembled_hi: { set: { WDemo/Pos/Assembled: 256 } }
  asm_wdemo_pos_assembled_lo: { set: { WDemo/Pos/Assembled: 1 } }
