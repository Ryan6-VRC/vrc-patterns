                WordChannel/Wire/Bool1: WordChannel/Latch/Flag/D
        transitions:
          - { to: Extra3, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra3:
        motion: ~
        transitions:
          - { to: Send0, when: [ WordChannel/True is true ] }   # conditional hop = the guaranteed +1 frame
      Lost:
        motion: ~
        transitions:
