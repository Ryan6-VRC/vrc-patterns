          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Recycle, when: [ CR/D/1_3/X+ greater -0.002, CR/D/1_3/X+ less 0.002, CR/D/1_3/Y+ greater -0.002, CR/D/1_3/Y+ less 0.002, CR/D/1_3/Z+ greater -0.002, CR/D/1_3/Z+ less 0.002, CR/Slot1/Held greater 0.5 ] }   # dedup: slot 1 holds this point
          - { to: Recycle, when: [ CR/D/2_3/X+ greater -0.002, CR/D/2_3/X+ less 0.002, CR/D/2_3/Y+ greater -0.002, CR/D/2_3/Y+ less 0.002, CR/D/2_3/Z+ greater -0.002, CR/D/2_3/Z+ less 0.002, CR/Slot2/Held greater 0.5 ] }   # dedup: slot 2 holds this point
          - { to: Recycle, when: [ CR/Slot3/X+ less 1e-05 ] }
          - { to: Recycle, when: [ CR/Slot3/Y+ less 1e-05 ] }
          - { to: Recycle, when: [ CR/Slot3/Z+ less 1e-05 ] }
          - { to: Burst, when: [ CR/Slot3/r2 less 1, CR/Silent less 0.5 ] }
