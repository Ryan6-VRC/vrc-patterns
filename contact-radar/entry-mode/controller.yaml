          - { to: Open, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/Hit greater 0.5, CR/Slot1/HitPrev less 0.5, CR/Slot3/Armed greater 0.5, CR/Slot2/Armed less 0.5, CR/Sweeping less 0.5 ] }   # ring on the edge: slot 1 latched
          - { to: SweepShut, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot3/Armed greater 0.5, CR/Slot2/Armed less 0.5, CR/Sweeping greater 0.5 ] }   # ring on the readings: slot 1 fired mid-sweep, nothing Armed between
          - { to: Open, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot3/Armed greater 0.5, CR/Slot2/Armed less 0.5, CR/Sweeping less 0.5 ] }   # ring on the readings: slot 1 fired, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot2/Open greater 0.5, CR/Slot2/Hit greater 0.5, CR/Slot2/HitPrev less 0.5, CR/Slot3/Armed greater 0.5, CR/Slot2/Front greater 0.5, CR/Sweeping greater 0.5 ] }   # ring on the edge: slot 2 latched mid-sweep
          - { to: Open, when: [ CR/Slot2/Open greater 0.5, CR/Slot2/Hit greater 0.5, CR/Slot2/HitPrev less 0.5, CR/Slot3/Armed greater 0.5, CR/Sweeping less 0.5 ] }   # ring on the edge: slot 2 latched
          - { to: SweepShut, when: [ CR/Slot2/Open greater 0.5, CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0, CR/Slot3/Armed greater 0.5, CR/Sweeping greater 0.5 ] }   # ring on the readings: slot 2 fired mid-sweep, nothing Armed between
          - { to: Open, when: [ CR/Slot2/Open greater 0.5, CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0, CR/Slot3/Armed greater 0.5, CR/Sweeping less 0.5 ] }   # ring on the readings: slot 2 fired, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot2/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed greater 0.5, CR/Sweeping greater 0.5 ], exitTime: 1.0 }   # self-open into the sweep: nothing Open, no lower Armed; re-checked only on a crossing
          - { to: Open, when: [ CR/Slot1/Open less 0.5, CR/Slot2/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed greater 0.5, CR/Sweeping less 0.5 ], exitTime: 1.0 }   # self-open: nothing Open, no lower Armed; re-checked only on a crossing, so it costs at most one stepSeconds with nothing Open — the common-path recovery when the ring's one-frame handoff finds no taker
      SweepShut:                   # the cube appears at the front SHUT for a step: everything inside it is re-rejected
        motion:
          tree: direct
          name: Slot3 sweep shut
          normalized: false
          children:
            - { clip: slot3_sweepshut, directWeight: CR/One }
            - { clip: slot3_front_scale, directWeight: CR/SweepPrev }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Sweep, when: [], exitTime: 1.0 }
      Sweep:                       # flag up, the cube riding the Sweep layer's front: each hand is admitted alone as the front reaches it
        motion:
          tree: direct
          name: Slot3 sweep
          normalized: false
          children:
            - { clip: slot3_sweep_cfg, directWeight: CR/One }
            - { clip: slot3_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot3/Hit greater 0.5, CR/Slot3/HitPrev less 0.5 ] }   # this slot's own admission edge, a step before its readings; the Sweep layer freezes the front on the same rung
          - { to: Latch, when: [ CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot3/X+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot3/Y+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot3/Z+ greater 0 ] }
          - { to: Open, when: [ CR/Sweep greater 1.1 ] }   # the front reached the face: the sweep is over
          - { to: Open, when: [ CR/Sweeping less 0.5 ] }   # the Sweep layer went Idle on the frame this slot took the front (Idle parks Sweep exactly at the face)
      Open:                        # flag up at full size: only overlaps beginning now are admitted
        motion: { clip: slot3_open }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot3/Hit greater 0.5, CR/Slot3/HitPrev less 0.5 ] }   # this slot's own admission edge: a step before the readings, one frame wide
          - { to: Latch, when: [ CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot3/X+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot3/Y+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot3/Z+ greater 0 ] }
      Partial:                     # one box read a hand the others did not: a step's grace at the current front, else Recycle — an Open slot may never stall
        motion:
          tree: direct
          name: Slot3 partial
          normalized: false
          children:
            - { clip: slot3_open_wait, directWeight: CR/One }
            - { clip: slot3_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot3/Hit greater 0.5, CR/Slot3/HitPrev less 0.5 ] }   # Partial writes Open 1, so it must latch on the edge the ring hands off on — near-dead, since the Hit box rises a step before any axis and Open would have taken it
          - { to: Latch, when: [ CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ] }
          - { to: Recycle, when: [], exitTime: 1.0 }
      Latch:                       # flag shut + hold cube in one write; readout parked outside the zone; waits latchSeconds for the readings
        motion: { clip: slot3_latch }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: TrackOut, when: [ CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ] }
          - { to: Recycle, when: [], exitTime: 1.0 }   # an edge whose readings never came (an admission the axis boxes missed): release, as Partial does
      TrackOut:                    # readout live, payload off; outside the burst radius. Entered only from Latch, so the dedup rungs below run on a FRESH admission and never again
        motion:
          tree: direct
          name: Slot3 readout
          normalized: false
          children:
            - { clip: slot3_hold, directWeight: CR/One }
            - { clip: slot3_read_bias, directWeight: CR/One }
            - { clip: slot3_read_xp, directWeight: CR/Slot3/X+ }
            - { clip: slot3_read_yp, directWeight: CR/Slot3/Y+ }
