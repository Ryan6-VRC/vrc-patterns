          - { to: Open, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/Hit greater 0.5, CR/Slot1/HitPrev less 0.5, CR/Slot2/Armed greater 0.5, CR/Sweeping less 0.5 ] }   # ring on the edge: slot 1 latched
          - { to: SweepShut, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot2/Armed greater 0.5, CR/Sweeping greater 0.5 ] }   # ring on the readings: slot 1 fired mid-sweep, nothing Armed between
          - { to: Open, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot2/Armed greater 0.5, CR/Sweeping less 0.5 ] }   # ring on the readings: slot 1 fired, nothing Armed between
