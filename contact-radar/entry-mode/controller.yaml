        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Recycle, when: [], exitTime: 1.0 }
      Recycle:                     # collapse a step, restore a step, flag shut: every hand inside is re-rejected
        motion: { clip: slot3_recycle }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Armed, when: [], exitTime: 1.0 }
    default: Boot
    layout:
      nodes: { Boot: [30, 180], Disabled: [30, 270], Paused: [270, 270], Armed: [30, 360], SweepShut: [-210, 360], Sweep: [-210, 450], Open: [30, 450], Partial: [270, 450], Latch: [30, 540], TrackOut: [-210, 630], Burst: [270, 630], Recycle: [30, 720] }
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: Sweep
    # The expanding front, shared by every slot: Sweeping (collapse the Armed slots), Silent (the no-puff endpoint),
    # Sweep (the front half-extent, m), SweepBase (where the current sweeper's ramp started) and SweepPrev (last frame's
    # front, which the next slot's shut cube rides). Slot layers read these
    # and never write them; each slot reports its own Front flag (1 in its Sweep state) for this layer to ramp on.
    # Its second job: every state writes the Boundary meshes' scale and renderer enable (one state is always live here).
    states:
      Boot:                        # a fresh animator: the first sweep is silent
        motion: { clip: sw_boot }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Wait, when: [ ContactRadar/Enable is true ] }
      Disabled:                    # the toggle is off: the next sweep is loud
        motion: { clip: sw_off }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Wait, when: [ ContactRadar/Enable is true ] }
      Paused:                      # a distance-hide: the resume sweep is silent
        motion: { clip: sw_paused }
        transitions:
          - { to: Disabled, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is false ] }
          - { to: Wait, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is true ] }
      Wait:                        # a sweep is pending or between slots: the front holds, SweepBase latches it, Silent holds
        motion:
          tree: direct
          name: Sweep wait
          normalized: false
          children:
            - { clip: sw_sweeping, directWeight: CR/One }
            - { clip: sw_hold_sweep, directWeight: CR/Sweep }
            - { clip: sw_latch_base, directWeight: CR/Sweep }
            - { clip: sw_hold_prev, directWeight: CR/Sweep }
            - { clip: sw_hold_silent, directWeight: CR/Silent }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Idle, when: [ CR/Sweep greater 1.1, CR/Slot1/Shut less 0.5, CR/Slot2/Shut less 0.5, CR/Slot3/Shut less 0.5 ] }
          - { to: Ramp, when: [ CR/Slot1/Front greater 0.5 ] }
          - { to: Ramp, when: [ CR/Slot2/Front greater 0.5 ] }
          - { to: Ramp, when: [ CR/Slot3/Front greater 0.5 ] }
      Ramp:                        # a slot's flag is up: the front grows from SweepBase at the configured speed
        motion:
          tree: direct
          name: Sweep ramp
          normalized: false
          children:
            - { clip: sw_ramp, directWeight: CR/One }
            - { clip: sw_hold_sweep, directWeight: CR/SweepBase }
            - { clip: sw_hold_base, directWeight: CR/SweepBase }
            - { clip: sw_hold_prev, directWeight: CR/Sweep }
            - { clip: sw_hold_silent, directWeight: CR/Silent }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Wait, when: [ CR/Slot1/Front greater 0.5, CR/Slot1/Hit greater 0.5, CR/Slot1/HitPrev less 0.5 ] }   # slot 1 latched: freeze the front on the admission frame
          - { to: Wait, when: [ CR/Slot2/Front greater 0.5, CR/Slot2/Hit greater 0.5, CR/Slot2/HitPrev less 0.5 ] }   # slot 2 latched: freeze the front on the admission frame
          - { to: Wait, when: [ CR/Slot3/Front greater 0.5, CR/Slot3/Hit greater 0.5, CR/Slot3/HitPrev less 0.5 ] }   # slot 3 latched: freeze the front on the admission frame
          - { to: Idle, when: [ CR/Sweep greater 1.1, CR/Slot1/Shut less 0.5, CR/Slot2/Shut less 0.5, CR/Slot3/Shut less 0.5 ] }   # the face: the sweep is over, once no successor's shut cube is still reading SweepPrev
          - { to: Wait, when: [ CR/Slot1/Front less 0.5, CR/Slot2/Front less 0.5, CR/Slot3/Front less 0.5 ] }   # the sweeper latched a frame ago (its edge was missed) or stalled: hold the front for the next slot's shut step
      Idle:                        # no sweep: Armed slots at full size, the front parked at the face, loud
        motion: { clip: sw_idle }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
    default: Boot
    layout:
      nodes: { Boot: [30, 180], Disabled: [30, 270], Paused: [270, 270], Wait: [30, 360], Ramp: [270, 360], Idle: [30, 450] }
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: Dedup
    # One state, one tree, no transitions, and deliberately no Paused and no Disabled. A park state would revert
    # HitPrev to its default 0 while a stowed receiver's restored Hit sat at 1, and the resume frame would then
    # manufacture exactly the false rising edge this layer exists to make impossible. It needs no park in any case:
    # a non-normalized Direct tree writes every binding it carries every frame, so nothing here can revert.
    # Two jobs. HitPrev: last frame's Hit per slot, which with Hit is the admission edge — one animator frame wide
    # at any frame rate. D/<j>_<k>/<ax> = Slot<k>/<ax> - Slot<j>/<ax> for every pair and every axis, built from the RAW [0, 1]
    # receiver floats rather than the signed readout AAPs because a negative Direct weight clamps to 0; the signs
    # live in the clips, where they are free. Every parameter here defaults to 0, so the below-weight-1 rest fill
    # contributes nothing and both reads are exact at any weight sum.
    states:
      Live:
        motion:
          tree: direct
          name: Dedup
          normalized: false
          children:
            - { clip: hitprev_1, directWeight: CR/Slot1/Hit }
            - { clip: hitprev_2, directWeight: CR/Slot2/Hit }
            - { clip: hitprev_3, directWeight: CR/Slot3/Hit }
            - { clip: d_slot1_xp, directWeight: CR/Slot1/X+ }
            - { clip: d_slot1_yp, directWeight: CR/Slot1/Y+ }
            - { clip: d_slot1_zp, directWeight: CR/Slot1/Z+ }
            - { clip: d_slot2_xp, directWeight: CR/Slot2/X+ }
            - { clip: d_slot2_yp, directWeight: CR/Slot2/Y+ }
            - { clip: d_slot2_zp, directWeight: CR/Slot2/Z+ }
            - { clip: d_slot3_xp, directWeight: CR/Slot3/X+ }
            - { clip: d_slot3_yp, directWeight: CR/Slot3/Y+ }
            - { clip: d_slot3_zp, directWeight: CR/Slot3/Z+ }
    default: Live
    layout:
      nodes: { Live: [30, 180] }
      entry: [50, 120]
      any:   [50, 40]
