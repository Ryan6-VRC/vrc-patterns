  slot1_armed: { seconds: 0.035, set: { Cage/Slot1/Boxes/GameObject.m_IsActive: 1, Cage/Slot1/Boxes/X+/VRCContactReceiver.allowOthers: 0, Cage/Slot1/Boxes/Y+/VRCContactReceiver.allowOthers: 0, Cage/Slot1/Boxes/Z+/VRCContactReceiver.allowOthers: 0, Cage/Slot1/Boxes/Transform.m_LocalScale.x: 1.5, Cage/Slot1/Boxes/Transform.m_LocalScale.y: 1.5, Cage/Slot1/Boxes/Transform.m_LocalScale.z: 1.5, CR/Slot1/Open: 0, CR/Slot1/Armed: 1, Cage/Slot1/Output/Burst/GameObject.m_IsActive: 0 } }   # Armed 1 — the ring rule reads it one frame late
  slot1_open: { set: { Cage/Slot1/Boxes/GameObject.m_IsActive: 1, Cage/Slot1/Boxes/X+/VRCContactReceiver.allowOthers: 1, Cage/Slot1/Boxes/Y+/VRCContactReceiver.allowOthers: 1, Cage/Slot1/Boxes/Z+/VRCContactReceiver.allowOthers: 1, Cage/Slot1/Boxes/Transform.m_LocalScale.x: 1.5, Cage/Slot1/Boxes/Transform.m_LocalScale.y: 1.5, Cage/Slot1/Boxes/Transform.m_LocalScale.z: 1.5, CR/Slot1/Open: 1, CR/Slot1/Armed: 0, Cage/Slot1/Output/Burst/GameObject.m_IsActive: 0 } }   # Open 1 — the flag up
  slot1_open_wait: { seconds: 0.035, set: { Cage/Slot1/Boxes/GameObject.m_IsActive: 1, Cage/Slot1/Boxes/X+/VRCContactReceiver.allowOthers: 1, Cage/Slot1/Boxes/Y+/VRCContactReceiver.allowOthers: 1, Cage/Slot1/Boxes/Z+/VRCContactReceiver.allowOthers: 1, Cage/Slot1/Boxes/Transform.m_LocalScale.x: 1.5, Cage/Slot1/Boxes/Transform.m_LocalScale.y: 1.5, Cage/Slot1/Boxes/Transform.m_LocalScale.z: 1.5, CR/Slot1/Open: 1, CR/Slot1/Armed: 0, Cage/Slot1/Output/Burst/GameObject.m_IsActive: 0 } }   # Open 1 held a step: the partial-admission grace
  slot1_latch: { seconds: 0.035, set: { Cage/Slot1/Boxes/GameObject.m_IsActive: 1, Cage/Slot1/Boxes/X+/VRCContactReceiver.allowOthers: 0, Cage/Slot1/Boxes/Y+/VRCContactReceiver.allowOthers: 0, Cage/Slot1/Boxes/Z+/VRCContactReceiver.allowOthers: 0, Cage/Slot1/Boxes/Transform.m_LocalScale.x: 1.7, Cage/Slot1/Boxes/Transform.m_LocalScale.y: 1.7, Cage/Slot1/Boxes/Transform.m_LocalScale.z: 1.7, CR/Slot1/Open: 0, CR/Slot1/Armed: 0, Cage/Slot1/Output/Burst/GameObject.m_IsActive: 0, CR/Slot1/x: 0.85, CR/Slot1/y: 0.85, CR/Slot1/z: 0.85 } }   # flag shut + hold cube in one write; x,y,z parked at h (r² reads 3h²)
