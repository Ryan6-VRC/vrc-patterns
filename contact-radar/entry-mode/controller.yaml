  slot3_recycle:   # collapse for a step, restore for a step; stepped so nothing eases through the collapse
    seconds: 0.07
    set: { Cage/Size/Slot3/Boxes/GameObject.m_IsActive: 1, Cage/Size/Slot3/Boxes/X+/VRCContactReceiver.allowOthers: 0, Cage/Size/Slot3/Boxes/Y+/VRCContactReceiver.allowOthers: 0, Cage/Size/Slot3/Boxes/Z+/VRCContactReceiver.allowOthers: 0, CR/Slot3/Open: 0, CR/Slot3/Armed: 0, CR/Slot3/Front: 0, Cage/Size/Slot3/Output/Payload/GameObject.m_IsActive: 0, Cage/Size/Slot3/Output/Payload/Burst/GameObject.m_IsActive: 1 }
    curves:
      Cage/Size/Slot3/Boxes/Transform.m_LocalScale.x: { tangents: stepped, keys: [ [0, 0.001], [0.035, 2.2], [0.07, 2.2] ] }
      Cage/Size/Slot3/Boxes/Transform.m_LocalScale.y: { tangents: stepped, keys: [ [0, 0.001], [0.035, 2.2], [0.07, 2.2] ] }
      Cage/Size/Slot3/Boxes/Transform.m_LocalScale.z: { tangents: stepped, keys: [ [0, 0.001], [0.035, 2.2], [0.07, 2.2] ] }
  # Slot 3 readout: c = 2h·V − h − r per axis (face proximity is linear from the +Z face; V is the box reading),
  # summed under the non-normalized Direct root into both the AAPs and Output's localPosition (metres, cage frame).
  slot3_read_xp: { set: { CR/Slot3/x: 2.4, Cage/Size/Slot3/Output/Transform.m_LocalPosition.x: 2.4 } }
  slot3_read_yp: { set: { CR/Slot3/y: 2.4, Cage/Size/Slot3/Output/Transform.m_LocalPosition.y: 2.4 } }
  slot3_read_zp: { set: { CR/Slot3/z: 2.4, Cage/Size/Slot3/Output/Transform.m_LocalPosition.z: 2.4 } }
  slot3_read_bias: { set: { CR/Slot3/x: -1.25, CR/Slot3/y: -1.25, CR/Slot3/z: -1.25, Cage/Size/Slot3/Output/Transform.m_LocalPosition.x: -1.25, Cage/Size/Slot3/Output/Transform.m_LocalPosition.y: -1.25, Cage/Size/Slot3/Output/Transform.m_LocalPosition.z: -1.25 } }
  # Slot 3 x² table: 16 segments over [−h, h]; each 1D tree blends the two nearest, a chord that overestimates by ≤ w²/4
  # inside the table. The readout spans [−h−r, h−r]: the bottom r metres clamp to the first threshold and read low, but any
  # x below −h already puts r² at h² or more, far outside the burst radius, so the inward bias holds where it matters.
  slot3_sq_0: { set: { CR/Slot3/r2: 1.44 } }
  slot3_sq_1: { set: { CR/Slot3/r2: 1.1025 } }
  slot3_sq_2: { set: { CR/Slot3/r2: 0.81 } }
  slot3_sq_3: { set: { CR/Slot3/r2: 0.5625 } }
  slot3_sq_4: { set: { CR/Slot3/r2: 0.36 } }
  slot3_sq_5: { set: { CR/Slot3/r2: 0.2025 } }
  slot3_sq_6: { set: { CR/Slot3/r2: 0.09 } }
  slot3_sq_7: { set: { CR/Slot3/r2: 0.0225 } }
  slot3_sq_8: { set: { CR/Slot3/r2: 0 } }
  slot3_sq_9: { set: { CR/Slot3/r2: 0.0225 } }
  slot3_sq_10: { set: { CR/Slot3/r2: 0.09 } }
  slot3_sq_11: { set: { CR/Slot3/r2: 0.2025 } }
  slot3_sq_12: { set: { CR/Slot3/r2: 0.36 } }
  slot3_sq_13: { set: { CR/Slot3/r2: 0.5625 } }
  slot3_sq_14: { set: { CR/Slot3/r2: 0.81 } }
  slot3_sq_15: { set: { CR/Slot3/r2: 1.1025 } }
  slot3_sq_16: { set: { CR/Slot3/r2: 1.44 } }
  # Sweep layer: constants, and the self-copies a hold needs (weight = the AAP's own value, the clip writes 1).
  # Every constant clip also writes the Boundary meshes: scale = the burst surface, renderer on only for the configured shape while enabled.
  sw_boot: { set: { CR/Sweeping: 1, CR/Silent: 1, CR/Sweep: 0, CR/SweepBase: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 0, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.y: 0.5, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Cylinder/MeshRenderer.m_Enabled: 0 } }   # a fresh animator: silent, front at 0
  sw_off: { set: { CR/Sweeping: 1, CR/Silent: 0, CR/Sweep: 0, CR/SweepBase: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 0, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.y: 0.5, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Cylinder/MeshRenderer.m_Enabled: 0 } }   # the toggle off: loud, front at 0
  sw_paused: { set: { CR/Sweeping: 1, CR/Silent: 1, CR/Sweep: 0, CR/SweepBase: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 0, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.y: 0.5, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Cylinder/MeshRenderer.m_Enabled: 0 } }   # a distance-hide: silent, front at 0
  sw_idle: { set: { CR/Sweeping: 0, CR/Silent: 0, CR/Sweep: 1.1, CR/SweepBase: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.y: 0.5, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Cylinder/MeshRenderer.m_Enabled: 0 } }   # no sweep: the front parked at the face
  sw_sweeping: { set: { CR/Sweeping: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.y: 0.5, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Cylinder/MeshRenderer.m_Enabled: 0 } }   # the constant part of Wait
  sw_hold_sweep: { set: { CR/Sweep: 1 } }   # × Sweep (Wait: hold) or × SweepBase (Ramp: the ramp's origin)
  sw_latch_base: { set: { CR/SweepBase: 1 } }   # × Sweep: SweepBase ← Sweep
  sw_hold_base: { set: { CR/SweepBase: 1 } }   # × SweepBase: hold
  sw_hold_silent: { set: { CR/Silent: 1 } }   # × Silent: hold
  sw_ramp:   # × One: Sweeping 1 and the front's own travel, 0 → 1.155 m over 1 s, linear, added to SweepBase
    seconds: 1
    set: { CR/Sweeping: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.y: 0.5, Cage/Size/Boundary/Cylinder/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Cylinder/MeshRenderer.m_Enabled: 0 }
    curves:
      CR/Sweep: { tangents: linear, keys: [ [0, 0], [1, 1.155] ] }
