                - { clip: slot3_sq_2, threshold: -0.9 }
                - { clip: slot3_sq_3, threshold: -0.75 }
                - { clip: slot3_sq_4, threshold: -0.6 }
                - { clip: slot3_sq_5, threshold: -0.45 }
                - { clip: slot3_sq_6, threshold: -0.3 }
                - { clip: slot3_sq_7, threshold: -0.15 }
                - { clip: slot3_sq_8, threshold: 0 }
                - { clip: slot3_sq_9, threshold: 0.15 }
                - { clip: slot3_sq_10, threshold: 0.3 }
                - { clip: slot3_sq_11, threshold: 0.45 }
                - { clip: slot3_sq_12, threshold: 0.6 }
                - { clip: slot3_sq_13, threshold: 0.75 }
