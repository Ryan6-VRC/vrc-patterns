  slot3_read_zp: { set: { CR/Slot3/z: 2.4, Cage/Size/Slot3/Output/Transform.m_LocalPosition.z: 2.4 } }
  slot3_read_bias: { set: { CR/Slot3/x: -1.25, CR/Slot3/y: -1.25, CR/Slot3/z: -1.25, Cage/Size/Slot3/Output/Transform.m_LocalPosition.x: -1.25, Cage/Size/Slot3/Output/Transform.m_LocalPosition.y: -1.25, Cage/Size/Slot3/Output/Transform.m_LocalPosition.z: -1.25 } }
  # Slot 3 x² table: 16 segments over [−h, h]; each 1D tree blends the two nearest, a chord that overestimates by ≤ w²/4
  # inside the table. The readout spans [−h−r, h−r]: the bottom r metres clamp to the first threshold and read low, but any
  # x below −h already puts r² at h² or more, far outside the burst radius, so the inward bias holds where it matters.
  slot3_sq_0: { set: { CR/Slot3/r2: 1.44 } }
  slot3_sq_1: { set: { CR/Slot3/r2: 1.1025 } }
  slot3_sq_2: { set: { CR/Slot3/r2: 0.81 } }
  slot3_sq_3: { set: { CR/Slot3/r2: 0.5625 } }
  slot3_sq_4: { set: { CR/Slot3/r2: 0.36 } }
  slot3_sq_5: { set: { CR/Slot3/r2: 0.2025 } }
  slot3_sq_6: { set: { CR/Slot3/r2: 0.09 } }
  slot3_sq_7: { set: { CR/Slot3/r2: 0.0225 } }
  slot3_sq_8: { set: { CR/Slot3/r2: 0 } }
  slot3_sq_9: { set: { CR/Slot3/r2: 0.0225 } }
  slot3_sq_10: { set: { CR/Slot3/r2: 0.09 } }
  slot3_sq_11: { set: { CR/Slot3/r2: 0.2025 } }
  slot3_sq_12: { set: { CR/Slot3/r2: 0.36 } }
  slot3_sq_13: { set: { CR/Slot3/r2: 0.5625 } }
  slot3_sq_14: { set: { CR/Slot3/r2: 0.81 } }
  slot3_sq_15: { set: { CR/Slot3/r2: 1.1025 } }
  slot3_sq_16: { set: { CR/Slot3/r2: 1.44 } }
  # Sweep layer: constants, and the self-copies a hold needs (weight = the AAP's own value, the clip writes 1).
  # Every constant clip also writes the Boundary meshes: scale = the burst surface, renderer on only for the configured shape while enabled.
  sw_boot: { set: { CR/Sweeping: 1, CR/Silent: 1, CR/Sweep: 0, CR/SweepBase: 0, CR/SweepPrev: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 0 } }   # a fresh animator: silent, front at 0
  sw_off: { set: { CR/Sweeping: 1, CR/Silent: 0, CR/Sweep: 0, CR/SweepBase: 0, CR/SweepPrev: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 0 } }   # the toggle off: loud, front at 0
  sw_paused: { set: { CR/Sweeping: 1, CR/Silent: 1, CR/Sweep: 0, CR/SweepBase: 0, CR/SweepPrev: 0, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 0 } }   # a distance-hide: silent, front at 0
  sw_idle: { set: { CR/Sweeping: 0, CR/Silent: 0, CR/Sweep: 1.1, CR/SweepBase: 0, CR/SweepPrev: 1.1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 1 } }   # no sweep: the front parked at the face
  sw_sweeping: { set: { CR/Sweeping: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 1 } }   # the constant part of Wait
  sw_hold_sweep: { set: { CR/Sweep: 1 } }   # × Sweep (Wait: hold) or × SweepBase (Ramp: the ramp's origin)
  sw_hold_prev: { set: { CR/SweepPrev: 1 } }   # × Sweep: SweepPrev ← last frame's Sweep (a Direct weight reads its parameter one frame late; SweepPrev's default 0 makes the fill term vanish, so the read is exact)
  sw_latch_base: { set: { CR/SweepBase: 1 } }   # × Sweep: SweepBase ← Sweep
  sw_hold_base: { set: { CR/SweepBase: 1 } }   # × SweepBase: hold
  sw_hold_silent: { set: { CR/Silent: 1 } }   # × Silent: hold
  sw_ramp:   # × One: Sweeping 1 and the front's own travel, 0 → 1.155 m over 2 s, linear, added to SweepBase
    seconds: 2
    set: { CR/Sweeping: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.x: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.y: 1, Cage/Size/Boundary/Sphere/Transform.m_LocalScale.z: 1, Cage/Size/Boundary/Sphere/MeshRenderer.m_Enabled: 1 }
    curves:
      CR/Sweep: { tangents: linear, keys: [ [0, 0], [2, 1.155] ] }
  # Dedup layer: one clip per slot writing HitPrev at weight = that slot's Hit, and one per (slot, axis) carrying
  # every pair that slot is in — +1 where it is the pair's higher index, −1 where it is the lower — at weight = that
  # slot's own reading on that axis. One clip per (slot, axis) rather than one per (pair, axis, sign): the weight is
  # the same for every term it carries, and per D binding the children carrying it are still exactly the pair's two
  # slots, so the difference is the same arithmetic in a quarter of the children on a tree that runs every frame.
  hitprev_1: { set: { CR/Slot1/HitPrev: 1 } }   # × Slot1/Hit
  hitprev_2: { set: { CR/Slot2/HitPrev: 1 } }   # × Slot2/Hit
  hitprev_3: { set: { CR/Slot3/HitPrev: 1 } }   # × Slot3/Hit
  d_slot1_xp: { set: { CR/D/1_2/X+: -1, CR/D/1_3/X+: -1 } }   # × Slot1/X+
  d_slot1_yp: { set: { CR/D/1_2/Y+: -1, CR/D/1_3/Y+: -1 } }   # × Slot1/Y+
  d_slot1_zp: { set: { CR/D/1_2/Z+: -1, CR/D/1_3/Z+: -1 } }   # × Slot1/Z+
  d_slot2_xp: { set: { CR/D/1_2/X+: 1, CR/D/2_3/X+: -1 } }   # × Slot2/X+
  d_slot2_yp: { set: { CR/D/1_2/Y+: 1, CR/D/2_3/Y+: -1 } }   # × Slot2/Y+
  d_slot2_zp: { set: { CR/D/1_2/Z+: 1, CR/D/2_3/Z+: -1 } }   # × Slot2/Z+
  d_slot3_xp: { set: { CR/D/1_3/X+: 1, CR/D/2_3/X+: 1 } }   # × Slot3/X+
  d_slot3_yp: { set: { CR/D/1_3/Y+: 1, CR/D/2_3/Y+: 1 } }   # × Slot3/Y+
  d_slot3_zp: { set: { CR/D/1_3/Z+: 1, CR/D/2_3/Z+: 1 } }   # × Slot3/Z+
