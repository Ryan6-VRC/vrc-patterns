            - { clip: slot3_read_xp, directWeight: CR/Slot3/X+ }
            - { clip: slot3_read_yp, directWeight: CR/Slot3/Y+ }
            - { clip: slot3_read_zp, directWeight: CR/Slot3/Z+ }
            - tree: 1d
              name: Slot3 x²
              param: CR/Slot3/x
              directWeight: CR/One
              children:
                - { clip: slot3_sq_0, threshold: -1.2 }
                - { clip: slot3_sq_1, threshold: -1.05 }
                - { clip: slot3_sq_2, threshold: -0.9 }
                - { clip: slot3_sq_3, threshold: -0.75 }
