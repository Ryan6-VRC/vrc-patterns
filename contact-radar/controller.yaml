            - { clip: slot2_keep_C_y, directWeight: CR/Slot2/C/y }
            - { clip: slot2_keep_C_z, directWeight: CR/Slot2/C/z }
            - { clip: slot2_keep_Mem_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_keep_Mem_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_keep_Mem_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Recycle, when: [ CR/Slot2/X+ less 1e-05 ] }   # the readings fell on the grow step: release now
          - { to: Recycle, when: [ CR/Slot2/Y+ less 1e-05 ] }   # the readings fell on the grow step: release now
          - { to: Recycle, when: [ CR/Slot2/Z+ less 1e-05 ] }   # the readings fell on the grow step: release now
          - { to: TrackOut, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0975 s (Σ weight max × child length)
