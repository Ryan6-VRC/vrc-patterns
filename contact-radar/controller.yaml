          - { to: Latch, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ] }   # the rest of the reading arrived: Partial writes Open 1, so the ring hands off on this the same frame
