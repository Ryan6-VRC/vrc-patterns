  slot1_paused: { seconds: 0.035, set: { Cage/Size/Slot1/Boxes/GameObject.m_IsActive: 1, Cage/Size/Slot1/Boxes/X+/VRCContactReceiver.allowOthers: 0, Cage/Size/Slot1/Boxes/Y+/VRCContactReceiver.allowOthers: 0, Cage/Size/Slot1/Boxes/Z+/VRCContactReceiver.allowOthers: 0, Cage/Size/Slot1/Boxes/Transform.m_LocalScale.x: 0.001, Cage/Size/Slot1/Boxes/Transform.m_LocalScale.y: 0.001, Cage/Size/Slot1/Boxes/Transform.m_LocalScale.z: 0.001, Cage/Size/Slot1/Boxes/Transform.m_LocalPosition.x: 0, Cage/Size/Slot1/Boxes/Transform.m_LocalPosition.y: 0, Cage/Size/Slot1/Boxes/Transform.m_LocalPosition.z: 0, Cage/Size/Slot1/Output/Transform.m_LocalPosition.x: 0, Cage/Size/Slot1/Output/Transform.m_LocalPosition.y: 0, Cage/Size/Slot1/Output/Transform.m_LocalPosition.z: 0, CR/Slot1/Open: 0, CR/Slot1/Armed: 0, CR/Slot1/Front: 0, CR/Slot1/Held: 0, CR/Slot1/Settled: 0, CR/Slot1/Re: 0, Cage/Size/Slot1/Output/Payload/GameObject.m_IsActive: 0, Cage/Size/Slot1/Output/Payload/Burst/GameObject.m_IsActive: 1 } }   # collapsed through the pause
  slot1_mirror_off: { set: { Cage/Size/Slot1/Output/Payload/GameObject.m_IsActive: 0, Cage/Size/Slot1/Output/Payload/Burst/GameObject.m_IsActive: 1 } }   # a mirror clone, Shown 0: the payload off; every transform is the wearer's, the rest holds its rest value
  slot1_mirror_on: { set: { Cage/Size/Slot1/Output/Payload/GameObject.m_IsActive: 1, Cage/Size/Slot1/Output/Payload/Burst/GameObject.m_IsActive: 1 } }   # a mirror clone, Shown 1: the payload on, the burst fired on the edge
