            - { clip: slot3_re_mem_z, directWeight: CR/Slot3/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReShutBand, when: [ CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ] }   # the sender is back, admitted on every box
          - { to: Recycle, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.1137 s (Σ weight max × child length); the timeout: nothing came back
