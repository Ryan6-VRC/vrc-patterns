            - { clip: slot2_re_mem_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_re_mem_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_re_mem_z, directWeight: CR/Slot2/Mem/z }
