          - { to: Recycle, when: [ CR/Slot2/X+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot2/Y+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot2/Z+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
