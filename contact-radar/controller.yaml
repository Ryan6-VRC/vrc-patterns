          - { to: Recycle, when: [ CR/D/3_4/X+ greater -0.0002, CR/D/3_4/X+ less 0.0002, CR/D/2_4/X+ greater 0.0002, CR/D/2_4/Y+ greater -0.0002, CR/D/2_4/Y+ less 0.0002, CR/D/3_4/Y+ greater 0.0002, CR/D/2_4/Z+ greater -0.0002, CR/D/2_4/Z+ less 0.0002, CR/D/3_4/Z+ greater 0.0002, CR/Slot2/Held greater 0.5, CR/Slot2/Settled greater 0.5, CR/Slot3/Held greater 0.5, CR/Slot3/Settled greater 0.5 ] }   # settled dedup phantom: X+ of slot 3/Y+ of slot 2/Z+ of slot 2
          - { to: Recycle, when: [ CR/D/3_4/X+ greater -0.0002, CR/D/3_4/X+ less 0.0002, CR/D/2_4/X+ greater 0.0002, CR/D/2_4/Y+ greater -0.0002, CR/D/2_4/Y+ less 0.0002, CR/D/3_4/Y+ greater 0.0002, CR/D/3_4/Z+ greater -0.0002, CR/D/3_4/Z+ less 0.0002, CR/D/2_4/Z+ greater 0.0002, CR/Slot2/Held greater 0.5, CR/Slot2/Settled greater 0.5, CR/Slot3/Held greater 0.5, CR/Slot3/Settled greater 0.5 ] }   # settled dedup phantom: X+ of slot 3/Y+ of slot 2/Z+ of slot 3
          - { to: Recycle, when: [ CR/D/3_4/X+ greater -0.0002, CR/D/3_4/X+ less 0.0002, CR/D/1_4/X+ greater 0.0002, CR/D/3_4/Y+ greater -0.0002, CR/D/3_4/Y+ less 0.0002, CR/D/1_4/Y+ greater 0.0002, CR/D/1_4/Z+ greater -0.0002, CR/D/1_4/Z+ less 0.0002, CR/D/3_4/Z+ greater 0.0002, CR/Slot1/Held greater 0.5, CR/Slot1/Settled greater 0.5, CR/Slot3/Held greater 0.5, CR/Slot3/Settled greater 0.5 ] }   # settled dedup phantom: X+ of slot 3/Y+ of slot 3/Z+ of slot 1
          - { to: Recycle, when: [ CR/D/3_4/X+ greater -0.0002, CR/D/3_4/X+ less 0.0002, CR/D/2_4/X+ greater 0.0002, CR/D/3_4/Y+ greater -0.0002, CR/D/3_4/Y+ less 0.0002, CR/D/2_4/Y+ greater 0.0002, CR/D/2_4/Z+ greater -0.0002, CR/D/2_4/Z+ less 0.0002, CR/D/3_4/Z+ greater 0.0002, CR/Slot2/Held greater 0.5, CR/Slot2/Settled greater 0.5, CR/Slot3/Held greater 0.5, CR/Slot3/Settled greater 0.5 ] }   # settled dedup phantom: X+ of slot 3/Y+ of slot 3/Z+ of slot 2
          - { to: TrackIn, when: [ CR/Slot4/p2 less 1 ] }
      Recycle:                     # collapsed for a step, flag shut: every overlap this slot held ends; then straight onto the front, or Armed
        motion: { clip: slot4_recycle }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot2/Open less 0.5, CR/Slot3/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed less 0.5, CR/Slot1/Held greater 0.5, CR/Slot2/Held greater 0.5, CR/Slot3/Held greater 0.5 ], exitTime: 1.0 }   # nothing holding the front, nothing Armed, every lower slot holding: straight onto the front
