  d_slot1_x: { set: { CR/D/1_2/x: -16, CR/D/1_3/x: -16, CR/D/1_4/x: -16 } }   # × Slot1/Mem/x
  d_slot1_y: { set: { CR/D/1_2/y: -16, CR/D/1_3/y: -16, CR/D/1_4/y: -16 } }   # × Slot1/Mem/y
  d_slot1_z: { set: { CR/D/1_2/z: -16, CR/D/1_3/z: -16, CR/D/1_4/z: -16 } }   # × Slot1/Mem/z
  d_slot2_x: { set: { CR/D/1_2/x: 16, CR/D/2_3/x: -16, CR/D/2_4/x: -16 } }   # × Slot2/Mem/x
  d_slot2_y: { set: { CR/D/1_2/y: 16, CR/D/2_3/y: -16, CR/D/2_4/y: -16 } }   # × Slot2/Mem/y
  d_slot2_z: { set: { CR/D/1_2/z: 16, CR/D/2_3/z: -16, CR/D/2_4/z: -16 } }   # × Slot2/Mem/z
  d_slot3_x: { set: { CR/D/1_3/x: 16, CR/D/2_3/x: 16, CR/D/3_4/x: -16 } }   # × Slot3/Mem/x
  d_slot3_y: { set: { CR/D/1_3/y: 16, CR/D/2_3/y: 16, CR/D/3_4/y: -16 } }   # × Slot3/Mem/y
  d_slot3_z: { set: { CR/D/1_3/z: 16, CR/D/2_3/z: 16, CR/D/3_4/z: -16 } }   # × Slot3/Mem/z
  d_slot4_x: { set: { CR/D/1_4/x: 16, CR/D/2_4/x: 16, CR/D/3_4/x: 16 } }   # × Slot4/Mem/x
  d_slot4_y: { set: { CR/D/1_4/y: 16, CR/D/2_4/y: 16, CR/D/3_4/y: 16 } }   # × Slot4/Mem/y
  d_slot4_z: { set: { CR/D/1_4/z: 16, CR/D/2_4/z: 16, CR/D/3_4/z: 16 } }   # × Slot4/Mem/z
