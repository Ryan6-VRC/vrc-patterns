  slot1_sweep_cfg: { set: { Cage/Size/Slot1/Boxes/GameObject.m_IsActive: 1, Cage/Size/Slot1/Boxes/X+/VRCContactReceiver.allowOthers: 1, Cage/Size/Slot1/Boxes/Y+/VRCContactReceiver.allowOthers: 1, Cage/Size/Slot1/Boxes/Z+/VRCContactReceiver.allowOthers: 1, Cage/Size/Slot1/Boxes/Transform.m_LocalScale.x: 0.001, Cage/Size/Slot1/Boxes/Transform.m_LocalScale.y: 0.001, Cage/Size/Slot1/Boxes/Transform.m_LocalScale.z: 0.001, CR/Slot1/Open: 1, CR/Slot1/Armed: 0, CR/Slot1/Front: 1, CR/Slot1/Held: 0, CR/Slot1/Settled: 0, Cage/Size/Slot1/Output/Payload/GameObject.m_IsActive: 0, Cage/Size/Slot1/Output/Payload/Burst/GameObject.m_IsActive: 1 } }   # Open 1, Front 1, flag up, base scale: the growing cube's constant part
