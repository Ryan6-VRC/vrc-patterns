          name: Slot4 sweep
          normalized: false
          children:
            - { clip: slot4_sweep_cfg, directWeight: CR/One }
            - { clip: slot4_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ] }   # this slot's own admission: the riding readings, a step after the front-size cube took the sender; the Sweep layer freezes the front on the same predicate
          - { to: Partial, when: [ CR/Slot4/X+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot4/Y+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot4/Z+ greater 0 ] }
      Partial:                     # one riding box read a sender the others did not: a step's grace at the current front, else Recycle — a slot holding the front may never stall
