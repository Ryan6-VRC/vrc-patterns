          - { to: Recycle, when: [ CR/Slot4/y less -1.7 ] }
          - { to: Recycle, when: [ CR/Slot4/z greater 1.7 ] }   # past the bound on z
          - { to: Recycle, when: [ CR/Slot4/z less -1.7 ] }
      ReCollapseIn:                # a cut: boxes collapsed at the cage centre for a sampled step, flags shut, the chain reset to Mem, readout and payload held, Re 1
        motion:
          tree: direct
          name: Slot4 recollapse in
          normalized: false
          children:
            - { clip: slot4_recollapse_in, directWeight: CR/One }
            - { clip: slot4_re_hold_x, directWeight: CR/Slot4/Mem/x }
            - { clip: slot4_re_hold_y, directWeight: CR/Slot4/Mem/y }
            - { clip: slot4_re_hold_z, directWeight: CR/Slot4/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReOpenIn, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0488 s (Σ weight max × child length)
      ReOpenIn:                    # every box flag up at placeHalf on Mem: the returning sender is admitted through it, or the slot is given back
        motion:
          tree: direct
          name: Slot4 reopen in
          normalized: false
          children:
            - { clip: slot4_reopen_in, directWeight: CR/One }
            - { clip: slot4_re_mem_x, directWeight: CR/Slot4/Mem/x }
            - { clip: slot4_re_mem_y, directWeight: CR/Slot4/Mem/y }
            - { clip: slot4_re_mem_z, directWeight: CR/Slot4/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReShutIn, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ] }   # the sender is back, admitted on every box
          - { to: Recycle, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.1137 s (Σ weight max × child length); the timeout: nothing came back
      ReShutIn:                    # flags shut, grown to followHalf: a step samples the grown cluster before the follower resumes
        motion:
          tree: direct
          name: Slot4 reshut in
          normalized: false
          children:
            - { clip: slot4_reshut_in, directWeight: CR/One }
            - { clip: slot4_re_mem_x, directWeight: CR/Slot4/Mem/x }
            - { clip: slot4_re_mem_y, directWeight: CR/Slot4/Mem/y }
            - { clip: slot4_re_mem_z, directWeight: CR/Slot4/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: TrackIn, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0837 s (Σ weight max × child length)
          - { to: Recycle, when: [ CR/Slot4/X+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot4/Y+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot4/Z+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [], exitTime: 1.0 }   # the terminal fallback
      ReCollapseBand:              # a cut: boxes collapsed at the cage centre for a sampled step, flags shut, the chain reset to Mem, readout and payload held, Re 1
        motion:
          tree: direct
          name: Slot4 recollapse band
          normalized: false
          children:
            - { clip: slot4_recollapse_band, directWeight: CR/One }
            - { clip: slot4_re_hold_x, directWeight: CR/Slot4/Mem/x }
            - { clip: slot4_re_hold_y, directWeight: CR/Slot4/Mem/y }
            - { clip: slot4_re_hold_z, directWeight: CR/Slot4/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReOpenBand, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0488 s (Σ weight max × child length)
      ReOpenBand:                  # every box flag up at placeHalf on Mem: the returning sender is admitted through it, or the slot is given back
        motion:
          tree: direct
          name: Slot4 reopen band
          normalized: false
          children:
            - { clip: slot4_reopen_band, directWeight: CR/One }
            - { clip: slot4_re_mem_x, directWeight: CR/Slot4/Mem/x }
            - { clip: slot4_re_mem_y, directWeight: CR/Slot4/Mem/y }
            - { clip: slot4_re_mem_z, directWeight: CR/Slot4/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReShutBand, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ] }   # the sender is back, admitted on every box
          - { to: Recycle, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.1137 s (Σ weight max × child length); the timeout: nothing came back
      ReShutBand:                  # flags shut, grown to followHalf: a step samples the grown cluster before the follower resumes
        motion:
          tree: direct
          name: Slot4 reshut band
          normalized: false
          children:
            - { clip: slot4_reshut_band, directWeight: CR/One }
            - { clip: slot4_re_mem_x, directWeight: CR/Slot4/Mem/x }
            - { clip: slot4_re_mem_y, directWeight: CR/Slot4/Mem/y }
            - { clip: slot4_re_mem_z, directWeight: CR/Slot4/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: TrackBand, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0837 s (Σ weight max × child length)
          - { to: Recycle, when: [ CR/Slot4/X+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot4/Y+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot4/Z+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [], exitTime: 1.0 }   # the terminal fallback
      Recycle:                     # collapsed at the cage centre for a step, flags shut: every overlap this slot held ends; then straight onto the front, or Armed
        behaviours:
          - driver: { localOnly: true, set: { CR/Slot4/Shown: 0 } }
        motion: { clip: slot4_recycle }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot2/Open less 0.5, CR/Slot3/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed less 0.5, CR/Slot1/Held greater 0.5, CR/Slot2/Held greater 0.5, CR/Slot3/Held greater 0.5 ], exitTime: 1.0 }   # nothing holding the front, nothing Armed, every lower slot holding: straight onto the front
          - { to: Armed, when: [], exitTime: 1.0 }
    default: Boot
    layout:
      nodes: { Boot: [30, 180], Disabled: [30, 270], Paused: [270, 270], MirrorOff: [510, 180], MirrorOn: [510, 270], Armed: [30, 360], SweepShut: [-210, 360], Sweep: [-210, 450], Partial: [270, 450], Latch: [30, 450], LatchWait: [30, 540], LatchGrow: [30, 630], TrackOut: [-210, 720], TrackBand: [30, 720], TrackIn: [270, 720], Recycle: [30, 810], ReCollapseIn: [510, 720], ReOpenIn: [510, 630], ReShutIn: [510, 540], ReCollapseBand: [-450, 720], ReOpenBand: [-450, 630], ReShutBand: [-450, 540] }
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: Sweep
    # The expanding front, shared by every slot: Sweep (the front half-extent, m), SweepBase (where the current
    # sweeper's ramp started) and SweepPrev (last frame's front, which the next slot's shut cube rides). Slot layers
    # read these and never write them; each slot reports its own Front flag (1 in its Sweep state) for this layer to
    # ramp on. The front runs whenever a slot rides it and restarts from 0 at the face, so every sender inside the cube
    # is offered to exactly one flag-up cube once per pass.
    # Its second job: every state writes the Boundary meshes' scale and renderer enable (one state is always live here).
    states:
      Boot:                        # a fresh animator: the first pass runs from 0; leaves only on the Gate layer's verdict
        motion: { clip: sw_boot }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: the boundary's enable only; the front is the wearer's
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Wait, when: [ ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ] }
      Disabled:                    # the toggle is off: the next pass runs from 0
        motion: { clip: sw_off }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: the boundary's enable only; the front is the wearer's
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Wait, when: [ ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ] }
      Paused:                      # a distance-hide: the resume pass runs from 0
        motion: { clip: sw_paused }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: the boundary's enable only; the front is the wearer's
          - { to: Disabled, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is false ] }
          - { to: Wait, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ] }
      MirrorOff:                   # a mirror clone, toggle off: the boundary hidden
        motion: { clip: sw_mirror_off }
        transitions:
          - { to: MirrorOn, when: [ ContactRadar/Enable is true ] }
      MirrorOn:                    # a mirror clone, toggle on: the boundary drawn at the wearer's scale
        motion: { clip: sw_mirror_on }
        transitions:
          - { to: MirrorOff, when: [ ContactRadar/Enable is false ] }
      Wait:                        # nothing rides the front: it holds, SweepBase latches it, SweepPrev holds
        motion:
          tree: direct
          name: Sweep wait
          normalized: false
          children:
            - { clip: sw_shown, directWeight: CR/One }
            - { clip: sw_hold_sweep, directWeight: CR/Sweep }
            - { clip: sw_latch_base, directWeight: CR/Sweep }
            - { clip: sw_hold_prev, directWeight: CR/SweepPrev }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Ramp, when: [ CR/Slot1/Front greater 0.5 ] }
          - { to: Ramp, when: [ CR/Slot2/Front greater 0.5 ] }
          - { to: Ramp, when: [ CR/Slot3/Front greater 0.5 ] }
          - { to: Ramp, when: [ CR/Slot4/Front greater 0.5 ] }
      Ramp:                        # a slot's flag is up: the front grows from SweepBase at the configured speed
        motion:
          tree: direct
          name: Sweep ramp
          normalized: false
          children:
            - { clip: sw_ramp, directWeight: CR/One }
            - { clip: sw_hold_sweep, directWeight: CR/SweepBase }
            - { clip: sw_hold_base, directWeight: CR/SweepBase }
            - { clip: sw_hold_prev, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Wait, when: [ CR/Slot1/Front greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0 ] }   # slot 1 latched: freeze the front on the admission frame
          - { to: Wait, when: [ CR/Slot2/Front greater 0.5, CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ] }   # slot 2 latched: freeze the front on the admission frame
          - { to: Wait, when: [ CR/Slot3/Front greater 0.5, CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ] }   # slot 3 latched: freeze the front on the admission frame
          - { to: Wait, when: [ CR/Slot4/Front greater 0.5, CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ] }   # slot 4 latched: freeze the front on the admission frame
          - { to: Restart, when: [ CR/Sweep greater 1.2 ] }   # the face: the pass is over, the next one runs from 0
          - { to: Wait, when: [ CR/Slot1/Front less 0.5, CR/Slot2/Front less 0.5, CR/Slot3/Front less 0.5, CR/Slot4/Front less 0.5 ] }   # nothing rides (a Partial stepped aside, or the pass's last handoff found no taker): hold the front for the next slot's shut step
      Restart:                     # the pass boundary: the front parked at 0 for a sampled step, so the sweeper's cube collapses and every overlap it held ends
        motion: { clip: sw_restart }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Wait, when: [], exitTime: 1.0 }
    default: Boot
    layout:
      nodes: { Boot: [30, 180], Disabled: [30, 270], Paused: [270, 270], MirrorOff: [510, 180], MirrorOn: [510, 270], Wait: [30, 360], Ramp: [270, 360], Restart: [30, 450] }
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: Dedup
    # One state, one tree, no transitions, and deliberately no Paused and no Disabled: a non-normalized Direct tree
    # writes every binding it carries every frame, so nothing here can revert, and a park state would only add a
    # frame on which the differences read their defaults.
    # D/<j>_<k>/<a> = Mem_k − Mem_j in metres for every pair and every tilted axis. The weights are the Mem registers,
    # stored as (point + A)/S and so positive (a negative Direct weight clamps to 0); each clip writes ±S, and the
    # common A cancels in the difference. Every parameter here defaults to 0, so the below-weight-1 rest fill
    # contributes nothing and the difference is exact at any weight sum.
    states:
      Live:
        motion:
          tree: direct
          name: Dedup
          normalized: false
          children:
            - { clip: d_slot1_x, directWeight: CR/Slot1/Mem/x }
            - { clip: d_slot1_y, directWeight: CR/Slot1/Mem/y }
            - { clip: d_slot1_z, directWeight: CR/Slot1/Mem/z }
            - { clip: d_slot2_x, directWeight: CR/Slot2/Mem/x }
            - { clip: d_slot2_y, directWeight: CR/Slot2/Mem/y }
            - { clip: d_slot2_z, directWeight: CR/Slot2/Mem/z }
            - { clip: d_slot3_x, directWeight: CR/Slot3/Mem/x }
            - { clip: d_slot3_y, directWeight: CR/Slot3/Mem/y }
            - { clip: d_slot3_z, directWeight: CR/Slot3/Mem/z }
            - { clip: d_slot4_x, directWeight: CR/Slot4/Mem/x }
            - { clip: d_slot4_y, directWeight: CR/Slot4/Mem/y }
            - { clip: d_slot4_z, directWeight: CR/Slot4/Mem/z }
    default: Live
    layout:
      nodes: { Live: [30, 180] }
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

clips:
  # Gate layer: the verdict, held by the state that reached it; Init and Fork leave Gate at its default 0.
  gate_wait: { seconds: 0.0167 }   # unresolved
  gate_run: { set: { CR/Gate: 1 } }   # the wearer's own copy and every remote: run the rig
  gate_mirror: { set: { CR/Gate: 2 } }   # a mirror clone: the enable-only states
