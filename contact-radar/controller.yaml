          - { to: Latch, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ] }   # the rest of the reading arrived: Partial writes Open 1, so the ring hands off on this the same frame
          - { to: Recycle, when: [], exitTime: 1.0 }
