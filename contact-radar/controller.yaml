      ReCollapseIn:                # a cut: boxes collapsed at the cage centre for a sampled step, flags shut, the chain reset to Mem, readout and payload held, Re 1
        motion:
          tree: direct
          name: Slot2 recollapse in
          normalized: false
          children:
            - { clip: slot2_recollapse_in, directWeight: CR/One }
            - { clip: slot2_re_hold_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_re_hold_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_re_hold_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReOpenIn, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0488 s (Σ weight max × child length)
      ReOpenIn:                    # every box flag up at placeHalf on Mem: the returning sender is admitted through it, or the slot is given back
        motion:
          tree: direct
          name: Slot2 reopen in
          normalized: false
          children:
            - { clip: slot2_reopen_in, directWeight: CR/One }
            - { clip: slot2_re_mem_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_re_mem_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_re_mem_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReShutIn, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ] }   # the sender is back, admitted on every box
          - { to: Recycle, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.1137 s (Σ weight max × child length); the timeout: nothing came back
      ReShutIn:                    # flags shut, grown to followHalf: a step samples the grown cluster before the follower resumes
        motion:
          tree: direct
          name: Slot2 reshut in
          normalized: false
          children:
            - { clip: slot2_reshut_in, directWeight: CR/One }
            - { clip: slot2_re_mem_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_re_mem_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_re_mem_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: TrackIn, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0837 s (Σ weight max × child length)
          - { to: Recycle, when: [ CR/Slot2/X+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot2/Y+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot2/Z+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [], exitTime: 1.0 }   # the terminal fallback
      ReCollapseBand:              # a cut: boxes collapsed at the cage centre for a sampled step, flags shut, the chain reset to Mem, readout and payload held, Re 1
        motion:
          tree: direct
          name: Slot2 recollapse band
          normalized: false
          children:
            - { clip: slot2_recollapse_band, directWeight: CR/One }
            - { clip: slot2_re_hold_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_re_hold_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_re_hold_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReOpenBand, when: [], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0488 s (Σ weight max × child length)
      ReOpenBand:                  # every box flag up at placeHalf on Mem: the returning sender is admitted through it, or the slot is given back
        motion:
          tree: direct
          name: Slot2 reopen band
          normalized: false
          children:
            - { clip: slot2_reopen_band, directWeight: CR/One }
            - { clip: slot2_re_mem_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_re_mem_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_re_mem_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: ReShutBand, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ] }   # the sender is back, admitted on every box
