  - name: Slot4
    states:
      Boot:                        # a fresh animator: load, manual hide/show, a mirror clone
        motion: { clip: slot4_boot }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Armed, when: [ ContactRadar/Enable is true ], exitTime: 1.0 }
      Disabled:                    # Enable off — boxes stowed, flags shut, readings zeroed on every client
        behaviours:
          - driver: { localOnly: false, set: { CR/Slot4/X+: 0, CR/Slot4/Y+: 0, CR/Slot4/Z+: 0 } }
        motion: { clip: slot4_off }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Armed, when: [ ContactRadar/Enable is true ], exitTime: 1.0 }   # quantized: an Enable cycle spans a step
      Paused:                      # boxes collapsed through the pause; resume re-acquires from scratch
        motion: { clip: slot4_paused }
        transitions:
          - { to: Disabled, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is false ] }
          - { to: Armed, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is true ] }
      Armed:                       # flags shut and collapsed: holds no rejections; waits for the ring, or self-opens onto the front
        motion: { clip: slot4_armed }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: SweepShut, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot4/Armed greater 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed less 0.5 ] }   # ring on the readings: slot 1 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot2/Open greater 0.5, CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0, CR/Slot4/Armed greater 0.5, CR/Slot3/Armed less 0.5 ] }   # ring on the readings: slot 2 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot3/Open greater 0.5, CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0, CR/Slot4/Armed greater 0.5 ] }   # ring on the readings: slot 3 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot2/Open less 0.5, CR/Slot3/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed less 0.5, CR/Slot4/Armed greater 0.5 ], exitTime: 1.0 }   # self-open: nothing holding the front, no lower Armed; re-checked only on a crossing, so it costs at most one stepSeconds with nothing riding — the common-path recovery when the ring's one-frame handoff finds no taker
      SweepShut:                   # the cube appears at the front SHUT for a step: everything inside it is re-rejected
