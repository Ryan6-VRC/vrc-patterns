          tree: direct
          name: Slot4 sweep
          normalized: false
          children:
            - { clip: slot4_sweep_cfg, directWeight: CR/One }
            - { clip: slot4_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0 ] }   # this slot's own admission: the readings, a step after the front-size cube took the hand; the Sweep layer freezes the front on the same predicate
          - { to: Partial, when: [ CR/Slot4/X+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot4/Y+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot4/Z+ greater 0 ] }
      Partial:                     # one box read a hand the others did not: a step's grace at the current front, else Recycle — a slot holding the front may never stall
        motion:
          tree: direct
          name: Slot4 partial
          normalized: false
          children:
            - { clip: slot4_open_wait, directWeight: CR/One }
            - { clip: slot4_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
