  - name: Slot2
    states:
      Boot:                        # a fresh animator: load, manual hide/show, a mirror clone; leaves only on the Gate layer's verdict
        motion: { clip: slot2_boot }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: no slot logic; the payload follows the wearer's Shown
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Armed, when: [ ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ], exitTime: 1.0 }
      Disabled:                    # Enable off — boxes stowed, flags shut, readings zeroed on every client
        behaviours:
          - driver: { localOnly: false, set: { CR/Slot2/X+: 0, CR/Slot2/Y+: 0, CR/Slot2/Z+: 0, CR/Slot2/Shown: 0 } }
        motion: { clip: slot2_off }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: no slot logic; the payload follows the wearer's Shown
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Armed, when: [ ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ], exitTime: 1.0 }   # quantized: an Enable cycle spans a step
      Paused:                      # boxes collapsed through the pause; resume re-acquires from scratch
        behaviours:
          - driver: { localOnly: true, set: { CR/Slot2/Shown: 0 } }
        motion: { clip: slot2_paused }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: no slot logic; the payload follows the wearer's Shown
          - { to: Disabled, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is false ] }
          - { to: Armed, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ] }
      MirrorOff:                   # a mirror clone, this slot's payload off. Every transform here is the wearer's; nothing else is written
        motion: { clip: slot2_mirror_off }
        transitions:
          - { to: MirrorOn, when: [ CR/Slot2/Shown greater 0.5 ] }
      MirrorOn:                    # a mirror clone, this slot's payload on: the burst fires on this edge, where the wearer's Output sits
        motion: { clip: slot2_mirror_on }
        transitions:
          - { to: MirrorOff, when: [ CR/Slot2/Shown less 0.5 ] }
      Armed:                       # flags shut and collapsed: holds no rejections; waits for the ring, or self-opens onto the front
        motion: { clip: slot2_armed }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: SweepShut, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot2/Armed greater 0.5 ] }   # ring on the readings: slot 1 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot3/Open greater 0.5, CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0, CR/Slot2/Armed greater 0.5, CR/Slot4/Armed less 0.5, CR/Slot1/Armed less 0.5 ] }   # ring on the readings: slot 3 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot4/Open greater 0.5, CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0, CR/Slot2/Armed greater 0.5, CR/Slot1/Armed less 0.5 ] }   # ring on the readings: slot 4 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot3/Open less 0.5, CR/Slot4/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed greater 0.5 ], exitTime: 1.0 }   # self-open: nothing holding the front, no lower Armed; re-checked only on a crossing, so it costs at most one stepSeconds with nothing riding — the common-path recovery when the ring's one-frame handoff finds no taker
      SweepShut:                   # the cube appears at the front SHUT for a step: everything inside it is re-rejected
        motion:
          tree: direct
          name: Slot2 sweep shut
          normalized: false
          children:
            - { clip: slot2_sweepshut, directWeight: CR/One }
            - { clip: slot2_front_scale, directWeight: CR/SweepPrev }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Sweep, when: [], exitTime: 1.0 }
      Sweep:                       # flag up, the cube riding the Sweep layer's front: each sender is admitted alone as the front reaches it
        motion:
          tree: direct
          name: Slot2 sweep
          normalized: false
          children:
            - { clip: slot2_sweep_cfg, directWeight: CR/One }
            - { clip: slot2_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ] }   # this slot's own admission: the riding readings, a step after the front-size cube took the sender; the Sweep layer freezes the front on the same predicate
          - { to: Partial, when: [ CR/Slot2/X+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot2/Y+ greater 0 ] }
          - { to: Partial, when: [ CR/Slot2/Z+ greater 0 ] }
      Partial:                     # one riding box read a sender the others did not: a step's grace at the current front, else Recycle — a slot holding the front may never stall
        motion:
          tree: direct
          name: Slot2 partial
          normalized: false
          children:
            - { clip: slot2_open_wait, directWeight: CR/One }
            - { clip: slot2_front_scale, directWeight: CR/Sweep }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Latch, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ] }   # the rest of the reading arrived: Partial writes Open 1, so the ring hands off on this the same frame
          - { to: Recycle, when: [], exitTime: 1.0 }
      Latch:                       # one evaluation: decode the point at the admitting front size, place the boxes there at placeHalf with the riding flags shut, seed every register, park the readout
        motion:
          tree: direct
          name: Slot2 latch
          normalized: false
          children:
            - { clip: slot2_latch, directWeight: CR/One }
            - tree: direct
              name: Slot2 latch decode
              normalized: false
              directWeight: CR/Slot2/F
              children:
                - { clip: slot2_place_neg, directWeight: CR/One }
                - { clip: slot2_place_xp, directWeight: CR/Slot2/X+ }
                - { clip: slot2_place_yp, directWeight: CR/Slot2/Y+ }
                - { clip: slot2_place_zp, directWeight: CR/Slot2/Z+ }
            # X+ at the clamp (1.0): the sender straddles that face, its centre about 2·senderRadius past the decode; add it
            - tree: 1d
              name: Slot2 x saturated
              param: CR/Slot2/X+
              directWeight: CR/One
              children:
                - { clip: slot2_sat_xp_0, threshold: 0.999 }
                - { clip: slot2_sat_xp_2r, threshold: 1 }
            # Y+ at the clamp (1.0): the sender straddles that face, its centre about 2·senderRadius past the decode; add it
            - tree: 1d
              name: Slot2 y saturated
              param: CR/Slot2/Y+
              directWeight: CR/One
              children:
                - { clip: slot2_sat_yp_0, threshold: 0.999 }
                - { clip: slot2_sat_yp_2r, threshold: 1 }
            # Z+ at the clamp (1.0): the sender straddles that face, its centre about 2·senderRadius past the decode; add it
            - tree: 1d
              name: Slot2 z saturated
              param: CR/Slot2/Z+
              directWeight: CR/One
              children:
                - { clip: slot2_sat_zp_0, threshold: 0.999 }
                - { clip: slot2_sat_zp_2r, threshold: 1 }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: LatchWait, when: [ CR/Slot2/Held greater 0.5 ] }
      LatchWait:                   # the placement held for two collision steps: a riding axis the placement lost has fallen by then
        motion:
          tree: direct
          name: Slot2 latch wait
          normalized: false
          children:
            - { clip: slot2_latchwait, directWeight: CR/One }
            - { clip: slot2_keep_C_x, directWeight: CR/Slot2/C/x }
            - { clip: slot2_keep_C_y, directWeight: CR/Slot2/C/y }
            - { clip: slot2_keep_C_z, directWeight: CR/Slot2/C/z }
            - { clip: slot2_keep_Mem_x, directWeight: CR/Slot2/Mem/x }
            - { clip: slot2_keep_Mem_y, directWeight: CR/Slot2/Mem/y }
            - { clip: slot2_keep_Mem_z, directWeight: CR/Slot2/Mem/z }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Recycle, when: [ CR/Slot2/X+ less 1e-05 ] }   # a riding axis fell: a cut on the shrink step, or a merge corner that holds nothing
          - { to: Recycle, when: [ CR/Slot2/Y+ less 1e-05 ] }   # a riding axis fell: a cut on the shrink step, or a merge corner that holds nothing
          - { to: Recycle, when: [ CR/Slot2/Z+ less 1e-05 ] }   # a riding axis fell: a cut on the shrink step, or a merge corner that holds nothing
          - { to: LatchGrow, when: [ CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0 ], exitTime: 1.0 }   # dwell: the tree's length, at most 0.0975 s (Σ weight max × child length)
          - { to: Recycle, when: [], exitTime: 1.0 }   # the terminal fallback, unreachable while every axis is above zero or at the floor
      LatchGrow:                   # every flag shut, the cluster grown to followHalf: a collision step samples it before TrackOut decodes
        motion:
          tree: direct
          name: Slot2 latch grow
          normalized: false
          children:
            - { clip: slot2_latchgrow, directWeight: CR/One }
