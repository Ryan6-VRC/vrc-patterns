          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: TrackOut, when: [ CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0 ], exitTime: 1.0 }
          - { to: Recycle, when: [ CR/Slot3/X+ less 1e-05 ] }   # the readings fell on the expansion step: release now, as the tracking states do
          - { to: Recycle, when: [ CR/Slot3/Y+ less 1e-05 ] }   # the readings fell on the expansion step: release now, as the tracking states do
          - { to: Recycle, when: [ CR/Slot3/Z+ less 1e-05 ] }   # the readings fell on the expansion step: release now, as the tracking states do
          - { to: Recycle, when: [], exitTime: 1.0 }   # the terminal fallback: unreachable while every axis is above zero or at the floor, kept so the ladder gives the slot back
