  - name: Slot2
    states:
      Boot:                        # a fresh animator: load, manual hide/show, a mirror clone
        motion: { clip: slot2_boot }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Armed, when: [ ContactRadar/Enable is true ], exitTime: 1.0 }
      Disabled:                    # Enable off — boxes stowed, flag shut, readings zeroed on every client
        behaviours:
          - driver: { localOnly: false, set: { CR/Slot2/X+: 0, CR/Slot2/Y+: 0, CR/Slot2/Z+: 0 } }
        motion: { clip: slot2_off }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Armed, when: [ ContactRadar/Enable is true ], exitTime: 1.0 }   # quantized: an Enable cycle spans a step
      Paused:                      # boxes collapsed through the pause; resume re-acquires from scratch
        motion: { clip: slot2_paused }
        transitions:
          - { to: Disabled, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is false ] }
          - { to: Armed, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is true ] }
      Armed:                       # flag shut and collapsed: holds no rejections; waits for the ring, or self-opens onto the front
        motion: { clip: slot2_armed }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: SweepShut, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot2/Armed greater 0.5 ] }   # ring on the readings: slot 1 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot3/Open greater 0.5, CR/Slot3/X+ greater 0, CR/Slot3/Y+ greater 0, CR/Slot3/Z+ greater 0, CR/Slot2/Armed greater 0.5, CR/Slot4/Armed less 0.5, CR/Slot1/Armed less 0.5 ] }   # ring on the readings: slot 3 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot4/Open greater 0.5, CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0, CR/Slot2/Armed greater 0.5, CR/Slot1/Armed less 0.5 ] }   # ring on the readings: slot 4 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot3/Open less 0.5, CR/Slot4/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed greater 0.5 ], exitTime: 1.0 }   # self-open: nothing holding the front, no lower Armed; re-checked only on a crossing, so it costs at most one stepSeconds with nothing riding — the common-path recovery when the ring's one-frame handoff finds no taker
      SweepShut:                   # the cube appears at the front SHUT for a step: everything inside it is re-rejected
        motion:
          tree: direct
          name: Slot2 sweep shut
          normalized: false
          children:
            - { clip: slot2_sweepshut, directWeight: CR/One }
            - { clip: slot2_front_scale, directWeight: CR/SweepPrev }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Sweep, when: [], exitTime: 1.0 }
      Sweep:                       # flag up, the cube riding the Sweep layer's front: each hand is admitted alone as the front reaches it
        motion:
          tree: direct
          name: Slot2 sweep
          normalized: false
