          - { to: Recycle, when: [ CR/Slot3/Y+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
          - { to: Recycle, when: [ CR/Slot3/Z+ less 1e-05 ] }   # a second cut inside the dwell: give the slot back, one reacquire per cut
