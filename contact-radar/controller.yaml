# contact-radar: 4 per-sender slots, tags ['HandR'], 3 coincident face-proximity boxes each; the riding readings are the latch.
# The acquisition cube is tilted (diagonal vertical) on the prefab; the readout is in that frame, and yw = (x + y + z)/sqrt3
# undoes the tilt on the vertical axis alone. The zone is a vertical cylinder: p2 = x² + y² + z² − yw² is the in-plane radius².
# Burst at p2 < 1 (R_in 1.0 m), re-arm at p2 > 1.21 (R_out 1.1 m); no height bound:
# a sender at the burst radius is inside the acquisition cube from every direction within ±0.577644866 m
# of the centre height, and past that band the cube's corners are the zone's ends.
# Acquisition half-extent 1.2 m; a latch places a 0.15 m cluster at the decoded point and grows it to 0.5 m,
# which follows the sender at gain 0.5, paired 1 evaluations back; bound ±1.7 m per tilted axis; sender radius 0.05 m;
# step dwell 0.035 s, grow dwell 0.07 s, reacquire wait 0.1 s; dedup band 0.05 m.
# One slot at a time rides an expanding front from the centre to the face over 2.0 s, and the front restarts
# there, so every sender inside the cube is offered to exactly one flag-up cube per pass and admitted alone as the front
# reaches it; the Dedup layer releases a re-admitted sender another slot already holds.
# Per-client: every copy of the avatar senses on its own client (receivers localOnly 0);
# one synced bit (the enable) and nothing else crosses the wire. generate.py's docstring
# carries the mechanism; the README carries the traps.

