  - name: Slot3
    states:
      Boot:                        # a fresh animator: load, manual hide/show, a mirror clone; leaves only on the Gate layer's verdict
        motion: { clip: slot3_boot }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: no slot logic; the payload follows the wearer's Shown
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: Armed, when: [ ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ], exitTime: 1.0 }
      Disabled:                    # Enable off — boxes stowed, flags shut, readings zeroed on every client
        behaviours:
          - driver: { localOnly: false, set: { CR/Slot3/X+: 0, CR/Slot3/Y+: 0, CR/Slot3/Z+: 0, CR/Slot3/Shown: 0 } }
        motion: { clip: slot3_off }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: no slot logic; the payload follows the wearer's Shown
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Armed, when: [ ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ], exitTime: 1.0 }   # quantized: an Enable cycle spans a step
      Paused:                      # boxes collapsed through the pause; resume re-acquires from scratch
        behaviours:
          - driver: { localOnly: true, set: { CR/Slot3/Shown: 0 } }
        motion: { clip: slot3_paused }
        transitions:
          - { to: MirrorOff, when: [ CR/Gate greater 1.5 ] }   # a mirror clone: no slot logic; the payload follows the wearer's Shown
          - { to: Disabled, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is false ] }
          - { to: Armed, when: [ IsAnimatorEnabled is true, ContactRadar/Enable is true, CR/Gate greater 0.5, CR/Gate less 1.5 ] }
      MirrorOff:                   # a mirror clone, this slot's payload off. Every transform here is the wearer's; nothing else is written
        motion: { clip: slot3_mirror_off }
        transitions:
          - { to: MirrorOn, when: [ CR/Slot3/Shown greater 0.5 ] }
      MirrorOn:                    # a mirror clone, this slot's payload on: the burst fires on this edge, where the wearer's Output sits
        motion: { clip: slot3_mirror_on }
        transitions:
          - { to: MirrorOff, when: [ CR/Slot3/Shown less 0.5 ] }
      Armed:                       # flags shut and collapsed: holds no rejections; waits for the ring, or self-opens onto the front
        motion: { clip: slot3_armed }
        transitions:
          - { to: Paused, when: [ IsAnimatorEnabled is false ] }   # the pre-halt frame: park before the animator stops
          - { to: Disabled, when: [ ContactRadar/Enable is false ] }
          - { to: SweepShut, when: [ CR/Slot1/Open greater 0.5, CR/Slot1/X+ greater 0, CR/Slot1/Y+ greater 0, CR/Slot1/Z+ greater 0, CR/Slot3/Armed greater 0.5, CR/Slot2/Armed less 0.5 ] }   # ring on the readings: slot 1 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot2/Open greater 0.5, CR/Slot2/X+ greater 0, CR/Slot2/Y+ greater 0, CR/Slot2/Z+ greater 0, CR/Slot3/Armed greater 0.5 ] }   # ring on the readings: slot 2 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot4/Open greater 0.5, CR/Slot4/X+ greater 0, CR/Slot4/Y+ greater 0, CR/Slot4/Z+ greater 0, CR/Slot3/Armed greater 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5 ] }   # ring on the readings: slot 4 latched, nothing Armed between
          - { to: SweepShut, when: [ CR/Slot1/Open less 0.5, CR/Slot2/Open less 0.5, CR/Slot4/Open less 0.5, CR/Slot1/Armed less 0.5, CR/Slot2/Armed less 0.5, CR/Slot3/Armed greater 0.5 ], exitTime: 1.0 }   # self-open: nothing holding the front, no lower Armed; re-checked only on a crossing, so it costs at most one stepSeconds with nothing riding — the common-path recovery when the ring's one-frame handoff finds no taker
      SweepShut:                   # the cube appears at the front SHUT for a step: everything inside it is re-rejected
