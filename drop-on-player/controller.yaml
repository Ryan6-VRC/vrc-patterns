# drop-on-player — grab a prop and route its release to {own head / another player's head / world}
# (gimmicks.md §Constraint patterns "Attaching a prop to a body point"). A grab-prop whose release
# ARBITRATES between three rest modes instead of always dropping: release while the standard-tag
# self receiver fires => Anchored (own-head constraint, late-syncs); release while the cage
# receivers fire on another player's head => Tracked (box-tracker cage, per-client re-derivation, no
# late-sync); neither => Dropped (sample-and-hold world freeze, no late-sync). Standalone
# compressed controller, not a compose of grab-prop + box-tracker (their idioms are reused inline;
# the arbitration/mode-fusion layer is what this entry ships).
#
# Wire surface: 2 synced bools read directly by the state machine — the pair IS the rest mode:
#   Out=0 Worn=0  Disabled (hidden; off-is-reset)
#   Out=0 Worn=1  Anchored (own head — the safe, late-syncing home; Enable-on lands here)
#   Out=1 Worn=1  Tracked  (another player's head)
#   Out=1 Worn=0  Dropped  (world-frozen)
# Only the wearer's client writes the pair (localOnly drivers on mode-state entry); remotes pose
# the rig from the pair + natively-synced GrabBone_IsGrabbed. Menu intents (Enable, ToHead) are
# UNSYNCED local params — the synced pair carries the outcome, so menu costs 0 extra bits.
#
# TRACKING = box-tracker's 4-box exact readout (lifted from that entry's controller; see its
# README for the reconstruction math and the crawl-gain contract, which owns both). The head-
# catcher's cage is 4 face-proximity BOX receivers (X+ X- Y+ Z+), an exact linear readout writing
# Output.localPosition inside the Tracked state's direct tree, and a feedback constraint (source0
# Output : source1 self) crawling the cage onto the reading, gain held at zero across the latch
# frames then 0.7 (the tracked clip's guard curve; box-tracker's crawl block owns the value
# and the DBT stretch rule that sizes this state's children). Against contact-tracker's 6-sphere
# crawler-servo: 4 contacts instead of 6, an exact position instead of a converging centroid, and
# ANY-loss instead of ALL-loss (one dead box breaks the reconstruction).
#
# Head-catch zone (wear-test-tuned): the acquisition cube is stretched to a VERTICAL COLUMN — taller
# than it is wide — so lowering a prop onto a head reliably catches; it doubles as the release-
# arbitration zone. Set on the prefab by TrackingPoints rest
# localScale + VRCScaleConstraint ScaleAtRest, edited together — zone side = 3 × scale per axis. The
# receiver box is a 1.5³ cube in local space, so the 90° rotations are shape-invariant and a
# non-uniform parent scale gives a clean axis-aligned box; tracking geometry is constraint-pinned
# absolute (World.prefab, uniform) so the readout stays EXACT. Cost: one latch frame of
# ~r·(s_y/s_x − 1) radius-compensation skew on Y/Z, which decays via the crawl (box-tracker's
# documented non-uniform trap — benign for a prop).
#
# The tuned constants are the README's Empirical-constants table — what each knob does, and which of
# these clips or which prefab field authors it. Values live at those sites only; the inline comments
# below carry each one's rationale. runtime.md's 90% rule governs changing any of them.
#
# Deliberate deltas from the source ancestor: no banded mode int (2 direct bools —
# few exclusive states, gimmicks.md §Packaging and interface); no 6 s world-band dwell (it existed for
# Custom-Object-Sync repair — no COS here; the non-derivable bands park in Waiting instead); no
# 7th arbitration receiver (the 4 cage receivers, parked ON the prop with filters open, are the
# "near another head" sensor); no gesture grammar / multi-anchor (out of scope).

schema: 1
controller: DropOnPlayer_Fx
basis: mount-root          # paths bind against the module prefab root (VRCFury FullController seam)
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  # The synced pair — the rest mode, written only by the wearer's localOnly drivers.
  DropOnPlayer/Out:    { type: bool, default: false, vrc: { synced: true, saved: false } }
  DropOnPlayer/Worn:   { type: bool, default: false, vrc: { synced: true, saved: false } }
  # Menu intents — local-only (unsynced); the pair carries the outcome.
  DropOnPlayer/Enable: { type: bool, default: false, vrc: { synced: false, saved: false } }
  DropOnPlayer/ToHead: { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Sensing — never synced, never menu-exposed; listed in the params asset for legibility.
  DropOnPlayer/SelfDetect: float   # standard-Head proximity (own head sender -> prop receiver; allowSelf, localOnly)
  DropOnPlayer/X+: float           # cage face-proximity (Head tag, allowOthers, localOnly:0 — remotes re-derive)
  DropOnPlayer/X-: float
  DropOnPlayer/Y+: float
  DropOnPlayer/Z+: float
  # Constant-1 direct weight carrying the latch clip inside the readout tree; never driven.
  DropOnPlayer/One: { type: float, default: 1, scratch: true }
  GrabBone_IsGrabbed: bool         # minted by the grab physbone (parameter: GrabBone); native grab sync
  IsLocal: bool                    # VRC built-in

# The shipped menu. Two controls, so it ships as an asset rather than two bare VRCFury Toggles:
# `menus:` places it at the FullController's prefix and RewriteParamName rewrites control and parameter
# together, which is what keeps both names OFF `globalParams` and out of a host avatar's reach
# (CONVENTIONS.md §The Interface stanza). Enable latches; ToHead is the momentary recall, so it is a
# Button — a Toggle would leave the recall asserted until the wearer noticed and switched it back.
menu:
  - toggle: Enable
    param: DropOnPlayer/Enable
  - button: Recall to Head
    param: DropOnPlayer/ToHead

layers:
  # Mode machine: one flat machine in two lanes. IsLocal is constant per client, so root Timer routes
  # each client once, by level transition (entry rungs evaluate before the runtime writes IsLocal),
  # into the wearer half or the remote half, and the two never meet again. The wearer half is the
  # wearer: the release ladder arbitrates off live sensors and the localOnly drivers stamp the pair.
  # The remote half poses the rig from the pair plus the natively synced grab, and carries no driver.
  # A mirror clone reads IsLocal true, takes the wearer half, and runs no drivers (runtime.md
  # §Parameters). Clips are shared by name — Local Tracked and Remote Tracked both play the tracked
  # readout. State names carry the lane as a leading word (Local X / Remote X): siblings stay unique,
  # the animator window's lists sort by lane, and a state's twin across the lanes shares its last word.
  - name: DropOnPlayer/Control
    states:
      # Boot dwell: the wearer leaves on frame one; a remote waits out param arrival, then routes by
      # pair. The exit-time rungs read IsLocal false too: a first frame longer than the dwell would
      # otherwise carry a wearer whose IsLocal is not yet written into the remote half, which has no
      # way back. Non-derivable bands (Out=1: the tracked/dropped position never syncs) park in
      # Waiting, hidden, until a witnessed grab.
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Local Disabled,  when: [ IsLocal is true ] }
          - { to: Remote Anchored, when: [ IsLocal is false, DropOnPlayer/Out is false, DropOnPlayer/Worn is true ], exitTime: 1.0 }
          - { to: Remote Waiting,  when: [ IsLocal is false, DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: Remote Disabled, when: [ IsLocal is false ], exitTime: 1.0 }
      # ---- The wearer half (Local …). Every entry into it is Timer's explicit rung.
      Local Disabled:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 0, DropOnPlayer/Worn: 0 } }
        motion: { clip: disabled }
        transitions:
          - { to: Local Anchored, when: [ DropOnPlayer/Enable is true ] }
      # Anchored — own head (the reset target: Enable-on and ToHead both land here).
      Local Anchored:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 0, DropOnPlayer/Worn: 1 } }
        motion: { clip: anchored }
        transitions:
          - { to: Local Disabled, when: [ DropOnPlayer/Enable is false ] }
          - { to: Local Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
      # Grabbed — the carry. Release-time arbitration is the exit ladder, priority top-down: own
      # head beats another player's head beats world. The pair holds its previous code during
      # the carry (no transient band).
      Local Grabbed:
        motion: { clip: grabbed }
        transitions:
          - { to: Local Disabled, when: [ DropOnPlayer/Enable is false ] }
          - { to: Local Anchored, when: [ GrabBone_IsGrabbed is false, DropOnPlayer/SelfDetect greater 0 ] }
          - { to: Local Tracked,  when: [ GrabBone_IsGrabbed is false, DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: Local Released, when: [ GrabBone_IsGrabbed is false ] }
      # Release choreography (world-drop): t=0 the Container constraint disables (the freeze) and
      # the bone chain re-anchors onto the frozen prop; t=0.25 SourcePosition re-samples the
      # settled tip; t=0.5 it holds. Only the world-drop branch enters here; the driver stamps 10
      # AT RELEASE so the pair beats the remotes' pulse end. No grab exit: the pulse is a re-grab
      # lockout.
      Local Released:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 0 } }
        motion: { clip: released }
        transitions:
          - { to: Local Disabled, when: [ DropOnPlayer/Enable is false ] }
          - { to: Local Dropped,  when: [], exitTime: 1.0 }
      # Dropped — world-frozen (the disabled constraint holds the transform; the held sample lets
      # a re-grab pick up at the drop point). Also the loss target: the driver re-stamps 10 when
      # Tracked loses its sender, so remotes converge on freeze.
      Local Dropped:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 0 } }
        motion: { clip: dropped }
        transitions:
          - { to: Local Disabled, when: [ DropOnPlayer/Enable is false ] }
          - { to: Local Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Local Anchored, when: [ DropOnPlayer/ToHead is true ] }
      # Tracked — the box cage latches (allowOthers shut), the readout writes Output.localPosition
      # inside this state's direct tree, and the feedback constraint crawls the cage onto it.
      # ANY-loss (box-tracker): one dead box breaks the reconstruction, so the loss edges fire on
      # the FIRST box to drop, not the last — one transition per box (a layer takes one edge per
      # frame). Loss stamps Dropped: freeze, never snap-home, since observers unload the target at
      # different times.
      Local Tracked:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 1 } }
        motion:
          tree: direct
          name: BoxReadout
          normalized: false
          children:
            - { clip: tracked, directWeight: DropOnPlayer/One }   # latch geometry + tracked-mode rig config
            - { clip: readout_xp, directWeight: DropOnPlayer/X+ }
            - { clip: readout_xn, directWeight: DropOnPlayer/X- }
            - { clip: readout_yp, directWeight: DropOnPlayer/Y+ }
            - { clip: readout_zp, directWeight: DropOnPlayer/Z+ }
        transitions:
          - { to: Local Disabled, when: [ DropOnPlayer/Enable is false ] }
          - { to: Local Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Local Anchored, when: [ DropOnPlayer/ToHead is true ] }
          - { to: Local Dropped, when: [ DropOnPlayer/X+ less 0.00001 ] }
          - { to: Local Dropped, when: [ DropOnPlayer/X- less 0.00001 ] }
          - { to: Local Dropped, when: [ DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Local Dropped, when: [ DropOnPlayer/Z+ less 0.00001 ] }
      # ---- The remote half (Remote …). Every rung here reads the pair (the wearer's stamp) or the
      # synced grab; a pair change without a witnessed grab is a missed carry, and the mode states
      # re-route on it directly.
      Remote Disabled:
        motion: { clip: disabled }
        transitions:
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: Remote Waiting,  when: [ DropOnPlayer/Out is true ] }
      Remote Anchored:
        motion: { clip: anchored }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Remote Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Remote Tracked,  when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is true ] }
          - { to: Remote Dropped,  when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false ] }
      # The carry, witnessed. Every release routes through Released and waits for the pair.
      Remote Grabbed:
        motion: { clip: grabbed }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Remote Released, when: [ GrabBone_IsGrabbed is false ] }
      # The pulse doubles as the remote settle window: route by the ARRIVED pair at exitTime; a
      # stale pair self-corrects via the mode states' rungs. No grab exit: the pulse is a re-grab
      # lockout.
      Remote Released:
        motion: { clip: released }
        transitions:
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ], exitTime: 1.0 }
          - { to: Remote Tracked,  when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ], exitTime: 1.0 }
          - { to: Remote Dropped,  when: [], exitTime: 1.0 }
      Remote Dropped:
        motion: { clip: dropped }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Remote Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: Remote Tracked,  when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is true ] }
      # This client re-derives the chase on its own sensors. ANY-loss falls to Lost without
      # writing the pair.
      Remote Tracked:
        motion:
          tree: direct
          name: BoxReadout
          normalized: false
          children:
            - { clip: tracked, directWeight: DropOnPlayer/One }
            - { clip: readout_xp, directWeight: DropOnPlayer/X+ }
            - { clip: readout_xn, directWeight: DropOnPlayer/X- }
            - { clip: readout_yp, directWeight: DropOnPlayer/Y+ }
            - { clip: readout_zp, directWeight: DropOnPlayer/Z+ }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Remote Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Remote Lost, when: [ DropOnPlayer/X+ less 0.00001 ] }
          - { to: Remote Lost, when: [ DropOnPlayer/X- less 0.00001 ] }
          - { to: Remote Lost, when: [ DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Remote Lost, when: [ DropOnPlayer/Z+ less 0.00001 ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: Remote Dropped,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is true ] }
      # Lost — freeze while the pair still reads Tracked (this client's cage lost the sender; it
      # cannot rewrite the synced pair, and re-opening the filters would re-latch a WRONG nearby
      # head). Same pose as Dropped; exits only on a witnessed grab or a pair change — no pair-11
      # re-entry, so no Tracked<->Lost oscillation.
      Remote Lost:
        motion: { clip: dropped }
        transitions:
          - { to: Remote Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: Remote Dropped,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is true ] }
      # Late-join park: pair says the prop is out (Out=1) but its position never synced — hidden
      # (fail-visible) until a witnessed grab re-establishes it. The grab physbone lives OUTSIDE
      # the hidden Container branch so the grab always can.
      Remote Waiting:
        motion: { clip: waiting }
        transitions:
          - { to: Remote Grabbed,  when: [ GrabBone_IsGrabbed is true ] }
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
    default: Timer
    # Two lanes under Timer, wearer left (negative x), remotes right: each lane descends Disabled →
    # Anchored → Grabbed → Tracked with the release pulse falling outboard to Dropped, twins on
    # matching rows. The remote-only states take the third column: Waiting beside Disabled (the other
    # boot park), Lost further out, off the Tracked→Dropped row so its edges do not merge with it.
    layout:
      nodes:
        Timer:           [30, 180]
        Local Disabled:  [-210, 270]
        Local Anchored:  [-210, 360]
        Local Grabbed:   [-210, 450]
        Local Released:  [-450, 450]
        Local Tracked:   [-210, 540]
        Local Dropped:   [-450, 540]
        Remote Disabled: [270, 270]
        Remote Waiting:  [510, 270]
        Remote Anchored: [270, 360]
        Remote Grabbed:  [270, 450]
        Remote Released: [510, 450]
        Remote Tracked:  [270, 540]
        Remote Dropped:  [510, 540]
        Remote Lost:     [750, 360]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

# Every Control clip owns the full rig-property set explicitly (no reliance on WD revert; the
# semantics survive a VRCFury WD-OFF conversion). The cage is box-tracker's: 4 BOX receivers
# (X+ X- Y+ Z+) coincident at the cage center, resized only by host-GO localScale — (0.5,0.5,1)
# collapses them to one acquisition column, (1,1,1) is the absolute tracking geometry. No clip
# moves a receiver's localPosition (the readout is the DBT, not a position spread); of the crawl
# constraint's source weights only source0 is animated, by the Tracked clip alone (the gain
# guard above), the rest holding their prefab values. Output is pinned to the cage center everywhere but
# Tracked, where the readout tree writes it.
# Off-state hygiene: Disabled kills the grab physbone's GO (an "off" module must not stay
# grabbable; resetWhenDisabled 0 preserves pose) and the four cage-receiver GOs (no sensing while
# off). A disabled receiver GO FREEZES its float at the last value — safe here because the floats
# are only read from Grabbed's release ladder and Tracked's loss edges, states whose receivers
# have been live for many frames by the time those edges evaluate. SelfDetect rides TrackingOffset
# under Container, which these same clips deactivate — same freeze, same argument (it is read only
# from Grabbed's ladder, where Container has been live throughout the carry). Timer/Waiting keep
# everything alive: they are enabled-module states, and the witnessed grab is Waiting's only exit.
# KNOWN SIMPLIFICATION — the GO kill is only half of force-release: a disabled physbone never
# clears GrabBone_IsGrabbed (`runtime.md`), so toggling off mid-grab freezes it true and the next
# enable re-enters Grabbed (and a stale true also opens Waiting/Lost's grab edges) until the
# re-enabled bone republishes. Accepted: this is a library sample, not a module whose off must
# interrupt an action. A consumer that needs a clean force-release adds a driver clearing the param
# to Disabled — the write sticks precisely because the bone GO is inactive (`verify.md`).
# Constraint source maps (box-tracker cage). SourcePosition is a CHILD of Container, and Container's
# own constraint reads it (source1) — so Container solves in the strictly earlier group and reads the
# sample one frame stale, which is the sample-and-hold capture, authored by the hierarchy relation
# rather than left to the solver's roll (../grab-prop/README.md §How it works owns the rule and the
# measurement; runtime.md §Constraints owns the target-hierarchy invariant). Never flatten it.
#   Container/VRCPositionConstraint:               source0 HeadMount/AnchorOffset, source1 SourcePosition,
#                                                  source2 TrackedPoint/RideOffset
#   Container/SourcePosition/VRCPositionConstraint: source0 DropPosition, source1 TrackingPoints
#   GrabPosition/VRCPositionConstraint:   source0 HeadMount/AnchorOffset, source1 Container
#   TrackingPoints/VRCPositionConstraint: source0 Output (own child), source1 self — the crawl
#                                         feedback loop, gain eased in at acquisition (box-tracker)
#   TrackingPoints/VRCParentConstraint:   source0 Container/TrackingOffset (the cage rides the sensed
#                                         point below the prop when not tracking — at release the cage
#                                         sits at head-contact level under the prop: the arbitration geometry)
clips:
  disabled:
    set:
      "Container/GameObject.m_IsActive": 0
      "GrabPosition/GrabBone/GameObject.m_IsActive": 0
      "Container/VRCPositionConstraint.m_Enabled": 1
      "Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Container/VRCPositionConstraint.Sources.source2.Weight": 0
      "Container/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Container/SourcePosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Container/SourcePosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "GrabPosition/VRCPositionConstraint.IsActive": 0
      "GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "TrackingPoints/VRCParentConstraint.m_Enabled": 1
      "TrackingPoints/VRCPositionConstraint.m_Enabled": 0
      "TrackingPoints/VRCScaleConstraint.GlobalWeight": 0
      "TrackingPoints/X+/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/X+/GameObject.m_IsActive": 0
      "TrackingPoints/X-/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/X-/GameObject.m_IsActive": 0
      "TrackingPoints/Y+/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/Y+/GameObject.m_IsActive": 0
      "TrackingPoints/Z+/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/Z+/GameObject.m_IsActive": 0
      "TrackingPoints/X+/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/X+/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/X+/Transform.m_LocalScale.z": 1
      "TrackingPoints/X-/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/X-/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/X-/Transform.m_LocalScale.z": 1
      "TrackingPoints/Y+/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/Y+/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/Y+/Transform.m_LocalScale.z": 1
      "TrackingPoints/Z+/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/Z+/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/Z+/Transform.m_LocalScale.z": 1
      "TrackingPoints/Output/Transform.m_LocalPosition.x": 0
      "TrackingPoints/Output/Transform.m_LocalPosition.y": 0
      "TrackingPoints/Output/Transform.m_LocalPosition.z": 0

  timer:        # disabled pose held for the remote boot dwell = this clip's length  [EMPIRICAL]
    seconds: 1.0
    set:
      "Container/GameObject.m_IsActive": 0
      "GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Container/VRCPositionConstraint.m_Enabled": 1
      "Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Container/VRCPositionConstraint.Sources.source2.Weight": 0
      "Container/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Container/SourcePosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Container/SourcePosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "GrabPosition/VRCPositionConstraint.IsActive": 0
      "GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "TrackingPoints/VRCParentConstraint.m_Enabled": 1
      "TrackingPoints/VRCPositionConstraint.m_Enabled": 0
      "TrackingPoints/VRCScaleConstraint.GlobalWeight": 0
      "TrackingPoints/X+/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/X+/GameObject.m_IsActive": 1
      "TrackingPoints/X-/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/X-/GameObject.m_IsActive": 1
      "TrackingPoints/Y+/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/Y+/GameObject.m_IsActive": 1
      "TrackingPoints/Z+/VRCContactReceiver.allowOthers": 1
      "TrackingPoints/Z+/GameObject.m_IsActive": 1
      "TrackingPoints/X+/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/X+/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/X+/Transform.m_LocalScale.z": 1
      "TrackingPoints/X-/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/X-/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/X-/Transform.m_LocalScale.z": 1
      "TrackingPoints/Y+/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/Y+/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/Y+/Transform.m_LocalScale.z": 1
      "TrackingPoints/Z+/Transform.m_LocalScale.x": 0.5
      "TrackingPoints/Z+/Transform.m_LocalScale.y": 0.5
      "TrackingPoints/Z+/Transform.m_LocalScale.z": 1
      "TrackingPoints/Output/Transform.m_LocalPosition.x": 0
      "TrackingPoints/Output/Transform.m_LocalPosition.y": 0
      "TrackingPoints/Output/Transform.m_LocalPosition.z": 0

  anchored:
    set:
      "Container/GameObject.m_IsActive": 1
      "GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Container/VRCPositionConstraint.m_Enabled": 1
      "Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Container/VRCPositionConstraint.Sources.source1.Weight": 0
