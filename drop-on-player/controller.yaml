      "TrackingPoints/X-/Transform.m_LocalScale.z": 1
      "TrackingPoints/Y+/Transform.m_LocalScale.z": 1
      "TrackingPoints/Z+/Transform.m_LocalScale.z": 1
    curves:
      # Acquisition column first (0.5), full tracking slabs after (1) — the latch samples the
      # coincident column (box-tracker's coincident-frame idiom). WD would snap these to 1 at t=0
      # if the clip didn't own the hold. All curves here play stretched by (1 + Σ readings) —
      # box-tracker's stretch rule — so every child of this state stays tiny (readouts at the
      # one-frame floor, this clip two frames) and the stretch is 1–5 real frames.
      "TrackingPoints/X+/Transform.m_LocalScale.x": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/X+/Transform.m_LocalScale.y": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/X-/Transform.m_LocalScale.x": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/X-/Transform.m_LocalScale.y": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/Y+/Transform.m_LocalScale.x": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/Y+/Transform.m_LocalScale.y": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/Z+/Transform.m_LocalScale.x": [ [0, 0.5], [0.016666668, 1] ]
      "TrackingPoints/Z+/Transform.m_LocalScale.y": [ [0, 0.5], [0.016666668, 1] ]
      # Gain guard: zero across the latch/mis-decode frames, 0.7 by clip end (box-tracker's crawl block).
      "TrackingPoints/VRCPositionConstraint.Sources.source0.Weight": [ [0, 0], [0.016666668, 0], [0.033333336, 0.7] ]

