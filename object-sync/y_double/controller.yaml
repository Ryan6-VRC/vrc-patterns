  - name: ObjectSync/Follow
    states:
      Release:
        motion: { clip: follow_target }
      Local:
        motion: { clip: follow_target }
      Follow:
        motion: { clip: follow_recon }
    any:
      - { to: Local, when: [ IsLocal is true ], canTransitionToSelf: false }   # the wearer's pose is authoritative from frame 1
      - { to: Follow, when: [ IsLocal is false, ObjectSync/Enable greater 0.5, ObjectSync/Ready greater 0.5 ], canTransitionToSelf: false }   # a complete word table has landed on THIS client, read through the published Floatify copy so the gate, a consumer's gate and the decode inputs all share one latency path
      - { to: Release, when: [ IsLocal is false, ObjectSync/Enable less 0.5 ], canTransitionToSelf: false }
    default: Release
    layout:
