        Local:   [270, 260]
        Follow:  [270, 100]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: ObjectSync/Slice
    states:
      Enter_PropA_0:
        motion: { clip: slice_gate_propa }
        behaviours:
          - driver:
              set:
                OS/Sense/Sh/CX: 0
                OS/Sense/Sh/FX: 0
                OS/Sense/Sh/CY: 0
                OS/Sense/Sh/FY: 0
                OS/Sense/Sh/CZ: 0
                OS/Sense/Sh/FZ: 0
                OS/Sense/Sh/RA/X: 0
                OS/Sense/Sh/RA/Z: 0
                OS/Slice/PropA: 0
                OS/Slice/PropB: 0
                OS/Slice/Live: 0
                OS/Slice/Done/PX: 0
                OS/Slice/Done/PY: 0
                OS/Slice/Done/PZ: 0
                OS/Slice/Done/Ry: 0
        transitions:
          - { to: Run_PropA_0, when: [ OS/Sense/Sh/CX greater 0.0125, OS/Sense/Sh/CY greater 0.0125, OS/Sense/Sh/CZ greater 0.0125, OS/Sense/Sh/RA/X greater 0.0125, OS/Sense/Sh/RA/Z greater 0.0125 ] }
          - { to: Enter_PropB_0, when: [], exitTime: 3.4167 }   # a rig that never wakes must not starve the other slices
      Run_PropA_0:
        motion: { clip: slice_gate_propa }
        behaviours:
          - driver:
              set:
                OS/Slice/PropA: 1
                OS/Slice/PropB: 0
                OS/Slice/Live: 1
        transitions:
          - { to: Enter_PropB_0, when: [ OS/Slice/Done/PX is true, OS/Slice/Done/PY is true, OS/Slice/Done/PZ is true, OS/Slice/Done/Ry is true ] }   # completion-gated: every walk this mode runs has committed
          - { to: Enter_PropB_0, when: [], exitTime: 3.4167 }   # dead-slice yield bound only (walks that cannot finish); the gate clip declares its length, so exitTime is seconds
      Enter_PropB_0:
        motion: { clip: slice_gate_propb }
        behaviours:
