layers:
  - name: ObjectSync/Ch/Sync
    states:
      Split:
        motion: ~
        transitions:
          - { to: Lost, when: [ IsLocal is false ] }
          - { to: Send0, when: [ IsLocal is true ] }
      # counter 1/8 = batch 1/8: PropA/PX/C, PropA/PX/F, PropA/PX/C0, PropA/PX/C1, PropA/PX/C2, PropA/PX/C3, PropA/PX/F0, PropA/PX/F1, PropA/PX/F2, PropA/PX/F3
      Send0:
        motion: ~
        behaviours:
          - driver:
              set:
                OS/Ch/Wire/Idx0: 0
                OS/Ch/Wire/Idx1: 0
                OS/Ch/Wire/Idx2: 0
                OS/Ch/Wire/Idx3: 1
              copy:
                OS/Ch/Wire/Num0: PropA/PX/C
                OS/Ch/Wire/Num1: PropA/PX/F
                OS/Ch/Wire/Bool0: PropA/PX/C0
                OS/Ch/Wire/Bool1: PropA/PX/C1
                OS/Ch/Wire/Bool2: PropA/PX/C2
                OS/Ch/Wire/Bool3: PropA/PX/C3
                OS/Ch/Wire/Bool4: PropA/PX/F0
                OS/Ch/Wire/Bool5: PropA/PX/F1
                OS/Ch/Wire/Bool6: PropA/PX/F2
                OS/Ch/Wire/Bool7: PropA/PX/F3
        transitions:
          - { to: Extra0, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra0:
        motion: ~
        transitions:
          - { to: Send1, when: [ OS/Ch/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 2/8 = batch 2/8: PropA/PY/C, PropA/PY/F, PropA/PY/C0, PropA/PY/C1, PropA/PY/C2, PropA/PY/C3, PropA/PY/F0, PropA/PY/F1, PropA/PY/F2, PropA/PY/F3
      Send1:
        motion: ~
        behaviours:
          - driver:
              set:
                OS/Ch/Wire/Idx0: 0
                OS/Ch/Wire/Idx1: 0
                OS/Ch/Wire/Idx2: 1
                OS/Ch/Wire/Idx3: 0
              copy:
                OS/Ch/Wire/Num0: PropA/PY/C
                OS/Ch/Wire/Num1: PropA/PY/F
                OS/Ch/Wire/Bool0: PropA/PY/C0
                OS/Ch/Wire/Bool1: PropA/PY/C1
                OS/Ch/Wire/Bool2: PropA/PY/C2
                OS/Ch/Wire/Bool3: PropA/PY/C3
                OS/Ch/Wire/Bool4: PropA/PY/F0
                OS/Ch/Wire/Bool5: PropA/PY/F1
                OS/Ch/Wire/Bool6: PropA/PY/F2
                OS/Ch/Wire/Bool7: PropA/PY/F3
        transitions:
          - { to: Extra1, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra1:
        motion: ~
        transitions:
          - { to: Send2, when: [ OS/Ch/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 3/8 = batch 3/8: PropA/PZ/C, PropA/PZ/F, PropA/PZ/C0, PropA/PZ/C1, PropA/PZ/C2, PropA/PZ/C3, PropA/PZ/F0, PropA/PZ/F1, PropA/PZ/F2, PropA/PZ/F3
      Send2:
        motion: ~
        behaviours:
          - driver:
              set:
                OS/Ch/Wire/Idx0: 0
                OS/Ch/Wire/Idx1: 0
                OS/Ch/Wire/Idx2: 1
                OS/Ch/Wire/Idx3: 1
              copy:
                OS/Ch/Wire/Num0: PropA/PZ/C
                OS/Ch/Wire/Num1: PropA/PZ/F
                OS/Ch/Wire/Bool0: PropA/PZ/C0
                OS/Ch/Wire/Bool1: PropA/PZ/C1
                OS/Ch/Wire/Bool2: PropA/PZ/C2
                OS/Ch/Wire/Bool3: PropA/PZ/C3
                OS/Ch/Wire/Bool4: PropA/PZ/F0
