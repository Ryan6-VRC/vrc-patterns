# GENERATED by generate.py — edit its CONFIG and rerun; never hand-edit this file.
# object-sync: absolute world position (+rotation) for droppable props, measured with
# contacts only and carried over word-channel. No physbones, no Rigidbody.
#
# Objects: PropA (rotation y), PropB (rotation y)
# Position: +/-4096 m about the rig anchor, 12 coarse bits (2 m cells) + 12 fine bits
#   over a 3.2 m redundant field (cell + 2 x 0.6 m coarse guard,
#   the guard covering the coarse stage's own 0.581 m worst-case world error),
#   fine LSB 0.7812 mm, 1.4 m of face left on each side of the field.
# Rotation: 12 bits per component, 1 m arms in a 2.5 m face (0.25 m guard),
#   component LSB 0.4883 mm.
# Wire: 28 synced bits carrying 192 payload bits in 8 batches, atomic=batch,
#   ~0.93s full refresh @60fps.
# Local measure cycle: 2 slices x 46 frames = ~1.53s ring @60fps — each slice deactivates every other
#   object's rig, clears the SHARED sense set, settles, unblocks the shared walks,
#   and hands off when they have COMMITTED (frame-true at any fps; a slice whose
#   walks cannot finish yields after 3.42s, sized at 12 fps).
#   Ring (weighted, interleaved): PropA, PropB.
# Rig park (deterministic from rigSeed 'object-sync/g3'): (73, 932, 233) m — the README's Rig section
#   is the spec the prefab is kept against. The park is the object node's transform
#   localPosition under the origin-pinned Rig; the World pin's source offset is ZERO,
#   because the client scales a source's offset by the avatar's per-client scale factor.
#
# Per axis the coarse and fine words share one group, so word-channel pins them into one
# batch: an adjacent-cell coarse always arrives with its matched fine, and cell-boundary
# flicker reconstructs the same position with no hysteresis anywhere.
#
# Collision tags the prefab must carry, one set per object (measured: two objects sharing
# a tag set leaves NEITHER converging, since every receiver reads the strongest sender in
# range rather than its own):
#   PropA: ObjectSyncPropACoarse, ObjectSyncPropAFine, ObjectSyncPropARotA
#   PropB: ObjectSyncPropBCoarse, ObjectSyncPropBFine, ObjectSyncPropBRotA

