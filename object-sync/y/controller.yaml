layers:
  - name: ObjectSync/Ch/Sync
    states:
      Split:
        motion: ~
        transitions:
          - { to: Lost, when: [ IsLocal is false ] }
          - { to: Send0, when: [ IsLocal is true ] }
      # counter 1/4 = batch 1/4: Prop/PX/C, Prop/PX/F, Prop/PX/C0, Prop/PX/C1, Prop/PX/C2, Prop/PX/C3, Prop/PX/F0, Prop/PX/F1, Prop/PX/F2, Prop/PX/F3
      Send0:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/Ch/Wire/Idx0: 0
                ObjectSync/Ch/Wire/Idx1: 0
                ObjectSync/Ch/Wire/Idx2: 1
              copy:
                ObjectSync/Ch/Wire/Num0: Prop/PX/C
                ObjectSync/Ch/Wire/Num1: Prop/PX/F
                ObjectSync/Ch/Wire/Bool0: Prop/PX/C0
                ObjectSync/Ch/Wire/Bool1: Prop/PX/C1
                ObjectSync/Ch/Wire/Bool2: Prop/PX/C2
                ObjectSync/Ch/Wire/Bool3: Prop/PX/C3
                ObjectSync/Ch/Wire/Bool4: Prop/PX/F0
                ObjectSync/Ch/Wire/Bool5: Prop/PX/F1
                ObjectSync/Ch/Wire/Bool6: Prop/PX/F2
                ObjectSync/Ch/Wire/Bool7: Prop/PX/F3
        transitions:
          - { to: Extra0, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra0:
        motion: ~
        transitions:
          - { to: Send1, when: [ ObjectSync/Ch/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 2/4 = batch 2/4: Prop/PY/C, Prop/PY/F, Prop/PY/C0, Prop/PY/C1, Prop/PY/C2, Prop/PY/C3, Prop/PY/F0, Prop/PY/F1, Prop/PY/F2, Prop/PY/F3
      Send1:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/Ch/Wire/Idx0: 0
                ObjectSync/Ch/Wire/Idx1: 1
                ObjectSync/Ch/Wire/Idx2: 0
              copy:
                ObjectSync/Ch/Wire/Num0: Prop/PY/C
                ObjectSync/Ch/Wire/Num1: Prop/PY/F
                ObjectSync/Ch/Wire/Bool0: Prop/PY/C0
                ObjectSync/Ch/Wire/Bool1: Prop/PY/C1
                ObjectSync/Ch/Wire/Bool2: Prop/PY/C2
                ObjectSync/Ch/Wire/Bool3: Prop/PY/C3
                ObjectSync/Ch/Wire/Bool4: Prop/PY/F0
                ObjectSync/Ch/Wire/Bool5: Prop/PY/F1
                ObjectSync/Ch/Wire/Bool6: Prop/PY/F2
                ObjectSync/Ch/Wire/Bool7: Prop/PY/F3
        transitions:
          - { to: Extra1, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra1:
        motion: ~
        transitions:
          - { to: Send2, when: [ ObjectSync/Ch/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 3/4 = batch 3/4: Prop/PZ/C, Prop/PZ/F, Prop/PZ/C0, Prop/PZ/C1, Prop/PZ/C2, Prop/PZ/C3, Prop/PZ/F0, Prop/PZ/F1, Prop/PZ/F2, Prop/PZ/F3
      Send2:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/Ch/Wire/Idx0: 0
                ObjectSync/Ch/Wire/Idx1: 1
                ObjectSync/Ch/Wire/Idx2: 1
              copy:
                ObjectSync/Ch/Wire/Num0: Prop/PZ/C
                ObjectSync/Ch/Wire/Num1: Prop/PZ/F
                ObjectSync/Ch/Wire/Bool0: Prop/PZ/C0
                ObjectSync/Ch/Wire/Bool1: Prop/PZ/C1
                ObjectSync/Ch/Wire/Bool2: Prop/PZ/C2
                ObjectSync/Ch/Wire/Bool3: Prop/PZ/C3
                ObjectSync/Ch/Wire/Bool4: Prop/PZ/F0
                ObjectSync/Ch/Wire/Bool5: Prop/PZ/F1
                ObjectSync/Ch/Wire/Bool6: Prop/PZ/F2
                ObjectSync/Ch/Wire/Bool7: Prop/PZ/F3
        transitions:
          - { to: Extra2, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra2:
        motion: ~
        transitions:
          - { to: Send3, when: [ ObjectSync/Ch/True is true ] }   # conditional hop = the guaranteed +1 frame
      # counter 4/4 = batch 4/4: Prop/RA/X, Prop/RA/Z, Prop/RA/X/B0, Prop/RA/X/B1, Prop/RA/X/B2, Prop/RA/X/B3, Prop/RA/Z/B0, Prop/RA/Z/B1, Prop/RA/Z/B2, Prop/RA/Z/B3
      Send3:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/Ch/Wire/Idx0: 1
                ObjectSync/Ch/Wire/Idx1: 0
                ObjectSync/Ch/Wire/Idx2: 0
              copy:
                ObjectSync/Ch/Wire/Num0: Prop/RA/X
                ObjectSync/Ch/Wire/Num1: Prop/RA/Z
                ObjectSync/Ch/Wire/Bool0: Prop/RA/X/B0
                ObjectSync/Ch/Wire/Bool1: Prop/RA/X/B1
                ObjectSync/Ch/Wire/Bool2: Prop/RA/X/B2
                ObjectSync/Ch/Wire/Bool3: Prop/RA/X/B3
                ObjectSync/Ch/Wire/Bool4: Prop/RA/Z/B0
                ObjectSync/Ch/Wire/Bool5: Prop/RA/Z/B1
                ObjectSync/Ch/Wire/Bool6: Prop/RA/Z/B2
                ObjectSync/Ch/Wire/Bool7: Prop/RA/Z/B3
        transitions:
          - { to: Extra3, when: [], exitTime: 0.1 }   # empty state: exitTime is literal seconds
      Extra3:
        motion: ~
        transitions:
          - { to: Send0, when: [ ObjectSync/Ch/True is true ] }   # conditional hop = the guaranteed +1 frame
      Lost:
        motion: ~
        behaviours:
          # Copy, never clear: cold this writes 0 and the next certification needs a
          # contiguous head->tail walk; already certified it writes 1 back, so a dropped
          # counter value cannot knock a real table's flag down. Only the Reset layer
          # zeroes the pair (docstring).
          - driver:
              copy:
                ObjectSync/Ch/SawHead: ObjectSync/Ch/Acquired
        transitions:
          - { to: Recv0, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is false, ObjectSync/Ch/Wire/Idx2 is true ] }   # re-lock at any exact counter value (batch applies need no coherent loop)
          - { to: Recv1, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is true, ObjectSync/Ch/Wire/Idx2 is false ] }
          - { to: Recv2, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is true, ObjectSync/Ch/Wire/Idx2 is true ] }
          - { to: Recv3, when: [ ObjectSync/Ch/Wire/Idx0 is true, ObjectSync/Ch/Wire/Idx1 is false, ObjectSync/Ch/Wire/Idx2 is false ] }
      Recv0:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/Ch/SawHead: 1   # head of a batch walk
              copy:
                Prop/PX/C: ObjectSync/Ch/Wire/Num0
                Prop/PX/F: ObjectSync/Ch/Wire/Num1
                Prop/PX/C0: ObjectSync/Ch/Wire/Bool0
                Prop/PX/C1: ObjectSync/Ch/Wire/Bool1
                Prop/PX/C2: ObjectSync/Ch/Wire/Bool2
                Prop/PX/C3: ObjectSync/Ch/Wire/Bool3
                Prop/PX/F0: ObjectSync/Ch/Wire/Bool4
                Prop/PX/F1: ObjectSync/Ch/Wire/Bool5
                Prop/PX/F2: ObjectSync/Ch/Wire/Bool6
                Prop/PX/F3: ObjectSync/Ch/Wire/Bool7
        transitions:
          - { to: Recv1, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is true, ObjectSync/Ch/Wire/Idx2 is false ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is true ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx1 is false, ObjectSync/Ch/Wire/Idx2 is false ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx1 is true, ObjectSync/Ch/Wire/Idx2 is true ] }
      Recv1:
        motion: ~
        behaviours:
          - driver:
              copy:
                Prop/PY/C: ObjectSync/Ch/Wire/Num0
                Prop/PY/F: ObjectSync/Ch/Wire/Num1
                Prop/PY/C0: ObjectSync/Ch/Wire/Bool0
                Prop/PY/C1: ObjectSync/Ch/Wire/Bool1
                Prop/PY/C2: ObjectSync/Ch/Wire/Bool2
                Prop/PY/C3: ObjectSync/Ch/Wire/Bool3
                Prop/PY/F0: ObjectSync/Ch/Wire/Bool4
                Prop/PY/F1: ObjectSync/Ch/Wire/Bool5
                Prop/PY/F2: ObjectSync/Ch/Wire/Bool6
                Prop/PY/F3: ObjectSync/Ch/Wire/Bool7
        transitions:
          - { to: Recv2, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is true, ObjectSync/Ch/Wire/Idx2 is true ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is true ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx1 is false ] }
      Recv2:
        motion: ~
        behaviours:
          - driver:
              copy:
                Prop/PZ/C: ObjectSync/Ch/Wire/Num0
                Prop/PZ/F: ObjectSync/Ch/Wire/Num1
                Prop/PZ/C0: ObjectSync/Ch/Wire/Bool0
                Prop/PZ/C1: ObjectSync/Ch/Wire/Bool1
                Prop/PZ/C2: ObjectSync/Ch/Wire/Bool2
                Prop/PZ/C3: ObjectSync/Ch/Wire/Bool3
                Prop/PZ/F0: ObjectSync/Ch/Wire/Bool4
                Prop/PZ/F1: ObjectSync/Ch/Wire/Bool5
                Prop/PZ/F2: ObjectSync/Ch/Wire/Bool6
                Prop/PZ/F3: ObjectSync/Ch/Wire/Bool7
        transitions:
          - { to: Recv3, when: [ ObjectSync/Ch/Wire/Idx0 is true, ObjectSync/Ch/Wire/Idx1 is false, ObjectSync/Ch/Wire/Idx2 is false ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is false ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx2 is false ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is true, ObjectSync/Ch/Wire/Idx1 is true ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is true, ObjectSync/Ch/Wire/Idx2 is true ] }
