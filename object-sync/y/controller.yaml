      any:   [50, 40]
      exit:  [50, 80]
  - name: ObjectSync/Ch/Reset
    # The pause reset. A distance-hide fires IsAnimatorEnabled false one frame before the
    # animator stops, which is the frame this driver lands on; a manual hide/show rebuilds
    # the animator instead, restarting Sync at Split -> Lost with both params at their
    # defaults, so it is covered without a signal. View cull does neither and is the
    # consumer's to close by composing anti-cull. Partial coverage, declared (see the
    # coverage table in docs/runtime.md).
    states:
      Enabled:
        motion: ~
        transitions:
          - { to: Disabling, when: [ IsAnimatorEnabled is false ] }
      Disabling:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/Ch/Acquired: 0
                ObjectSync/Ch/SawHead: 0
        transitions:
          - { to: Enabled, when: [ IsAnimatorEnabled is true ] }
    default: Enabled
    layout:
      nodes:
        Enabled:   [30, 180]
        Disabling: [270, 180]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
