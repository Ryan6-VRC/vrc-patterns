                Prop/RA/X/B2: ObjectSync/Ch/Wire/Bool2
                Prop/RA/X/B3: ObjectSync/Ch/Wire/Bool3
                Prop/RA/Z/B0: ObjectSync/Ch/Wire/Bool4
                Prop/RA/Z/B1: ObjectSync/Ch/Wire/Bool5
                Prop/RA/Z/B2: ObjectSync/Ch/Wire/Bool6
                Prop/RA/Z/B3: ObjectSync/Ch/Wire/Bool7
          - driver:
              add: { ObjectSync/Ch/Cycle: 1 }
              copy:
                ObjectSync/Ch/Acquired: ObjectSync/Ch/SawHead   # tail of a walk that began at a head
        transitions:
          - { to: Recv0, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx1 is false, ObjectSync/Ch/Wire/Idx2 is true ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx1 is true ] }
          - { to: Lost, when: [ ObjectSync/Ch/Wire/Idx0 is false, ObjectSync/Ch/Wire/Idx2 is false ] }
