#   over a 4.4 m redundant field (cell + 2 x 1.2 m coarse guard,
#   the guard covering the coarse stage's own 1.162 m worst-case world error),
#   fine LSB 1.0742 mm, 0.8 m of face left on each side of the field.
# Rotation: 12 bits per component, 1 m arms in a 2.5 m face (0.25 m guard),
#   component LSB 0.4883 mm.
# Wire: 28 synced bits carrying 147 payload bits in 6 batches, atomic=batch,
#   ~0.70s full refresh @60fps.
# Local measure cycle: 34 frames (~0.57s); an unpark costs 4 more, waiting out contact re-acquisition
#   before the first sample, so the wire holds its last committed pose rather than
#   publishing a cleared one.
# Rig park (deterministic from rigSeed 'object-sync/g3'): (73, 932, 233) m — the README's Rig section
#   is the spec the prefab is kept against.
#
# Per axis the coarse and fine words share one group, so word-channel pins them into one
# batch: an adjacent-cell coarse always arrives with its matched fine, and cell-boundary
# flicker reconstructs the same position with no hysteresis anywhere.
#
# Collision tags the prefab must carry, one set per object (measured: two objects sharing
# a tag set leaves NEITHER converging, since every receiver reads the strongest sender in
# range rather than its own):
