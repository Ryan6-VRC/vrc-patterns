# LeashStake_Fx — GENERATED by leash-stake/generate.py; edit its CONFIG and rerun, never hand-edit this file.
# The leash's machine and the wearer's announce. generate.py's docstring is the state-by-state record; rig.json the prefab's numbers.
# Published, bare (globalParams): Leash/*, ObjectSync/*. Leash/Held is 1 in Held and PHeld, Leash/Planted in Plant,
# Planted and SyncPlanted, both latching. Leash/Enable is the one synced menu intent; LeashStake/Announce the synced announce.
# Fade 10 frames, plant cycle 0.05 s, announce 2.0 s. Strand rest length 1.065 m.

schema: 1
controller: LeashStake_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  Leash/Enable: { type: bool, default: true, vrc: { synced: true, saved: true } }
  Leash/Right: { type: float, vrc: { synced: false, saved: false, osc: true } }   # face-proximity box, sensing
  Leash/Forward: { type: float, vrc: { synced: false, saved: false, osc: true } }   # face-proximity box, sensing
  Leash/Up: { type: float, vrc: { synced: false, saved: false, osc: true } }   # face-proximity box, sensing
  Leash/Held: { type: bool, vrc: { synced: false, saved: false, osc: true } }   # latching, driven here
  Leash/Planted: { type: bool, vrc: { synced: false, saved: false, osc: true } }   # latching, driven here
  Leash/Slack: { type: float, default: 0.285714, vrc: { synced: false, saved: true, osc: true } }   # held slack, 0..1 over the bridge's 0.5-4.0 m
  Leash/SlackPlanted: { type: float, default: 0.571429, vrc: { synced: false, saved: true, osc: true } }   # planted slack, the same range
  Leash/SelfGrab: { type: bool, default: true, vrc: { synced: false, saved: true } }   # the wearer may grab their own handle
  Leash/Unplant: { type: bool, vrc: { synced: false, saved: false } }   # the wearer's button
  Leash/Handle_IsGrabbed: { type: bool, vrc: { synced: false, saved: false } }   # the handle physbone
  Leash/Handle_IsPosed: { type: bool, vrc: { synced: false, saved: false } }   # the handle physbone
  LeashStake/Announce: { type: bool, default: false, vrc: { synced: true, saved: false } }   # the stake is on the wire
  ObjectSync/Enable: { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready: { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal: bool   # VRC built-in

layers:
  - name: Leash
    states:
      # The default: its clear is repeated by whichever state it hands to, one evaluation later.
      Load:
        motion: { clip: disabled }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Free, when: [ Leash/Enable is true ] }
          - { to: Disabled, when: [ Leash/Enable is false ] }
      # The handle is off, so its stale grab flags stay cleared.
      Disabled:
        motion: { clip: disabled }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0, Leash/Handle_IsGrabbed: 0, Leash/Handle_IsPosed: 0 } } } ]
        transitions:
          - { to: Free, when: [ Leash/Enable is true ] }
      Free:
        motion: { clip: free }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Held, when: [ Leash/Handle_IsGrabbed is true ], duration: 0.166667 }
          - { to: SyncPlanted, when: [ IsLocal is false, LeashStake/Announce is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ], duration: 0.166667 }
      # _IsPosed is a level read when _IsGrabbed falls: posed plants, plain goes home.
      Held:
        motion: { clip: held }
        behaviours: [ { driver: { set: { Leash/Held: 1, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Plant, when: [ Leash/Handle_IsGrabbed is false, Leash/Handle_IsPosed is true ] }
          - { to: Free, when: [ Leash/Handle_IsGrabbed is false, Leash/Handle_IsPosed is false ], duration: 0.166667 }
      # Freeze the stake, Holder onto it, the handle off for the cycle so it rests there unposed.
      Plant:
        motion: { clip: plant }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: Planted, when: [], exitTime: 1.0 }
      # Unplant is the wearer's; the exit-time rung is a remote whose flag never rose.
      Planted:
        motion: { clip: planted }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: PHeld, when: [ Leash/Handle_IsGrabbed is true ] }
          - { to: SyncPlanted, when: [ IsLocal is false, LeashStake/Announce is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
          - { to: Free, when: [ Leash/Unplant is true ], duration: 0.166667 }
          - { to: Free, when: [ IsLocal is false, LeashStake/Announce is false ], exitTime: 180.0, duration: 0.166667 }
      # A pick-up: Holder frozen where the stake stood, so no root moves under the live grab.
      PHeld:
        motion: { clip: pheld }
        behaviours: [ { driver: { set: { Leash/Held: 1, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Plant, when: [ Leash/Handle_IsGrabbed is false, Leash/Handle_IsPosed is true ] }
          - { to: Free, when: [ Leash/Handle_IsGrabbed is false, Leash/Handle_IsPosed is false ], duration: 0.166667 }
      # A remote: Stake on object-sync's reconstruction until the flag falls.
      SyncPlanted:
        motion: { clip: sync_planted }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: PHeld, when: [ Leash/Handle_IsGrabbed is true ] }
          - { to: Free, when: [ LeashStake/Announce is false ], duration: 0.166667 }
    default: Load
    layout:
      nodes: { Load: [30, 180], Disabled: [-210, 260], Free: [30, 260], Held: [30, 340], Plant: [30, 420], Planted: [30, 500], PHeld: [270, 420], SyncPlanted: [270, 580] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # Whether the wearer's own hand may grab or pose the handle; the filters are read at each grab.
  - name: SelfGrab
    states:
      Anyone:
        motion: { clip: self_on }
        transitions:
          - { to: OthersOnly, when: [ Leash/SelfGrab is false ] }
      OthersOnly:
        motion: { clip: self_off }
        transitions:
          - { to: Anyone, when: [ Leash/SelfGrab is true ] }
    default: Anyone
    layout:
      nodes: { Anyone: [30, 180], OthersOnly: [270, 180] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # Wearer-only: the synced flag follows Leash/Planted, rising 2.0 s late and falling at once.
  - name: Announce
    states:
      Idle:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { LeashStake/Announce: 0 } } } ]
        transitions:
          - { to: Arming, when: [ IsLocal is true, Leash/Planted is true ] }
      Arming:
        motion: ~
        transitions:
          - { to: Idle, when: [ Leash/Planted is false ] }
          - { to: Raised, when: [], exitTime: 2.0 }
      Raised:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { LeashStake/Announce: 1 } } } ]
        transitions:
          - { to: Idle, when: [ Leash/Planted is false ] }
    default: Idle
    layout:
      nodes: { Idle: [30, 180], Arming: [270, 180], Raised: [270, 260] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

