# ControlPanelControls_Fx — GENERATED by control-panel/controls/generate.py; edit its CONFIG and rerun, never hand-edit this file.
# The controls subtree's machine: button and selector stamps, the slider readouts and knob memories, the lamps.
# The generator's docstring is the design record.
# Published (synced, unsaved, wearer-stamped, float in the animator): ControlPanel/Btn1, ControlPanel/Btn2, ControlPanel/Btn3, ControlPanel/Btn4 (bool), ControlPanel/Select (int, 0-based),
# ControlPanel/Slot (int), ControlPanel/Level (float 0..1).
# Cap press accepted at receiver reading 0.288462, held until every reading is under 0.115385 (depth 0.75 / 0.3
# of travel over a box 0.026 m deep). Arm 0 s, cooldown 0.25 s.
# Slot: the box's +Z face points to -X, so the reading falls as the knob rises: r_hi 0.9375 at x -0.1,
# r_lo 0.104167 at x 0.1, floor 0.0625.
# Level: the box's +Z face points to -X, so the reading falls as the knob rises: r_hi 0.9375 at x -0.1,
# r_lo 0.104167 at x 0.1, floor 0.0625.

schema: 1
controller: ControlPanelControls_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  ControlPanel/Btn1: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Btn2: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Btn3: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Btn4: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Select: { type: float, default: 0, vrc: { type: int, synced: true, saved: false } }
  ControlPanel/Slot: { type: float, default: 0, vrc: { type: int, synced: true, saved: false } }
  ControlPanel/Level: { type: float, default: 0, vrc: { type: float, synced: true, saved: false } }
  CP/Press1: float   # sensing: a local-only cap receiver's press depth reading
  CP/Press2: float   # sensing: a local-only cap receiver's press depth reading
  CP/Press3: float   # sensing: a local-only cap receiver's press depth reading
  CP/Press4: float   # sensing: a local-only cap receiver's press depth reading
  CP/SelPress1: float   # sensing: a local-only cap receiver's press depth reading
  CP/SelPress2: float   # sensing: a local-only cap receiver's press depth reading
  CP/SelPress3: float   # sensing: a local-only cap receiver's press depth reading
  CP/SelPress4: float   # sensing: a local-only cap receiver's press depth reading
  CP/Slot_Read: float   # sensing: the non-local slider box's reading of the tip's track position
  CP/Level_Read: float   # sensing: the non-local slider box's reading of the tip's track position
  CP/One: { type: float, default: 1, scratch: true }   # the Direct tree's constant weight
  CP/SelKeep: { type: float, default: 0.8, scratch: true }   # [EMPIRICAL] the selector glide's per-frame keep; frame-rate dependent
  CP/Sel1_Pos: { type: float, default: 1, aap: true }   # segment 1's glide position, 0..1; Select's default 0 rests on cap 1
  CP/Sel2_Pos: { type: float, default: 0, aap: true }   # segment 2's glide position, 0..1
  CP/Sel3_Pos: { type: float, default: 0, aap: true }   # segment 3's glide position, 0..1
  CP/Sel4_Pos: { type: float, default: 0, aap: true }   # segment 4's glide position, 0..1
  CP/Live: { type: float, default: 0, aap: true }   # the frame's gate, written by the glue; matches its declaration
  CP/Settling: { type: float, default: 0, aap: true }   # the Sliders layer's one output: 1 while held or settling
  CP/Slot_Knob: { type: float, default: 0, aap: true }   # the knob memory, track fraction 0..1
  CP/Level_Knob: { type: float, default: 0, aap: true }   # the knob memory, track fraction 0..1
  IsLocal: bool   # VRC built-in

layers:
  - name: Buttons
    states:
      # Remotes never leave Idle: the receivers are local-only, so their readings stay 0 there.
      Idle:
        motion: ~
        transitions:
          - { to: Set1, when: [ CP/Live greater 0.5, CP/Press1 greater 0.288462, ControlPanel/Btn1 less 0.5 ] }
          - { to: Clear1, when: [ CP/Live greater 0.5, CP/Press1 greater 0.288462, ControlPanel/Btn1 greater 0.5 ] }
          - { to: Set2, when: [ CP/Live greater 0.5, CP/Press2 greater 0.288462, ControlPanel/Btn2 less 0.5 ] }
          - { to: Clear2, when: [ CP/Live greater 0.5, CP/Press2 greater 0.288462, ControlPanel/Btn2 greater 0.5 ] }
          - { to: Set3, when: [ CP/Live greater 0.5, CP/Press3 greater 0.288462, ControlPanel/Btn3 less 0.5 ] }
          - { to: Clear3, when: [ CP/Live greater 0.5, CP/Press3 greater 0.288462, ControlPanel/Btn3 greater 0.5 ] }
          - { to: Set4, when: [ CP/Live greater 0.5, CP/Press4 greater 0.288462, ControlPanel/Btn4 less 0.5 ] }
          - { to: Clear4, when: [ CP/Live greater 0.5, CP/Press4 greater 0.288462, ControlPanel/Btn4 greater 0.5 ] }
          - { to: StampSel1, when: [ CP/Live greater 0.5, CP/SelPress1 greater 0.288462 ] }
          - { to: StampSel2, when: [ CP/Live greater 0.5, CP/SelPress2 greater 0.288462 ] }
          - { to: StampSel3, when: [ CP/Live greater 0.5, CP/SelPress3 greater 0.288462 ] }
          - { to: StampSel4, when: [ CP/Live greater 0.5, CP/SelPress4 greater 0.288462 ] }
      Set1:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn1: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear1:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn1: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Set2:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn2: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear2:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn2: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Set3:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn3: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear3:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn3: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Set4:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn4: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear4:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn4: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      # Cap k stamps ControlPanel/Select = k - 1; a press on the chosen cap re-stamps the same value.
      StampSel1:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Select: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      StampSel2:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Select: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      StampSel3:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Select: 2 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      StampSel4:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Select: 3 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Hold:
        motion: ~
        transitions:
          - { to: Cooldown, when: [ CP/Press1 less 0.115385, CP/Press2 less 0.115385, CP/Press3 less 0.115385, CP/Press4 less 0.115385, CP/SelPress1 less 0.115385, CP/SelPress2 less 0.115385, CP/SelPress3 less 0.115385, CP/SelPress4 less 0.115385 ] }
      # The floor between two toggles: no press rung leaves here.
      Cooldown:
        motion: { clip: cooldown }
        transitions:
          - { to: Idle, when: [], exitTime: 1.0 }
    default: Idle
    layout:
      nodes: { Idle: [30, 180], Set1: [-690, 340], Set2: [-450, 340], Set3: [-210, 340], Set4: [30, 340], Clear1: [-690, 420], Clear2: [-450, 420], Clear3: [-210, 420], Clear4: [30, 420], StampSel1: [270, 380], StampSel2: [510, 380], StampSel3: [750, 380], StampSel4: [990, 380], Hold: [30, 520], Cooldown: [30, 600] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # Writes only CP/Settling, through single-clip states: Idle 0, every other state 1. Remotes run the held and
  # settle branches too (the slider receivers are non-local); only the wearer stamps.
  - name: Sliders
    states:
      Idle:
        motion: { clip: settling_off }
        transitions:
          - { to: Held_Slot, when: [ CP/Live greater 0.5, CP/Slot_Read greater 0.0625 ] }
          - { to: Held_LevelA, when: [ CP/Live greater 0.5, CP/Level_Read greater 0.0625 ] }
      # Boundary b/N between slot b-1 and slot b, crossed by the hysteresis; the reading falls as the slot
      # rises. Up rungs highest b first, down rungs lowest b first, so a jump lands on the slot the reading
      # is in; the Settle rungs above catch a released 0 first.
      Held_Slot:
        motion: { clip: settling_on }
        transitions:
          - { to: Settle, when: [ CP/Live less 0.5 ] }
          - { to: Settle, when: [ CP/Slot_Read less 0.0625 ] }
          - { to: Stamp_Slot_4, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read less 0.254167, ControlPanel/Slot less 3.5 ] }
          - { to: Stamp_Slot_3, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read less 0.420833, ControlPanel/Slot less 2.5 ] }
          - { to: Stamp_Slot_2, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read less 0.5875, ControlPanel/Slot less 1.5 ] }
          - { to: Stamp_Slot_1, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read less 0.754167, ControlPanel/Slot less 0.5 ] }
          - { to: Stamp_Slot_0, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read greater 0.7875, ControlPanel/Slot greater 0.5 ] }
          - { to: Stamp_Slot_1, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read greater 0.620833, ControlPanel/Slot greater 1.5 ] }
          - { to: Stamp_Slot_2, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read greater 0.454167, ControlPanel/Slot greater 2.5 ] }
          - { to: Stamp_Slot_3, when: [ IsLocal is true, CP/Live greater 0.5, CP/Slot_Read greater 0.2875, ControlPanel/Slot greater 3.5 ] }
      Stamp_Slot_0:
        motion: { clip: settling_tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 0 } } } ]
        transitions:
          - { to: Held_Slot, when: [], exitTime: 1.0 }
      Stamp_Slot_1:
        motion: { clip: settling_tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 1 } } } ]
        transitions:
          - { to: Held_Slot, when: [], exitTime: 1.0 }
      Stamp_Slot_2:
        motion: { clip: settling_tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 2 } } } ]
        transitions:
          - { to: Held_Slot, when: [], exitTime: 1.0 }
      Stamp_Slot_3:
        motion: { clip: settling_tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 3 } } } ]
        transitions:
          - { to: Held_Slot, when: [], exitTime: 1.0 }
      Stamp_Slot_4:
        motion: { clip: settling_tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 4 } } } ]
        transitions:
          - { to: Held_Slot, when: [], exitTime: 1.0 }
      # The wearer alternates A <-> B every frame so each entry re-copies the reading; remotes stay in A.
      Held_LevelA:
        motion: { clip: settling_on }
        behaviours: [ { driver: { localOnly: true, copy: { ControlPanel/Level: { source: CP/Level_Read, sourceMin: 0.104167, sourceMax: 0.9375, destMin: 1, destMax: 0 } } } } ]
        transitions:
          - { to: Settle, when: [ CP/Live less 0.5 ] }
          - { to: Settle, when: [ CP/Level_Read less 0.0625 ] }
          - { to: Held_LevelB, when: [ IsLocal is true, CP/One greater 0.5 ] }
      Held_LevelB:
        motion: { clip: settling_on }
        behaviours: [ { driver: { localOnly: true, copy: { ControlPanel/Level: { source: CP/Level_Read, sourceMin: 0.104167, sourceMax: 0.9375, destMin: 1, destMax: 0 } } } } ]
        transitions:
          - { to: Settle, when: [ CP/Live less 0.5 ] }
          - { to: Settle, when: [ CP/Level_Read less 0.0625 ] }
          - { to: Held_LevelA, when: [ IsLocal is true, CP/One greater 0.5 ] }
      # The knob holds where the hand let go for the dwell, while the wearer's last stamp crosses the wire.
      Settle:
        motion: { clip: settle }
        transitions:
          - { to: Held_Slot, when: [ CP/Live greater 0.5, CP/Slot_Read greater 0.0625 ] }
          - { to: Held_LevelA, when: [ CP/Live greater 0.5, CP/Level_Read greater 0.0625 ] }
          - { to: Idle, when: [], exitTime: 1.0 }
    default: Idle
    layout:
      nodes: { Idle: [30, 180], Settle: [30, 420], Held_Slot: [-210, 300], Stamp_Slot_0: [-1410, 420], Stamp_Slot_1: [-1170, 420], Stamp_Slot_2: [-930, 420], Stamp_Slot_3: [-690, 420], Stamp_Slot_4: [-450, 420], Held_LevelA: [270, 300], Held_LevelB: [270, 420] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # Every binding is written by exactly one weight-1 child, so the Direct sum is exact.
  - name: Lamps
    states:
      Lamps:
        motion:
          tree: direct
          name: Lamps
          children:
            - tree: 1d
              name: Btn1
              param: ControlPanel/Btn1
              directWeight: CP/One
              children:
                - { clip: btn1_off, threshold: 0 }
                - { clip: btn1_on, threshold: 1 }
            - tree: 1d
              name: Btn2
              param: ControlPanel/Btn2
              directWeight: CP/One
              children:
                - { clip: btn2_off, threshold: 0 }
                - { clip: btn2_on, threshold: 1 }
            - tree: 1d
              name: Btn3
              param: ControlPanel/Btn3
              directWeight: CP/One
              children:
                - { clip: btn3_off, threshold: 0 }
                - { clip: btn3_on, threshold: 1 }
            - tree: 1d
              name: Btn4
              param: ControlPanel/Btn4
              directWeight: CP/One
              children:
                - { clip: btn4_off, threshold: 0 }
                - { clip: btn4_on, threshold: 1 }
            - tree: 1d
              name: Select_Glide
              param: CP/SelKeep
              directWeight: CP/One
              children:
                - tree: 1d
                  name: Select_Target
                  param: ControlPanel/Select
                  threshold: 0
                  children:
                    - { clip: sel_target1, threshold: 0 }
                    - { clip: sel_target2, threshold: 1 }
                    - { clip: sel_target3, threshold: 2 }
                    - { clip: sel_target4, threshold: 3 }
                - tree: direct
                  name: Select_Self
                  threshold: 1
                  children:
                    - tree: 1d
                      name: Sel1_Keep
                      param: CP/Sel1_Pos
                      directWeight: CP/One
                      children:
                        - { clip: sel1_pos0, threshold: 0 }
                        - { clip: sel1_pos1, threshold: 1 }
                    - tree: 1d
                      name: Sel2_Keep
                      param: CP/Sel2_Pos
                      directWeight: CP/One
                      children:
                        - { clip: sel2_pos0, threshold: 0 }
                        - { clip: sel2_pos1, threshold: 1 }
                    - tree: 1d
                      name: Sel3_Keep
                      param: CP/Sel3_Pos
                      directWeight: CP/One
                      children:
                        - { clip: sel3_pos0, threshold: 0 }
                        - { clip: sel3_pos1, threshold: 1 }
                    - tree: 1d
                      name: Sel4_Keep
                      param: CP/Sel4_Pos
                      directWeight: CP/One
                      children:
                        - { clip: sel4_pos0, threshold: 0 }
                        - { clip: sel4_pos1, threshold: 1 }
            - tree: 1d
              name: Sel1_Lamp
              param: CP/Sel1_Pos
              directWeight: CP/One
              children:
                - { clip: lamp_sel1_off, threshold: 0 }
                - { clip: lamp_sel1_on, threshold: 1 }
            - tree: 1d
              name: Sel2_Lamp
              param: CP/Sel2_Pos
              directWeight: CP/One
              children:
                - { clip: lamp_sel2_off, threshold: 0 }
                - { clip: lamp_sel2_on, threshold: 1 }
            - tree: 1d
              name: Sel3_Lamp
              param: CP/Sel3_Pos
              directWeight: CP/One
              children:
                - { clip: lamp_sel3_off, threshold: 0 }
                - { clip: lamp_sel3_on, threshold: 1 }
            - tree: 1d
              name: Sel4_Lamp
              param: CP/Sel4_Pos
              directWeight: CP/One
              children:
                - { clip: lamp_sel4_off, threshold: 0 }
                - { clip: lamp_sel4_on, threshold: 1 }
            - tree: 1d
              name: Slot_Lamps
              param: ControlPanel/Slot
              directWeight: CP/One
              children:
                - { clip: slot_seg0, threshold: 0 }
                - { clip: slot_seg1, threshold: 1 }
                - { clip: slot_seg2, threshold: 2 }
                - { clip: slot_seg3, threshold: 3 }
                - { clip: slot_seg4, threshold: 4 }
            # Slot's knob memory: the razor on the reading; below it the settle hold, then the synced value.
            - tree: 1d
              name: Slot_Memory
              param: CP/Slot_Read
              directWeight: CP/One
              children:
                - tree: 1d
                  name: Slot_Released
                  param: CP/Settling
                  threshold: 0.0624
                  children:
                    - tree: 1d
                      name: Slot_FromValue
                      param: ControlPanel/Slot
                      threshold: 0
                      children:
                        - { clip: slot_detent0, threshold: 0 }
                        - { clip: slot_detent1, threshold: 1 }
                        - { clip: slot_detent2, threshold: 2 }
                        - { clip: slot_detent3, threshold: 3 }
                        - { clip: slot_detent4, threshold: 4 }
                    - tree: 1d
                      name: Slot_Hold
                      param: CP/Slot_Knob
                      threshold: 1
                      children:
                        - { clip: slot_knob0, threshold: 0 }
                        - { clip: slot_knob1, threshold: 1 }
                - tree: 1d
                  name: Slot_Held
                  param: CP/Slot_Read
                  threshold: 0.0625
                  children:
                    - { clip: slot_knob1, threshold: 0.104167 }
                    - { clip: slot_knob0, threshold: 0.9375 }
            - tree: 1d
              name: Slot_Knob
              param: CP/Slot_Knob
              directWeight: CP/One
              children:
                - { clip: slot_at_lo, threshold: 0 }
                - { clip: slot_at_hi, threshold: 1 }
            # Level's knob memory: the razor on the reading; below it the settle hold, then the synced value.
            - tree: 1d
              name: Level_Memory
              param: CP/Level_Read
              directWeight: CP/One
              children:
                - tree: 1d
                  name: Level_Released
                  param: CP/Settling
                  threshold: 0.0624
                  children:
                    - tree: 1d
                      name: Level_FromValue
                      param: ControlPanel/Level
                      threshold: 0
                      children:
                        - { clip: level_knob0, threshold: 0 }
                        - { clip: level_knob1, threshold: 1 }
                    - tree: 1d
                      name: Level_Hold
                      param: CP/Level_Knob
                      threshold: 1
                      children:
                        - { clip: level_knob0, threshold: 0 }
                        - { clip: level_knob1, threshold: 1 }
                - tree: 1d
                  name: Level_Held
                  param: CP/Level_Read
                  threshold: 0.0625
                  children:
                    - { clip: level_knob1, threshold: 0.104167 }
                    - { clip: level_knob0, threshold: 0.9375 }
            - tree: 1d
              name: Level_Knob
              param: CP/Level_Knob
              directWeight: CP/One
              children:
                - { clip: level_at_lo, threshold: 0 }
                - { clip: level_at_hi, threshold: 1 }
    default: Lamps

  # Caps and knobs sunk and both chains off until the frame's glue says every copy has settled; the crossfade
  # smooths the shape.
  - name: Live
    states:
      Inert:
        motion: { clip: inert }
        transitions:
          - { to: Live, when: [ CP/Live greater 0.5 ], duration: 0.25 }
      Live:
        motion: { clip: live }
        transitions:
          - { to: Inert, when: [ CP/Live less 0.5 ], duration: 0.25 }
    default: Inert
    layout:
      nodes: { Inert: [30, 180], Live: [270, 180] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

clips:
  tick: { seconds: 0.016667 }
  cooldown: { seconds: 0.25 }
  settling_off: { set: { CP/Settling: 0 } }
  settling_on: { set: { CP/Settling: 1 } }
  settling_tick: { seconds: 0.016667, set: { CP/Settling: 1 } }
  settle: { seconds: 0.5, set: { CP/Settling: 1 } }
  btn1_off: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn1": 0 } }
  btn1_on: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn1": 100 } }
  btn2_off: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn2": 0 } }
  btn2_on: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn2": 100 } }
  btn3_off: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn3": 0 } }
  btn3_on: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn3": 100 } }
  btn4_off: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn4": 0 } }
  btn4_on: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Btn4": 100 } }
  sel_target1:
    set:
      CP/Sel1_Pos: 1
      CP/Sel2_Pos: 0
      CP/Sel3_Pos: 0
      CP/Sel4_Pos: 0
  sel_target2:
    set:
      CP/Sel1_Pos: 0
      CP/Sel2_Pos: 1
      CP/Sel3_Pos: 0
      CP/Sel4_Pos: 0
  sel_target3:
    set:
      CP/Sel1_Pos: 0
      CP/Sel2_Pos: 0
      CP/Sel3_Pos: 1
      CP/Sel4_Pos: 0
  sel_target4:
    set:
      CP/Sel1_Pos: 0
      CP/Sel2_Pos: 0
      CP/Sel3_Pos: 0
      CP/Sel4_Pos: 1
  sel1_pos0: { set: { CP/Sel1_Pos: 0 } }
  sel1_pos1: { set: { CP/Sel1_Pos: 1 } }
  lamp_sel1_off: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Sel1": 0 } }
  lamp_sel1_on: { set: { "TwoHandProp/Body/Display/Panel/ControlPanel/SkinnedMeshRenderer.blendShape.Lamp_Sel1": 100 } }
  sel2_pos0: { set: { CP/Sel2_Pos: 0 } }
