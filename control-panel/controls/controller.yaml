# ControlPanelControls_Fx — GENERATED by control-panel/controls/generate.py; edit its CONFIG and rerun, never hand-edit this file.
# The controls subtree's machine: button stamps, the slider quantizer, the lamps. The generator's docstring is the design record.
# Published (synced, unsaved, wearer-stamped): ControlPanel/Btn1, ControlPanel/Btn2, ControlPanel/Btn3, ControlPanel/Btn4 (bool on the wire) and ControlPanel/Slot (int on the wire); both
# float in the animator, because the lamp trees read them as blend parameters.
# Press accepted at receiver reading 0.288462, held until every reading is under 0.115385 (depth 0.75 / 0.3 of
# travel over a box 0.026 m deep). Arm 0 s, cooldown 0.25 s. Slot hysteresis 0.02 of the slider's length.

schema: 1
controller: ControlPanelControls_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  ControlPanel/Btn1: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Btn2: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Btn3: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Btn4: { type: float, default: 0, vrc: { type: bool, synced: true, saved: false } }
  ControlPanel/Slot: { type: float, default: 0, vrc: { type: int, synced: true, saved: false } }
  CP/Press1: float   # sensing: a local-only receiver's press depth reading
  CP/Press2: float   # sensing: a local-only receiver's press depth reading
  CP/Press3: float   # sensing: a local-only receiver's press depth reading
  CP/Press4: float   # sensing: a local-only receiver's press depth reading
  CP/Slider_Stretch: float   # sensing: the slider physbone (CP/Slider)
  CP/One: { type: float, default: 1, scratch: true }   # the Direct tree's constant weight
  CP/Live: { type: float, default: 0, aap: true }   # the frame's gate, written by the glue; matches its declaration
  # Shared with the object-sync build through the one component; declarations match the entry's.
  ObjectSync/Enable: { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready: { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal: bool   # VRC built-in

layers:
  - name: Buttons
    states:
      # Remotes never leave Idle: the receivers are local-only, so their readings stay 0 there.
      Idle:
        motion: ~
        transitions:
          - { to: Set1, when: [ CP/Live greater 0.5, CP/Press1 greater 0.288462, ControlPanel/Btn1 less 0.5 ] }
          - { to: Clear1, when: [ CP/Live greater 0.5, CP/Press1 greater 0.288462, ControlPanel/Btn1 greater 0.5 ] }
          - { to: Set2, when: [ CP/Live greater 0.5, CP/Press2 greater 0.288462, ControlPanel/Btn2 less 0.5 ] }
          - { to: Clear2, when: [ CP/Live greater 0.5, CP/Press2 greater 0.288462, ControlPanel/Btn2 greater 0.5 ] }
          - { to: Set3, when: [ CP/Live greater 0.5, CP/Press3 greater 0.288462, ControlPanel/Btn3 less 0.5 ] }
          - { to: Clear3, when: [ CP/Live greater 0.5, CP/Press3 greater 0.288462, ControlPanel/Btn3 greater 0.5 ] }
          - { to: Set4, when: [ CP/Live greater 0.5, CP/Press4 greater 0.288462, ControlPanel/Btn4 less 0.5 ] }
          - { to: Clear4, when: [ CP/Live greater 0.5, CP/Press4 greater 0.288462, ControlPanel/Btn4 greater 0.5 ] }
      Set1:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn1: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear1:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn1: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Set2:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn2: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear2:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn2: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Set3:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn3: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear3:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn3: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Set4:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn4: 1 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Clear4:
        motion: { clip: tick }
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Btn4: 0 } } } ]
        transitions:
          - { to: Hold, when: [], exitTime: 1.0 }
      Hold:
        motion: ~
        transitions:
          - { to: Cooldown, when: [ CP/Press1 less 0.115385, CP/Press2 less 0.115385, CP/Press3 less 0.115385, CP/Press4 less 0.115385 ] }
      # The floor between two toggles: no press rung leaves here.
      Cooldown:
        motion: { clip: cooldown }
        transitions:
          - { to: Idle, when: [], exitTime: 1.0 }
    default: Idle
    layout:
      nodes: { Idle: [30, 180], Set1: [-330, 340], Set2: [-90, 340], Set3: [150, 340], Set4: [390, 340], Clear1: [-330, 420], Clear2: [-90, 420], Clear3: [150, 420], Clear4: [390, 420], Hold: [30, 520], Cooldown: [30, 600] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # Boundary k/N between slot k-1 and slot k; a state leaves for a neighbour only past it by the hysteresis.
  - name: Slot
    states:
      Slot0:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 0 } } } ]
        transitions:
          - { to: Slot1, when: [ CP/Slider_Stretch greater 0.22 ] }
      Slot1:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 1 } } } ]
        transitions:
          - { to: Slot2, when: [ CP/Slider_Stretch greater 0.42 ] }
          - { to: Slot0, when: [ CP/Slider_Stretch less 0.18 ] }
      Slot2:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 2 } } } ]
        transitions:
          - { to: Slot3, when: [ CP/Slider_Stretch greater 0.62 ] }
          - { to: Slot1, when: [ CP/Slider_Stretch less 0.38 ] }
      Slot3:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 3 } } } ]
        transitions:
          - { to: Slot4, when: [ CP/Slider_Stretch greater 0.82 ] }
          - { to: Slot2, when: [ CP/Slider_Stretch less 0.58 ] }
      Slot4:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { ControlPanel/Slot: 4 } } } ]
        transitions:
          - { to: Slot3, when: [ CP/Slider_Stretch less 0.78 ] }
    default: Slot0
    layout:
      nodes: { Slot0: [30, 180], Slot1: [270, 180], Slot2: [510, 180], Slot3: [750, 180], Slot4: [990, 180] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  - name: Lamps
    states:
      Lamps:
        motion:
          tree: direct
          name: Lamps
          children:
            - tree: 1d
              name: Btn1
              param: ControlPanel/Btn1
              directWeight: CP/One
              children:
                - { clip: btn1_off, threshold: 0 }
                - { clip: btn1_on, threshold: 1 }
            - tree: 1d
              name: Btn2
              param: ControlPanel/Btn2
              directWeight: CP/One
              children:
                - { clip: btn2_off, threshold: 0 }
                - { clip: btn2_on, threshold: 1 }
            - tree: 1d
              name: Btn3
              param: ControlPanel/Btn3
              directWeight: CP/One
              children:
                - { clip: btn3_off, threshold: 0 }
                - { clip: btn3_on, threshold: 1 }
            - tree: 1d
              name: Btn4
              param: ControlPanel/Btn4
              directWeight: CP/One
              children:
                - { clip: btn4_off, threshold: 0 }
                - { clip: btn4_on, threshold: 1 }
            - tree: 1d
              name: Slot
              param: ControlPanel/Slot
              directWeight: CP/One
              children:
                - { clip: seg0, threshold: 0 }
                - { clip: seg1, threshold: 1 }
                - { clip: seg2, threshold: 2 }
                - { clip: seg3, threshold: 3 }
                - { clip: seg4, threshold: 4 }
    default: Lamps

  # Caps sunk and the chain off until the frame's glue says every copy has settled; the crossfade smooths the caps.
  - name: Live
    states:
      Inert:
        motion: { clip: inert }
        transitions:
          - { to: Live, when: [ CP/Live greater 0.5 ], duration: 0.25 }
      Live:
        motion: { clip: live }
        transitions:
          - { to: Inert, when: [ CP/Live less 0.5 ], duration: 0.25 }
    default: Inert
    layout:
      nodes: { Inert: [30, 180], Live: [270, 180] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # A remote shows the offline lamp until object-sync's word is trustworthy; the wearer never does.
  - name: Offline
    states:
      Offline:
        motion: { clip: offline }
        transitions:
          - { to: Online, when: [ IsLocal is true ] }
          - { to: Online, when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      Online:
        motion: { clip: online }
        transitions:
          - { to: Offline, when: [ IsLocal is false, ObjectSync/Enable less 0.5 ] }
          - { to: Offline, when: [ IsLocal is false, OS/Ready less 0.5 ] }
    default: Offline
    layout:
      nodes: { Offline: [30, 180], Online: [270, 180] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

