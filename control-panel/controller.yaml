  # --- BEGIN GENERATED by generate.py: cell bindings from two-hand-prop, Park from PARK_SETS.
  timer:        # cell `timer` + Park HOME  [EMPIRICAL: the remote settle dwell is the cell's]
    seconds: 1.0
    set:
      "TwoHandProp/Body/Display/GameObject.m_IsActive": 0
      "TwoHandProp/HolderA/HandleA_Root/GameObject.m_IsActive": 1
