    set:
      "TwoHandProp/Body/Display/GameObject.m_IsActive": 1
      "TwoHandProp/HolderA/HandleA_Root/GameObject.m_IsActive": 1
      "TwoHandProp/HolderB/HandleB_Root/GameObject.m_IsActive": 1
