      "TwoHandProp/HolderB/VRCParentConstraint.IsActive": 1
      "TwoHandProp/Body/VRCPositionConstraint.IsActive": 1
      "TwoHandProp/Body/VRCPositionConstraint.Sources.source0.Weight": 1
      "TwoHandProp/Body/VRCPositionConstraint.Sources.source1.Weight": 0
      "TwoHandProp/Body/VRCPositionConstraint.Sources.source2.Weight": 0
      "TwoHandProp/Body/VRCPositionConstraint.Sources.source3.Weight": 0
      "TwoHandProp/Body/VRCRotationConstraint.IsActive": 1
      "TwoHandProp/Body/VRCRotationConstraint.Sources.source0.Weight": 1
      "TwoHandProp/Body/VRCRotationConstraint.Sources.source1.Weight": 0
      "Park/VRCPositionConstraint.Sources.source0.Weight": 1
      "Park/VRCPositionConstraint.Sources.source1.Weight": 0
