# grab-sync composition chords — GENERATED by generate.py; edit the generator.
# The chord law (IsLocal chords never bind a Container weight; remote weight
# moves only at the bridge crossfade and the carried entry) is enforced by
# emission shape and asserted by --check. Grab-cell values are grab-prop's
# clip table mapped (vanilla Container -> LocalPose; --check pins the superset).
# Bridge timer, derived f(CONFIG) at 60 fps — exactness is not load-bearing, the swap glides:
#   measure (33-frame walk + settleFrames): 0.617s
#   wire loop (batchCount x batchSeconds): 0.400s
#   fine re-lock bound (fineEscapeFrames): 0.500s
#   buffer: 0.500s
#   total: 2.02s

schema: 1
controller: GrabSync_Fx
basis: mount-root          # FullController on the GrabSync prefab root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  # The entry's published interface, read by name across the two FullControllers
  # (both list ObjectSync/* in globalParams). Declared float/scratch here: the
  # entry's params asset owns the VRC declaration, and float compares avoid a
  # merged-type mismatch on the If op (the entry declares Enable float).
  ObjectSync/Enable:      { type: float, scratch: true }
  ObjectSync/Ch/Acquired: { type: bool,  scratch: true }
  IsLocal:                bool     # VRC built-in (bool, matching the emulator's typing)
  GS/Engaged:             bool     # the visibility latch (spec §Visibility); driver-written
  Grab0_IsGrabbed:       bool     # sensing — minted by Prop0's grab physbone (parameter: Grab0); never synced
  Placed0:               { type: bool, default: false, vrc: { synced: true, saved: false } }

layers:
  # The visibility latch: engages on Acquired DELAYED (the receiver certifies
  # one driver-frame ahead of the word copies the decode reads), releases only
  # on Enable-off — deliberately looser than the entry's consumer predicate, so
  # a cull resume holds the last-decoded pose instead of blinking the prop
  # (stated deviation; mirrors the entry's own Follow latch).
  - name: GS/Engage
    states:
      Disengaged:
        motion: ~
        behaviours: [ { driver: { set: { GS/Engaged: 0 } } } ]
        transitions:
          - { to: Delay, when: [ ObjectSync/Ch/Acquired is true, ObjectSync/Enable greater 0.5 ] }
      Delay:
        motion: { clip: engage_delay }
        transitions:
          - { to: Disengaged, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Engaged, when: [], exitTime: 1.0 }
      Engaged:
        motion: ~
        behaviours: [ { driver: { set: { GS/Engaged: 1 } } } ]
        transitions:
          - { to: Disengaged, when: [ ObjectSync/Enable less 0.5 ] }
    default: Disengaged
  # Prop0: the merged level-predicated placement layer. Every state is entered
  # on LEVELS of current values (a late joiner reaches Placed with no edge);
  # the witnessed-release bridge is the sole edge-entered path and its miss
  # collapses to the level path after the timer.
  - name: GS/Prop0
    states:
      LocalDisabled:   # off-is-reset: recall home, clear Placed (localOnly; value syncs)
        motion: { clip: Prop0_local_disabled }
        behaviours:
          - driver: { localOnly: true, set: { Placed0: 0 } }
          - driver: { set: { Grab0_IsGrabbed: 0 } }   # clears only because the bone GO is inactive in this chord
        transitions:
          - { to: LocalHome, when: [ ObjectSync/Enable greater 0.5 ] }
      LocalHome:
        motion: { clip: Prop0_local_home }
        behaviours:
          - driver: { localOnly: true, set: { Placed0: 0 } }
        transitions:
          - { to: LocalDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: LocalGrabbed, when: [ Grab0_IsGrabbed is true ] }
      LocalGrabbed:
        motion: { clip: Prop0_local_grabbed }
        transitions:
          - { to: LocalDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: LocalReleased, when: [ Grab0_IsGrabbed is false ] }
      LocalReleased:   # the pulse; its length is the re-grab lockout (vanilla)
        motion: { clip: Prop0_local_released }
        behaviours:
          - driver: { localOnly: true, set: { Placed0: 1 } }
        transitions:
          - { to: LocalPlaced, when: [], exitTime: 1.0 }
      LocalPlaced:
        motion: { clip: Prop0_local_placed }
        transitions:
          - { to: LocalDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: LocalGrabbed, when: [ Grab0_IsGrabbed is true ] }
      RemoteWait:      # grab-prop's remote settle dwell, verbatim
        motion: { clip: Prop0_remote_wait }
        transitions:
          - { to: RemoteGrabbed, when: [ Grab0_IsGrabbed is true ], exitTime: 1.0 }
          - { to: RemotePlaced, when: [ Placed0 is true, GS/Engaged is true ], exitTime: 1.0 }
          - { to: RemoteHome, when: [ ObjectSync/Enable greater 0.5, GS/Engaged is true ], exitTime: 1.0 }
          - { to: RemoteDisabled, when: [ ObjectSync/Enable less 0.5 ], exitTime: 1.0 }
          - { to: RemoteUncertified, when: [], exitTime: 1.0 }
      RemoteDisabled:  # Enable off: hidden, parked home, sensing cleared
        motion: { clip: Prop0_remote_disabled }
        behaviours:
          - driver: { set: { Grab0_IsGrabbed: 0 } }
        transitions:
          - { to: RemoteGrabbed, when: [ Grab0_IsGrabbed is true ] }
          - { to: RemoteHome, when: [ ObjectSync/Enable greater 0.5, GS/Engaged is true ] }
          - { to: RemoteUncertified, when: [ ObjectSync/Enable greater 0.5 ] }
      RemoteUncertified:  # Enable on but no certified table yet: hidden, parked
        motion: { clip: Prop0_remote_hidden }
        transitions:
          - { to: RemoteGrabbed, when: [ Grab0_IsGrabbed is true ] }
          - { to: RemoteDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: RemotePlaced, when: [ Placed0 is true, GS/Engaged is true ] }
          - { to: RemoteHome, when: [ GS/Engaged is true ] }
      RemoteHome:
        motion: { clip: Prop0_remote_home }
        transitions:
          - { to: RemoteGrabbed, when: [ Grab0_IsGrabbed is true ] }
          - { to: RemoteDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: RemotePlaced, when: [ Placed0 is true ] }
      RemoteGrabbed:   # the replicated grab replays the grab cell; display rides LocalPose
        motion: { clip: Prop0_remote_grabbed }
        transitions:
          - { to: RemoteDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: RemoteBridge, when: [ Grab0_IsGrabbed is false ] }
      RemoteBridge:    # witnessed release: replay the drop, wait out the pipeline,
                       # then CROSSFADE to the decoded truth (the transition duration)
        motion: { clip: Prop0_remote_bridge }
        transitions:
          - { to: RemoteGrabbed, when: [ Grab0_IsGrabbed is true ] }
          - { to: RemoteDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: RemotePlaced, when: [ Placed0 is true, GS/Engaged is true ], exitTime: 1.0, duration: 0.3 }
          - { to: RemoteHome, when: [ GS/Engaged is true ], exitTime: 1.0, duration: 0.3 }
          - { to: RemoteUncertified, when: [], exitTime: 1.0 }
      RemotePlaced:    # display rides the reconstruction (level-entered: late join lands here)
        motion: { clip: Prop0_remote_placed }
        transitions:
          - { to: RemoteGrabbed, when: [ Grab0_IsGrabbed is true ] }   # the carried entry: word->drag swap, one frame
          - { to: RemoteDisabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: RemoteHome, when: [ Placed0 is false ] }
    entry:
      - { to: LocalDisabled, when: [ IsLocal is true, ObjectSync/Enable less 0.5 ] }
      - { to: LocalGrabbed, when: [ IsLocal is true, Grab0_IsGrabbed is true ] }
      - { to: LocalPlaced, when: [ IsLocal is true, Placed0 is true ] }
      - { to: LocalHome, when: [ IsLocal is true ] }
    default: RemoteWait
    layout:
      nodes:
        RemoteWait: [30, 180]
        LocalHome: [-450, 250]
        LocalDisabled: [-690, 250]
        LocalGrabbed: [-450, 340]
        LocalReleased: [-210, 340]
        LocalPlaced: [-210, 430]
        RemoteDisabled: [270, 250]
        RemoteUncertified: [510, 250]
        RemoteHome: [30, 320]
        RemoteGrabbed: [30, 410]
        RemoteBridge: [270, 410]
        RemotePlaced: [270, 500]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

clips:
  engage_delay: { seconds: 0.1 }
  Prop0_local_home:
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
  Prop0_local_grabbed:
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 1
  Prop0_local_released:   # the pulse [EMPIRICAL: sample window [0.25,0.50)s — grab-prop's, verbatim]
    seconds: 0.5
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 1
    curves:
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": { tangents: stepped, keys: [ [0.0, 0], [0.25, 1], [0.5, 0] ] }
  Prop0_local_placed:
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 0
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 1
  Prop0_local_disabled:   # wearer stays visible (spec's visibility formula); bone dead, parked home
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 0
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
  Prop0_remote_wait:   # grab-prop's timer chord, hidden, weights parked on LocalPose
    seconds: 1.0
    set:
      "Prop0/Container/GameObject.m_IsActive": 0
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCRotationConstraint.Sources.source1.Weight": 0
  Prop0_remote_disabled:
    set:
      "Prop0/Container/GameObject.m_IsActive": 0
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 0
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCRotationConstraint.Sources.source1.Weight": 0
  Prop0_remote_hidden:
    set:
      "Prop0/Container/GameObject.m_IsActive": 0
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCRotationConstraint.Sources.source1.Weight": 0
  Prop0_remote_home:
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop0/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop0/Container/VRCRotationConstraint.Sources.source1.Weight": 0
  Prop0_remote_grabbed:
    set:
      "Prop0/Container/GameObject.m_IsActive": 1
      "Prop0/GrabRig/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop0/LocalPose/VRCPositionConstraint.m_Enabled": 1
      "Prop0/GrabRig/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.IsActive": 0
      "Prop0/GrabRig/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
