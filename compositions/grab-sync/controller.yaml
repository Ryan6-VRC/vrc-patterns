# GrabSync glue controller — the ONE controller of the grab-sync composition; the README owns the arc, this header owns only what the graph cannot say.
# multi.yaml is this document at four suffixed props, EMITTED from it by generate.py — never hand-edit it, and re-run the generator after any edit here.
# The clip table below the BEGIN marker is emitted (generate.py owns it, and its `the glue documents` section is the design record): cell bindings read live from ../../grab-prop/controller.yaml's clip table — values unchanged, paths gaining the Prop/GrabProp/ prefix — the cell IsActive writes that are inert while Container's GameObject is off included; the entry's header owns why they stay at 1. State↔clip mapping, total: Timer→timer, Disabled→disabled, Anchored→anchored, Grabbed→grabbed, Released→released (pulse curve included), Dropped→dropped, Waiting→waiting, Acquire/Bridge/Synced/Resume→dropped, Reacquire/Resume_Grab→grabbed.
# Glue value-sets (home slot on BOTH mux channels; Anchored parks) — digits are an echo of generate.py's VALUE_SETS, which is their canon:
#   HOME    = mux w (0,0,1) both channels, damper passthrough, park ON   (Timer/Disabled/Waiting hidden; Anchored visible)
#   CARRY   = mux w (1,0,0) both channels, damper passthrough, park OFF  (Grabbed/Released/Dropped/Bridge)
#   ACQUIRE = mux w (0,1,0) both channels, damper passthrough, park ON   (Acquire/Resume/Resume_Grab — rigid word flush)
#   SYNC    = mux w (0,1,0), damper pos (0.1,1) rot (0.2,1),   park ON   (Synced/Reacquire — the ancestor rig's shipped damped values)
# Engage gates read OS/Ready, the entry's SEALED certification — reachable only because this glue merges through the same FullController component as the sync build (one component prefixes identically, so the names unify): engage on Ready, invalidate on raw Ch/Acquired only where the earliest falling edge is wanted (../../object-sync/README.md §Params out). This glue has no invalidate rung, so Ch/Acquired goes undeclared.
# The Enable and OS/Ready declarations MATCH the entry's animator declarations — float, with vrc.type the bool wire type — because VRCFury's param merge is first-wins (VFController._NewParam) and types must agree. Enable is deliberately un-scratch with default 1: the host-capture mechanism (docs/gimmicks.md §Packaging — the capturing declaration's flags win), vrc flags matched to the entry's exactly. The merge is first-wins in controller order WITHIN the shared FullController component (VFController._NewParam returns the existing param, and the expression-parameters Add returns silently on an existing name, erroring only on a type mismatch) — this glue controller sits BEFORE the sync build in the component's controllers list, which is why the default-1 here wins; the failure symptom if that inversion ever ships is Enable baking default-0, the prop invisible on spawn.
# Detached (synced, unsaved, default false): set on GRAB, not release — true means "away from home" (carried or placed); false means home, which is also the rejoin/default reading. Waiting routes to Anchored on !Detached: home is unambiguous given the bit, so a joiner sees an anchored prop immediately instead of parking hidden.
# GrabPosition's rest anchor is the sanctioned two-source repoint (../../grab-prop/README.md §How it works owns the rule and its measured boundary): src0 = Container/Display, a plain constraint-free child value-identical to the home park at home, and acquire/synced/resume flip the GrabPosition weights (0,1)→(1,0) so the parked cell root rides the word — a re-grab from Synced starts ON the display, no stale-capture flash. Acquire/Synced/Resume cell is therefore `dropped` EXCEPT that weight pair — the binding-diff assert carves the exception explicitly.
# Reacquire (residual fix): a remote's re-grab flickers one frame because the just-woken frozen cell nodes (Container/SourcePosition) are read by the display before they re-follow. Reacquire holds SYNC glue (display stays on the word) + `grabbed` cell values (cell wakes, root frozen on the word) for 0.1 s, then Grabbed — the display swaps to the cell only after the cell is populated. Remote-only by reachability; a sub-dwell grab exits to Released so the capture choreography still replays.
# Resume/Resume_Grab — the cull park. A distance-hide pauses the animator, and a remote resuming in a damped state integrates from its stale pre-pause pose to the word, flying the prop across the scene (Container's self-source is the only integrator on the path). IsAnimatorEnabled is false for exactly one frame before the halt and true whenever you can observe anything (VRChat's documented contract — docs/runtime.md §Parameters owns it and the citation), so a RESUME IS NOT DETECTABLE: every rung here pre-arms on that pre-halt frame and the pause begins in Resume, hidden and rigid on the word. Six states pre-arm — Synced/Reacquire because they are damped, Grabbed/Released because their resume path is Released→Bridge→Synced which hands a stale cell capture to the damper, Acquire/Bridge because their exits reach Synced. The Released rung is the ONE sanctioned exception to that state's no-early-exit rule: the pulse is a re-grab lockout the animator is about to stop honouring, and the cell capture it protects is worthless to a state that rides the word.
# Resume's dwell is pulse + bridge, not Ready [EMPIRICAL, and NOT the same number as Bridge's own]: Ready certifies a contiguous head→tail walk, not that the table reflects where the prop came to rest, and Resume cannot tell a prop at rest for ten minutes from one released a frame before the resume — so it waits the full release→committed-word latency FROM THE RESUME, which is always ≥ whatever dwell Bridge had left. The clip playhead freezes with the animator, which is what lets a clip length express that. Ready therefore gates only the degenerate case, a receiver that never re-locked (one to two loops, 0.7–1.4 s at N=1, inside the dwell). ACCEPTED RESIDUAL: a release landing INSIDE the dwell is uncovered — the prop appears on a word still trailing the carry and rides it to the drop, which is the entry's already-accepted stepped reconstruction rather than a stale-pose flight, since Resume leaves Container rigidly on the word and the handoff carries no damper transient. The knob if that ever matters is a word-settled detector (blendtree-math on a one-frame-delayed decode copy), not a longer dwell.
# Resume_Grab exists because an in-progress grab does not reach a client that was not evaluating (docs/runtime.md §PhysBones' late-joiner rule, same mechanism): a remote resuming mid-carry reads Grab_IsGrabbed false and never takes the rung, so the only grab that fires it STARTS after the resume and the prop belongs at the hand. Reacquire cannot serve — it holds the display on the word, and its premise is that the word is trustworthy, which here is what is false. This is correct whichever way the physbone question falls, so the rung needs no re-deriving if anyone measures it.
# Routing trap, non-derivable: entry rungs evaluate at playable frame 0, before the runtime writes IsLocal — all boot routing is level transitions on the dwell state (Timer), never entry-edge rungs.
# Bridge timer [EMPIRICAL]: pulse 0.5 + bridge 2.4 ≈ 2.9 s (entry docs: ~1.3 s worst-case end to end + buffer).

schema: 1
controller: GrabSync_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  Detached:            { type: bool, default: false, vrc: { synced: true, saved: false } }
  Grab_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: Grab)
  ObjectSync/Enable:   { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready:            { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal:             bool               # VRC built-in
  IsAnimatorEnabled:   { type: bool, default: true }   # VRC built-in — longform default-true MATCHES the entry's declaration; the shorthand `bool` form defaults false and, first-wins, would send the entry's Ch/Reset to Disabling at startup

layers:
  - name: Prop
    states:
      # Boot dwell — all routing is level transitions here (entry rungs evaluate before IsLocal lands).
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Disabled, when: [ IsLocal is true ] }
          - { to: Waiting,  when: [ IsLocal is false ], exitTime: 1.0 }
      Disabled:
        motion: { clip: disabled }
        behaviours:
          - driver: { localOnly: true, set: { Detached: 0 } }   # off-is-reset: recall home
        transitions:
          - { to: Anchored, when: [ ObjectSync/Enable greater 0.5 ] }
      Anchored:
        motion: { clip: anchored }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          # the cull-resume rung: a remote resuming with detached truth on the wire must not sit showing
          # home. Direct to Synced: the prop is visible and solving at home, so the
          # damped entry is value-continuous — a glide to the word, never Acquire's hide/flush (whose
          # only entry is now from hidden Waiting, so its delayed show can never blink a visible prop).
          - { to: Synced,   when: [ IsLocal is false, Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      Grabbed:
        motion: { clip: grabbed }
        behaviours:
          - driver: { localOnly: true, set: { Detached: 1 } }   # detached-on-grab: the bit means "away from home"
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
      # No early exit — the pulse is the re-grab lockout; Enable-off lands one pulse late via Dropped/Bridge.
      Released:
        motion: { clip: released }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Dropped, when: [ IsLocal is true ],  exitTime: 1.0 }
          - { to: Bridge,  when: [ IsLocal is false ], exitTime: 1.0 }
      Dropped:
        motion: { clip: dropped }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
      Waiting:
        motion: { clip: waiting }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          # the late-join level path
          - { to: Acquire,  when: [ Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
          # home is unambiguous given the bit: show an anchored prop immediately
          - { to: Anchored, when: [ Detached is false ] }
      Acquire:
        motion: { clip: acquire }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ Detached is false ] }
          - { to: Synced,    when: [], exitTime: 1.0 }   # damper transient zero — Container already on the word
      Bridge:
        motion: { clip: bridge }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Synced,   when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, Detached is true ], exitTime: 1.0 }
          - { to: Waiting,  when: [ Detached is false ], exitTime: 1.0 }
      Synced:
        motion: { clip: synced }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ Detached is false ] }
      # Display holds the word while the woken cell flushes to the hand; swap lands only when populated.
      Reacquire:
        motion: { clip: reacquire }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
      # The cull park. Entered on the pre-halt frame, so the pause BEGINS here and the clip's remaining
      # dwell measures from the resume — the playhead freezes with the animator, which is what lets a
      # clip length express "wait this long after coming back".
      Resume:
        motion: { clip: resume }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume_Grab, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,     when: [ Detached is false ] }
          - { to: Synced,      when: [ OS/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
      # Re-grab out of the park: hidden while the cell populates, so the prop appears at the hand and the
      # pre-pause pose is never rendered.
      Resume_Grab:
        motion: { clip: resume_grab }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
    default: Timer
    # Hand arrangement. A window rearrange lives only in the built asset until folded back:
    # DecompileController, take the layout block, recompile — never regenerate over it.
    layout:
      nodes: { Timer: [30, 180], Disabled: [260, 250], Anchored: [30, 390], Grabbed: [30, 530], Released: [260, 530], Dropped: [490, 530], Waiting: [-200, 250], Acquire: [-200, 320], Bridge: [320, 390], Synced: [320, 320], Reacquire: [30, 460], Resume: [560, 320], Resume_Grab: [560, 460] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

# Every clip = 7 cell bindings (verbatim values) + 13 glue bindings (value-set).
clips:
  # --- BEGIN GENERATED by generate.py: cell bindings from grab-prop, glue from VALUE_SETS.
  timer:        # cell `timer` + HOME hidden  [EMPIRICAL: dwell = clip length]
    seconds: 1.0
    set:
      "Prop/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/GameObject.m_IsActive": 0
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/VRCPositionConstraint.m_Enabled": 1
      "Prop/GrabProp/Container/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.IsActive": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source2.Weight": 1
      "Prop/Source/VRCRotationConstraint.Sources.source0.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source2.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/DragBone_Yaw/Follower/DragBone/VRCPhysBone.m_Enabled": 0
      "Prop/DragBone_Yaw/Follower/VRCRotationConstraint.IsActive": 1
      "Prop/Container/Display/GameObject.m_IsActive": 0
  disabled:     # cell `disabled` + HOME hidden
    set:
      "Prop/GameObject.m_IsActive": 0
      "Prop/GrabProp/Container/GameObject.m_IsActive": 0
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 0
      "Prop/GrabProp/Container/VRCPositionConstraint.m_Enabled": 1
      "Prop/GrabProp/Container/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.IsActive": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source2.Weight": 1
      "Prop/Source/VRCRotationConstraint.Sources.source0.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source2.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/DragBone_Yaw/Follower/DragBone/VRCPhysBone.m_Enabled": 0
      "Prop/DragBone_Yaw/Follower/VRCRotationConstraint.IsActive": 1
      "Prop/Container/Display/GameObject.m_IsActive": 0
  anchored:     # cell `anchored` + HOME visible (home rot + park)
    set:
      "Prop/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/GameObject.m_IsActive": 1
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/VRCPositionConstraint.m_Enabled": 1
      "Prop/GrabProp/Container/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source2.Weight": 1
      "Prop/Source/VRCRotationConstraint.Sources.source0.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source2.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/DragBone_Yaw/Follower/DragBone/VRCPhysBone.m_Enabled": 0
      "Prop/DragBone_Yaw/Follower/VRCRotationConstraint.IsActive": 1
    # Delayed show, same mechanism as acquire's: with Prop frozen through Disabled, re-enable needs
    # 2-3 frames for the rotation ring to flush; Anchored is only ever entered from hidden states, so
    # this hide can never blink a visible prop.
    curves:
      "Prop/Container/Display/GameObject.m_IsActive": { tangents: stepped, keys: [ [0, 0], [0.1, 1] ] }
  grabbed:      # cell `grabbed` + CARRY
    set:
      "Prop/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/GameObject.m_IsActive": 1
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/VRCPositionConstraint.m_Enabled": 1
      "Prop/GrabProp/Container/SourcePosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.IsActive": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 1
      "Prop/Source/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Source/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source2.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Source/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source2.Weight": 0
      "Prop/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/DragBone_Yaw/Follower/DragBone/VRCPhysBone.m_Enabled": 1
      "Prop/DragBone_Yaw/Follower/VRCRotationConstraint.IsActive": 0
      "Prop/Container/Display/GameObject.m_IsActive": 1
  released:     # cell `released` (pulse verbatim) + CARRY  [EMPIRICAL: sample window [0.25, 0.50) s]
    length: 0.5
    set:
      "Prop/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/GameObject.m_IsActive": 1
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/VRCPositionConstraint.m_Enabled": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 1
      "Prop/Source/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Source/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source2.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Source/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source2.Weight": 0
      "Prop/Container/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Container/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Container/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/DragBone_Yaw/Follower/DragBone/VRCPhysBone.m_Enabled": 1
      "Prop/DragBone_Yaw/Follower/VRCRotationConstraint.IsActive": 0
      "Prop/Container/Display/GameObject.m_IsActive": 1
    curves:
      "Prop/GrabProp/Container/SourcePosition/VRCPositionConstraint.IsActive": { tangents: stepped, keys: [ [0, 0], [0.25, 1], [0.5, 0] ] }
  dropped:      # cell `dropped` + CARRY
    set:
      "Prop/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/GameObject.m_IsActive": 1
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/VRCPositionConstraint.m_Enabled": 0
      "Prop/GrabProp/Container/SourcePosition/VRCPositionConstraint.IsActive": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.IsActive": 1
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source0.Weight": 0
      "Prop/GrabProp/GrabPosition/VRCPositionConstraint.Sources.source1.Weight": 1
      "Prop/Source/VRCPositionConstraint.Sources.source0.Weight": 1
      "Prop/Source/VRCPositionConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCPositionConstraint.Sources.source2.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source0.Weight": 1
      "Prop/Source/VRCRotationConstraint.Sources.source1.Weight": 0
      "Prop/Source/VRCRotationConstraint.Sources.source2.Weight": 0
      "Prop/Container/VRCPositionConstraint.Sources.source0.Weight": 1
