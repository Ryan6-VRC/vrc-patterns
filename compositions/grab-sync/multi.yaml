# MultiGrabSync glue controller — GrabSync's document at four props: one layer and clip set per prop,
# suffixed A..D (PropA..PropD, DetachedA..D, GrabA..D, timerA.. etc.), each identical to controller.yaml's
# modulo the suffix (the SyncPropA..D mux repoint is a prefab fact — the mux swaps by source index, so
# nothing here names it).
# Every design ruling lives in controller.yaml's header and is not restated here; keep the two documents
# in lockstep — an edit to one is an edit to both, and the check is reproducible: strip the trailing
# letter (A..D) from any one prop's layer and diff it against controller.yaml's (the layers are identical;
# the Bridge and Resume timers below are the only intended differences, both re-derived at N=4).
# Bridge timer [EMPIRICAL, re-derived at N=4 — never copied from N=1]: the regenerated build's documents
# give a 4-slice measure ring of ~3.07 s and a ~1.87 s wire refresh, so the post-drop worst case is
# ~4.9 s end to end; pulse 0.5 + bridge 6.0 = 6.5 s keeps the N=1 buffer (~1.6 s). Over-waiting holds the
# witnessed capture longer (cosmetic); under-waiting shows the pre-drop trail as a damped glide (defect).
# Resume dwell [EMPIRICAL, re-derived at N=4]: pulse 0.5 + bridge 6.0 = 6.5 s, the same pulse+bridge rule
# controller.yaml's header derives — Resume cannot know when the prop was last released, so it waits the
# full release-to-committed-word latency from the resume, which at N=4 is this number and not 2.9 s.

schema: 1
controller: MultiGrabSync_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  DetachedA:            { type: bool, default: false, vrc: { synced: true, saved: false } }
  DetachedB:            { type: bool, default: false, vrc: { synced: true, saved: false } }
  DetachedC:            { type: bool, default: false, vrc: { synced: true, saved: false } }
  DetachedD:            { type: bool, default: false, vrc: { synced: true, saved: false } }
  GrabA_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: GrabA)
  GrabB_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: GrabB)
  GrabC_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: GrabC)
  GrabD_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: GrabD)
  ObjectSync/Enable:   { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  ObjectSync/Ready:    { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal:             bool               # VRC built-in
  IsAnimatorEnabled:   { type: bool, default: true }   # VRC built-in — longform default-true MATCHES the entry's declaration; the shorthand `bool` form defaults false and, first-wins, would send the entry's Ch/Reset to Disabling at startup

layers:
  - name: PropA
    states:
      # Boot dwell — all routing is level transitions here (entry rungs evaluate before IsLocal lands).
      Timer:
        motion: { clip: timerA }
        transitions:
          - { to: Disabled, when: [ IsLocal is true ] }
          - { to: Waiting,  when: [ IsLocal is false ], exitTime: 1.0 }
      Disabled:
        motion: { clip: disabledA }
        behaviours:
          - driver: { localOnly: true, set: { DetachedA: 0 } }   # off-is-reset: recall home
        transitions:
          - { to: Anchored, when: [ ObjectSync/Enable greater 0.5 ] }
      Anchored:
        motion: { clip: anchoredA }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ GrabA_IsGrabbed is true ] }
          # the cull-resume rung: a remote resuming with detached truth on the wire must not sit showing
          # home. Direct to Synced (operator-ruled): the prop is visible and solving at home, so the
          # damped entry is value-continuous — a glide to the word, never Acquire's hide/flush (whose
          # only entry is now from hidden Waiting, so its delayed show can never blink a visible prop).
          - { to: Synced,   when: [ IsLocal is false, DetachedA is true, ObjectSync/Enable greater 0.5, ObjectSync/Ready greater 0.5 ] }
      Grabbed:
        motion: { clip: grabbedA }
        behaviours:
          - driver: { localOnly: true, set: { DetachedA: 1 } }   # detached-on-grab (operator-ruled): the bit means "away from home"
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ GrabA_IsGrabbed is false ] }
      # No early exit — the pulse is the re-grab lockout; Enable-off lands one pulse late via Dropped/Bridge.
      Released:
        motion: { clip: releasedA }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Dropped, when: [ IsLocal is true ],  exitTime: 1.0 }
          - { to: Bridge,  when: [ IsLocal is false ], exitTime: 1.0 }
      Dropped:
        motion: { clip: droppedA }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ GrabA_IsGrabbed is true ] }
      Waiting:
        motion: { clip: waitingA }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ GrabA_IsGrabbed is true ] }
          # the late-join level path
          - { to: Acquire,  when: [ DetachedA is true, ObjectSync/Enable greater 0.5, ObjectSync/Ready greater 0.5 ] }
          # home is unambiguous given the bit (operator-ruled): show an anchored prop immediately
          - { to: Anchored, when: [ DetachedA is false ] }
      Acquire:
        motion: { clip: acquireA }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ GrabA_IsGrabbed is true ] }
          - { to: Waiting,   when: [ DetachedA is false ] }
          - { to: Synced,    when: [], exitTime: 1.0 }   # damper transient zero — Container already on the word
      Bridge:
        motion: { clip: bridgeA }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ GrabA_IsGrabbed is true ] }
          - { to: Synced,   when: [ ObjectSync/Enable greater 0.5, ObjectSync/Ready greater 0.5, DetachedA is true ], exitTime: 1.0 }
          - { to: Waiting,  when: [ DetachedA is false ], exitTime: 1.0 }
      Synced:
        motion: { clip: syncedA }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ GrabA_IsGrabbed is true ] }
          - { to: Waiting,   when: [ DetachedA is false ] }
      # Display holds the word while the woken cell flushes to the hand; swap lands only when populated.
      Reacquire:
        motion: { clip: reacquireA }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ GrabA_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
      # The cull park. Entered on the pre-halt frame, so the pause BEGINS here and the clip's remaining
      # dwell measures from the resume — the playhead freezes with the animator, which is what lets a
      # clip length express "wait this long after coming back".
      Resume:
        motion: { clip: resumeA }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume_Grab, when: [ GrabA_IsGrabbed is true ] }
          - { to: Waiting,     when: [ DetachedA is false ] }
          - { to: Synced,      when: [ ObjectSync/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
      # Re-grab out of the park: hidden while the cell populates, so the prop appears at the hand and the
      # pre-pause pose is never rendered.
      Resume_Grab:
        motion: { clip: resume_grabA }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Released, when: [ GrabA_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
    default: Timer
    # Operator-authored arrangement. A window rearrange lives only in the built asset until folded back:
    # DecompileController, take the layout block, recompile — never regenerate over it.
    layout:
      nodes: { Timer: [30, 180], Disabled: [260, 250], Anchored: [30, 390], Grabbed: [30, 530], Released: [260, 530], Dropped: [490, 530], Waiting: [-200, 250], Acquire: [-200, 320], Bridge: [320, 390], Synced: [320, 320], Reacquire: [30, 460], Resume: [560, 320], Resume_Grab: [560, 460] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

