      Waiting:
        motion: { clip: waiting_3 }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_3_IsGrabbed is true ] }
          # the late-join level path
          - { to: Acquire,  when: [ Detached_3 is true, ObjectSync/Enable greater 0.5, ObjectSync/Ready greater 0.5 ] }
          # home is unambiguous given the bit (operator-ruled): show an anchored prop immediately
          - { to: Anchored, when: [ Detached_3 is false ] }
      Acquire:
        motion: { clip: acquire_3 }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_3_IsGrabbed is true ] }
          - { to: Waiting,   when: [ Detached_3 is false ] }
          - { to: Synced,    when: [], exitTime: 1.0 }   # damper transient zero — Container already on the word
      Bridge:
        motion: { clip: bridge_3 }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_3_IsGrabbed is true ] }
          - { to: Synced,   when: [ ObjectSync/Enable greater 0.5, ObjectSync/Ready greater 0.5, Detached_3 is true ], exitTime: 1.0 }
          - { to: Waiting,  when: [ Detached_3 is false ], exitTime: 1.0 }
      Synced:
        motion: { clip: synced_3 }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_3_IsGrabbed is true ] }
          - { to: Waiting,   when: [ Detached_3 is false ] }
      # Display holds the word while the woken cell flushes to the hand; swap lands only when populated.
      Reacquire:
        motion: { clip: reacquire_3 }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ Grab_3_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
      # The cull park. Entered on the pre-halt frame, so the pause BEGINS here and the clip's remaining
      # dwell measures from the resume — the playhead freezes with the animator, which is what lets a
      # clip length express "wait this long after coming back".
      Resume:
        motion: { clip: resume_3 }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume_Grab, when: [ Grab_3_IsGrabbed is true ] }
          - { to: Waiting,     when: [ Detached_3 is false ] }
          - { to: Synced,      when: [ ObjectSync/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
      # Re-grab out of the park: hidden while the cell populates, so the prop appears at the hand and the
      # pre-pause pose is never rendered.
      Resume_Grab:
        motion: { clip: resume_grab_3 }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Released, when: [ Grab_3_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
    default: Timer
    # Operator-authored arrangement. A window rearrange lives only in the built asset until folded back:
    # DecompileController, take the layout block, recompile — never regenerate over it.
    layout:
      nodes: { Timer: [30, 180], Disabled: [260, 250], Anchored: [30, 390], Grabbed: [30, 530], Released: [260, 530], Dropped: [490, 530], Waiting: [-200, 250], Acquire: [-200, 320], Bridge: [320, 390], Synced: [320, 320], Reacquire: [30, 460], Resume: [560, 320], Resume_Grab: [560, 460] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

