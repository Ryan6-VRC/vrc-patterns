# GripSync glue controller — the ONE glue controller of the grip-sync composition; the README owns the arc, this header owns only what the graph cannot say.
# grab-sync's skeleton transcribed (its controller.yaml is the source; the transcription rule is below), with its one `Grabbed` state replaced by absolute-grip-prop's fifteen-state grip sub-graph (`Grip …`), transcribed from that entry's controller.yaml. An edit to either source document re-runs this transcription.
# The clip table below the BEGIN marker is emitted (generate.py owns it, and its docstring is the design record): cell bindings read live from ../../absolute-grip-prop/controller.yaml's clip table — values unchanged, paths gaining the Prop/AbsoluteGripProp/ prefix — plus the glue value-sets and the two carves. State↔clip mapping, total: Timer→timer, Disabled→disabled, Anchored→anchored, Grip Arrive/Grip Acquire→grip_acquire, Grip Reacquire→grip_reacquire, Grip LatchedR/L→grip_latched, Grip Settling→grip_settling, Grip Settled→grip_settled, Grip ConfirmXY/Grip CarryXY→grip_carryXY, Released→released, Dropped→dropped, Waiting→waiting, Acquire→acquire, Bridge→bridge, Synced→synced, Reacquire→reacquire, Resume→resume, Resume_Grab→resume_grab.
# Transcription rule, grab-sync side: every rung that entered `Grabbed` enters `Grip Arrive` (Anchored, Dropped, Waiting, Bridge, Reacquire, Resume_Grab) — `Grip Arrive` is the sole gateway into the sub-graph, and its arrive dwell is the entry's first-grabbed-frame guard, which a remote's re-grab needs as much as a fresh grab. Everything else transcribes 1:1: the boot dwell, Waiting's late-join ladder, Released's IsLocal split and its no-early-exit rule, the word states, the Reacquire dwell and the Resume park.
# Transcription rule, cell side: every `Grip` state's rungs are the entry's, with the polarity map `AbsoluteGrip/Enable is false` → `ObjectSync/Enable less 0.5` (float, so no equality), `Released`/`Disabled`/`Dropped`/`Waiting`/`Anchored` targets landing on this document's states of those names, and ONE added rung per Grip state: the cull pre-arm `IsAnimatorEnabled is false → Resume`, placed immediately after the Enable-off rung. Placement is load-bearing: the ladder is first-match, the pre-halt window is one frame, and eight Grip states end in an unconditional exit-time rung that would shadow a pre-arm appended below it.
# `Disabled` is the merge of both documents' Disabled: it keeps the cell's `exitTime: 1.0` on the exit to Anchored — the receivers are off for the 0.25 s stow dwell, and a same-evaluation off→on leaves a proximity receiver deaf for the session — and carries three drivers: `Detached: 0` localOnly (a synced bit, the wearer's to write), the cell's receiver-zeroing driver, NOT localOnly (sensing is per-client; a stowed receiver reads 0 and a stale reading would gate the enable that follows), and the cell's localOnly `Palm/SignP` / `Palm/SignN` clear. The cell's per-client tag drivers — `Palm/Hand` in Grip LatchedR/L, `Palm/Sign` in each Grip Confirm and each Grip Carry — stay NOT localOnly for the same reason: remotes reach the sub-graph through Reacquire, Resume_Grab and Bridge, and a localOnly stamp would stall a remote in Grip Acquire forever with no build error. The cell's `Palm/SignP` / `Palm/SignN` drivers are the one exception and transcribe localOnly unchanged: that pair is the wearer's authoritative sign on the wire, so a remote writing it would overwrite the value it received with its own read (the entry's README owns why the sign is the wearer's while the hand tag stays per-client).
# Glue value-sets (home slot on BOTH mux channels; the rotation mux is full-axis because the cell's home slot is its own Rotor's full-axis HomeAnchor/Offset — grab-sync's Y-only mask serves a drag heading this composition has no use for) — digits echo generate.py's VALUE_SETS, their canon:
#   HOME    = mux w (0,0,1) both channels, damper passthrough   (Timer/Disabled/Waiting hidden; Anchored visible)
#   CARRY   = mux w (1,0,0) both channels, damper passthrough   (every Grip state, Released, Dropped, Bridge)
#   ACQUIRE = mux w (0,1,0) both channels, damper passthrough   (Acquire/Resume/Resume_Grab — rigid word flush)
#   SYNC    = mux w (0,1,0), damper pos (0.1,1) rot (0.2,1)     (Synced/Reacquire — grab-sync's shipped damped values)
# Two carves on the cell values, both in the word states Acquire/Synced/Resume and only there: GrabPosition weights (1,0) — grab-sync's, the parked cell root rides the word through the repointed Display — and the Rotor park: `Container/Rotor` enabled with home at 0 and its added fourth source (ObjectSync/Sync) at 1, so the freeze the cell's re-grab states hold is the WORD's attitude on a remote and the grip eases from it at Confirm (generate.py's docstring owns the mechanism and why no second writer is needed).
# Engage gates read OS/Ready, the entry's SEALED certification — reachable only because this glue merges through the same FullController component as the sync build. Enable and OS/Ready declarations MATCH the entry's (float, vrc bool); Enable is un-scratch with default 1, and this controller sits FIRST in the component's controllers list AND its prms list so that default wins first-wins in each (generate.py --check pins both; the failure symptom is Enable baking 0, the prop invisible on spawn). The readout controller sits between and declares nothing the other two declare. `Palm/*` here is the entry glue's block verbatim (--check reads it live) because a type or default mismatch merges first-wins silently.
# Detached (synced, unsaved, default false): set on the first grab state (Grip Arrive), not release — true means "away from home" (carried or placed); false means home, which is also the rejoin/default reading. Set and held, never pulsed, so it needs no remote-visible hold and survives a cull.
# Resume/Resume_Grab — the cull park, grab-sync's reasoning verbatim: a resume is not detectable, so every state that could hand a stale pose to the damper pre-arms on the pre-halt frame — the whole Grip sub-graph (it is `Grabbed`), Released, Acquire, Bridge, Synced, Reacquire.
# Routing trap, non-derivable: entry rungs evaluate at playable frame 0, before the runtime writes IsLocal — all boot routing is level transitions on the dwell state (Timer), never entry-edge rungs.
# Bridge timer [EMPIRICAL]: pulse 0.5 + bridge 2.4 ≈ 2.9 s — derived in generate.py from the full-rotation build's ~1.32 s worst-case release-to-word latency under grab-sync's proportional buffer.

schema: 1
controller: GripSync_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  Detached:            { type: bool, default: false, vrc: { synced: true, saved: false } }
  Grab_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: Grab)
  ObjectSync/Enable:   { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready:            { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal:             bool               # VRC built-in
  IsAnimatorEnabled:   { type: bool, default: true }   # VRC built-in — longform default-true MATCHES the entry's declaration
  # absolute-grip-prop's glue block, verbatim (its readout declares the twelve receiver floats un-scratch; this document only reads or zeroes them).
  Palm/Hand: { type: int, default: 0, scratch: true }   # this document's own: the latched hand, driver-set on entry to LatchedR / LatchedL (1 / 2), 0 = none, read only by conditions; scratch because nothing outside the animator reads it
  Palm/Sign: { type: int, default: 0, scratch: true }   # this document's own: the latched axis sign as THIS client holds it, driver-set on entry to each Confirm and each Carry (1 = +axis, the P states; 2 = -axis, the N states), 0 = none, zeroed at every fresh latch; scratch, but a consumer document in the same FullController can read it
  Palm/SignP: { type: bool, default: false, vrc: { synced: true, saved: false } }   # the wearer's authoritative sign, one-hot with SignN: written localOnly on entry to each Carry, cleared localOnly at every latch and in Disabled, and read by remotes alone (the adoption rungs)
  Palm/SignN: { type: bool, default: false, vrc: { synced: true, saved: false } }   # the -axis half of that pair; both false = the wearer has not decided, which is what a remote holds its own tentative sign through
  Palm/T1p: { type: float, scratch: true }
  Palm/T1m: { type: float, scratch: true }
  Palm/T2p: { type: float, scratch: true }
  Palm/T2m: { type: float, scratch: true }
  Palm/T3p: { type: float, scratch: true }
  Palm/T3m: { type: float, scratch: true }
  Palm/T4p: { type: float, scratch: true }
  Palm/T4m: { type: float, scratch: true }
  Palm/HandL: { type: float, scratch: true }
  Palm/HandR: { type: float, scratch: true }
  Palm/CueP: { type: float, scratch: true }
  Palm/CueN: { type: float, scratch: true }
  Palm/Res: { type: float, scratch: true }
  Palm/S: { type: float, scratch: true }
  Palm/MM: { type: float, scratch: true }
  Palm/HandDiff: { type: float, scratch: true }
  Palm/Cue: { type: float, scratch: true }
  Palm/CueVel: { type: float, scratch: true }

layers:
  - name: Prop
    states:
      # Boot dwell — all routing is level transitions here (entry rungs evaluate before IsLocal lands).
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Disabled, when: [ IsLocal is true ] }
          - { to: Waiting,  when: [ IsLocal is false ], exitTime: 1.0 }
      Disabled:
        motion: { clip: disabled }
        behaviours:
          - driver: { localOnly: true, set: { Detached: 0 } }   # off-is-reset: recall home
          - driver: { set: { Palm/T1p: 0, Palm/T1m: 0, Palm/T2p: 0, Palm/T2m: 0, Palm/T3p: 0, Palm/T3m: 0, Palm/T4p: 0, Palm/T4m: 0, Palm/HandL: 0, Palm/HandR: 0, Palm/CueP: 0, Palm/CueN: 0, Palm/Hand: 0, Palm/Sign: 0 } }
          - driver: { localOnly: true, set: { Palm/SignP: 0, Palm/SignN: 0 } }
        transitions:
          - { to: Anchored, when: [ ObjectSync/Enable greater 0.5 ], exitTime: 1.0 }   # the stow dwell: the receivers stay off the whole clip
      Anchored:
        motion: { clip: anchored }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grip Arrive, when: [ Grab_IsGrabbed is true ] }
          # the cull-resume rung: a remote resuming with detached truth on the wire must not sit showing home.
          - { to: Synced,      when: [ IsLocal is false, Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      # ---- The grip sub-graph: absolute-grip-prop's Arrive … Carry, one added pre-arm rung each (header).
      Grip Arrive:
        motion: { clip: grip_acquire }
        behaviours:
          - driver: { localOnly: true, set: { Detached: 1 } }   # detached-on-grab: the bit means "away from home"
        transitions:
          - { to: Disabled,     when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,       when: [ IsAnimatorEnabled is false ] }
          - { to: Released,     when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Acquire, when: [ ], exitTime: 1.0 }
      Grip Acquire:
        motion: { clip: grip_acquire }
        transitions:
          - { to: Disabled,      when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,        when: [ IsAnimatorEnabled is false ] }
          - { to: Released,      when: [ Grab_IsGrabbed is false ] }
          - { to: Grip LatchedR, when: [ Grab_IsGrabbed is true, Palm/T1p greater 0, Palm/T1m greater 0, Palm/T2p greater 0, Palm/T2m greater 0, Palm/T3p greater 0, Palm/T3m greater 0, Palm/T4p greater 0, Palm/T4m greater 0, Palm/HandDiff less -0.1 ] }
          - { to: Grip LatchedL, when: [ Grab_IsGrabbed is true, Palm/T1p greater 0, Palm/T1m greater 0, Palm/T2p greater 0, Palm/T2m greater 0, Palm/T3p greater 0, Palm/T3m greater 0, Palm/T4p greater 0, Palm/T4m greater 0, Palm/HandDiff greater 0.1 ] }
      Grip Reacquire:
        motion: { clip: grip_reacquire }
        transitions:
          - { to: Disabled,     when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,       when: [ IsAnimatorEnabled is false ] }
          - { to: Released,     when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Acquire, when: [ ], exitTime: 1.0 }
      Grip LatchedR:
        behaviours:
          - driver: { set: { Palm/Hand: 1, Palm/Sign: 0 } }
          - driver: { localOnly: true, set: { Palm/SignP: 0, Palm/SignN: 0 } }
        motion: { clip: grip_latched }
        transitions:
          - { to: Disabled,      when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,        when: [ IsAnimatorEnabled is false ] }
          - { to: Released,      when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Settling, when: [ ], exitTime: 1.0 }
      Grip LatchedL:
        behaviours:
          - driver: { set: { Palm/Hand: 2, Palm/Sign: 0 } }
          - driver: { localOnly: true, set: { Palm/SignP: 0, Palm/SignN: 0 } }
        motion: { clip: grip_latched }
        transitions:
          - { to: Disabled,      when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,        when: [ IsAnimatorEnabled is false ] }
          - { to: Released,      when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Settling, when: [ ], exitTime: 1.0 }
      Grip Settling:
        motion: { clip: grip_settling }
        transitions:
          - { to: Disabled,       when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,         when: [ IsAnimatorEnabled is false ] }
          - { to: Released,       when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Reacquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip Settled,   when: [ ], exitTime: 1.0 }
      Grip Settled:
        motion: { clip: grip_settled }
        transitions:
          - { to: Disabled,       when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,         when: [ IsAnimatorEnabled is false ] }
          - { to: Released,       when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Reacquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip ConfirmRP, when: [ Palm/Res less 0.002, Palm/S greater 0.012, Palm/S less 0.045, Palm/MM greater 0.0001, Palm/CueVel greater -0.008, Palm/CueVel less 0.008, Palm/Hand equals 1, Palm/Cue greater 0.05 ] }
          - { to: Grip ConfirmRN, when: [ Palm/Res less 0.002, Palm/S greater 0.012, Palm/S less 0.045, Palm/MM greater 0.0001, Palm/CueVel greater -0.008, Palm/CueVel less 0.008, Palm/Hand equals 1, Palm/Cue less -0.05 ] }
          - { to: Grip ConfirmLP, when: [ Palm/Res less 0.002, Palm/S greater 0.012, Palm/S less 0.045, Palm/MM greater 0.0001, Palm/CueVel greater -0.008, Palm/CueVel less 0.008, Palm/Hand equals 2, Palm/Cue greater 0.05 ] }
          - { to: Grip ConfirmLN, when: [ Palm/Res less 0.002, Palm/S greater 0.012, Palm/S less 0.045, Palm/MM greater 0.0001, Palm/CueVel greater -0.008, Palm/CueVel less 0.008, Palm/Hand equals 2, Palm/Cue less -0.05 ] }
          - { to: Grip Reacquire, when: [ ], exitTime: 1.0 }
      Grip ConfirmRP:
        behaviours:
          - driver: { set: { Palm/Sign: 1 } }
        motion: { clip: grip_carryRP }
        transitions:
          - { to: Disabled,       when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,         when: [ IsAnimatorEnabled is false ] }
          - { to: Released,       when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Reacquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip Settled,   when: [ Palm/Res greater 0.0028571429 ] }
          - { to: Grip Settled,   when: [ Palm/S less 0.0084 ] }
          - { to: Grip Settled,   when: [ Palm/S greater 0.064285714 ] }
          - { to: Grip Settled,   when: [ Palm/MM less 7e-05 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel less -0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel greater 0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/Cue less 0.035 ] }
          - { to: Grip CarryRP,   when: [ ], exitTime: 1.0 }
      Grip ConfirmRN:
        behaviours:
          - driver: { set: { Palm/Sign: 2 } }
        motion: { clip: grip_carryRN }
        transitions:
          - { to: Disabled,       when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,         when: [ IsAnimatorEnabled is false ] }
          - { to: Released,       when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Reacquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip Settled,   when: [ Palm/Res greater 0.0028571429 ] }
          - { to: Grip Settled,   when: [ Palm/S less 0.0084 ] }
          - { to: Grip Settled,   when: [ Palm/S greater 0.064285714 ] }
          - { to: Grip Settled,   when: [ Palm/MM less 7e-05 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel less -0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel greater 0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/Cue greater -0.035 ] }
          - { to: Grip CarryRN,   when: [ ], exitTime: 1.0 }
      Grip ConfirmLP:
        behaviours:
          - driver: { set: { Palm/Sign: 1 } }
        motion: { clip: grip_carryLP }
        transitions:
          - { to: Disabled,       when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,         when: [ IsAnimatorEnabled is false ] }
          - { to: Released,       when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Reacquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip Settled,   when: [ Palm/Res greater 0.0028571429 ] }
          - { to: Grip Settled,   when: [ Palm/S less 0.0084 ] }
          - { to: Grip Settled,   when: [ Palm/S greater 0.064285714 ] }
          - { to: Grip Settled,   when: [ Palm/MM less 7e-05 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel less -0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel greater 0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/Cue less 0.035 ] }
          - { to: Grip CarryLP,   when: [ ], exitTime: 1.0 }
      Grip ConfirmLN:
        behaviours:
          - driver: { set: { Palm/Sign: 2 } }
        motion: { clip: grip_carryLN }
        transitions:
          - { to: Disabled,       when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,         when: [ IsAnimatorEnabled is false ] }
          - { to: Released,       when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Reacquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Reacquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip Settled,   when: [ Palm/Res greater 0.0028571429 ] }
          - { to: Grip Settled,   when: [ Palm/S less 0.0084 ] }
          - { to: Grip Settled,   when: [ Palm/S greater 0.064285714 ] }
          - { to: Grip Settled,   when: [ Palm/MM less 7e-05 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel less -0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/CueVel greater 0.011428571 ] }
          - { to: Grip Settled,   when: [ Palm/Cue greater -0.035 ] }
          - { to: Grip CarryLN,   when: [ ], exitTime: 1.0 }
      Grip CarryRP:
        behaviours:
          - driver: { set: { Palm/Sign: 1 } }
          - driver: { localOnly: true, set: { Palm/SignP: 1, Palm/SignN: 0 } }
        motion: { clip: grip_carryRP }
        transitions:
          - { to: Disabled,     when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,       when: [ IsAnimatorEnabled is false ] }
          - { to: Released,     when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Acquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip CarryRN, when: [ IsLocal is false, Palm/SignN is true ] }
      Grip CarryRN:
        behaviours:
          - driver: { set: { Palm/Sign: 2 } }
          - driver: { localOnly: true, set: { Palm/SignP: 0, Palm/SignN: 1 } }
        motion: { clip: grip_carryRN }
        transitions:
          - { to: Disabled,     when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,       when: [ IsAnimatorEnabled is false ] }
          - { to: Released,     when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Acquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip CarryRP, when: [ IsLocal is false, Palm/SignP is true ] }
      Grip CarryLP:
        behaviours:
          - driver: { set: { Palm/Sign: 1 } }
          - driver: { localOnly: true, set: { Palm/SignP: 1, Palm/SignN: 0 } }
        motion: { clip: grip_carryLP }
        transitions:
          - { to: Disabled,     when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,       when: [ IsAnimatorEnabled is false ] }
          - { to: Released,     when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Acquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip CarryLN, when: [ IsLocal is false, Palm/SignN is true ] }
      Grip CarryLN:
        behaviours:
          - driver: { set: { Palm/Sign: 2 } }
          - driver: { localOnly: true, set: { Palm/SignP: 0, Palm/SignN: 1 } }
        motion: { clip: grip_carryLN }
        transitions:
          - { to: Disabled,     when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,       when: [ IsAnimatorEnabled is false ] }
          - { to: Released,     when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Acquire, when: [ Palm/T1p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T1m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T2m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T3m less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4p less 0.00001 ] }
          - { to: Grip Acquire, when: [ Palm/T4m less 0.00001 ] }
          - { to: Grip CarryLP, when: [ IsLocal is false, Palm/SignP is true ] }
      # ---- grab-sync's skeleton from here on.
      # No early exit — the pulse is the re-grab lockout; Enable-off lands one pulse late via Dropped/Bridge.
      Released:
        motion: { clip: released }
        transitions:
          - { to: Resume,  when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Dropped, when: [ IsLocal is true ],  exitTime: 1.0 }
          - { to: Bridge,  when: [ IsLocal is false ], exitTime: 1.0 }
      Dropped:
        motion: { clip: dropped }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grip Arrive, when: [ Grab_IsGrabbed is true ] }
      Waiting:
        motion: { clip: waiting }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grip Arrive, when: [ Grab_IsGrabbed is true ] }
          # the late-join level path
          - { to: Acquire,     when: [ Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
          # home is unambiguous given the bit: show an anchored prop immediately
          - { to: Anchored,    when: [ Detached is false ] }
      Acquire:
        motion: { clip: acquire }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ Detached is false ] }
          - { to: Synced,    when: [], exitTime: 1.0 }   # damper transient zero — Container already on the word
      Bridge:
        motion: { clip: bridge }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,      when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grip Arrive, when: [ Grab_IsGrabbed is true ] }
          - { to: Synced,      when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, Detached is true ], exitTime: 1.0 }
          - { to: Waiting,     when: [ Detached is false ], exitTime: 1.0 }
      Synced:
        motion: { clip: synced }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ Detached is false ] }
      # Display holds the word while the woken cell flushes to the hand; swap lands only when populated.
      Reacquire:
        motion: { clip: reacquire }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,      when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released,    when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Arrive, when: [], exitTime: 1.0 }
      # The cull park (grab-sync's header owns the reasoning). Entered on the pre-halt frame, so the pause BEGINS here.
      Resume:
        motion: { clip: resume }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume_Grab, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,     when: [ Detached is false ] }
          - { to: Synced,      when: [ OS/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
      # Re-grab out of the park: hidden while the cell populates, so the prop appears at the hand.
      Resume_Grab:
        motion: { clip: resume_grab }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,      when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Released,    when: [ Grab_IsGrabbed is false ] }
          - { to: Grip Arrive, when: [], exitTime: 1.0 }
    default: Timer

