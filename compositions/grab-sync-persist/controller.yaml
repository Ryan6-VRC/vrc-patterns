  ObjectSync/Enable:   { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready:            { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal:             bool               # VRC built-in
  IsAnimatorEnabled:   { type: bool, default: true }   # VRC built-in — longform default-true MATCHES the entry's declaration; the shorthand `bool` form defaults false and, first-wins, would send the entry's Ch/Reset to Disabling at startup

layers:
  - name: Prop
    states:
      # Boot dwell — all routing is level transitions here (entry rungs evaluate before IsLocal lands).
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Persist Quiesce, when: [ IsLocal is true, BridgePersist/GrabSyncPersist/Id notEqual 0 ] }   # the restore branch; at Id 0 the next rung takes the same evaluation
          - { to: Disabled, when: [ IsLocal is true ] }
          - { to: Waiting,  when: [ IsLocal is false ], exitTime: 1.0 }
      Disabled:
        motion: { clip: disabled }
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/GrabSyncPersist/Detached: 0 } }   # off-is-reset: recall home
          - driver: { localOnly: true, copy: { BridgePersist/GrabSyncPersist/Enabled: ObjectSync/Enable } }   # the enable mirror: this state's Enable, never the branch's
          - driver: { localOnly: true, set: { GrabSyncPersist/Place: 0 } }   # a Place written while the prop was away does not fire at the next Anchored
        transitions:
          - { to: Waiting,  when: [ IsLocal is false, BridgePersist/GrabSyncPersist/Detached is true, ObjectSync/Enable greater 0.5 ] }   # a restore's return: hidden until the word, never shown at home
          - { to: Anchored, when: [ ObjectSync/Enable greater 0.5 ] }
      Anchored:
        motion: { clip: anchored }
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/GrabSyncPersist/Enabled: 1 } }   # the enable mirror
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Place,    when: [ IsLocal is true, GrabSyncPersist/Place is true ] }
          # the cull-resume rung: a remote resuming with detached truth on the wire must not sit showing
          # home. Direct to Synced: the prop is visible and solving at home, so the
          # damped entry is value-continuous — a glide to the word, never Acquire's hide/flush (whose
          # only entry is now from hidden Waiting, so its delayed show can never blink a visible prop).
