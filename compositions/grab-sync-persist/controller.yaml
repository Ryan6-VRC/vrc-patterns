        motion: { clip: released }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Dropped, when: [ IsLocal is true ],  exitTime: 1.0 }
          - { to: Bridge,  when: [ IsLocal is false ], exitTime: 1.0 }
      Dropped:
        motion: { clip: dropped }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
      Waiting:
        motion: { clip: waiting }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          # the late-join level path
          - { to: Acquire,  when: [ BridgePersist/GrabSyncPersist/Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
          # home is unambiguous given the bit: show an anchored prop immediately
          - { to: Anchored, when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
      Acquire:
        motion: { clip: acquire }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
          - { to: Synced,    when: [], exitTime: 1.0 }   # damper transient zero — Container already on the word
      Bridge:
        motion: { clip: bridge }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Synced,   when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, BridgePersist/GrabSyncPersist/Detached is true ], exitTime: 1.0 }
          - { to: Waiting,  when: [ BridgePersist/GrabSyncPersist/Detached is false ], exitTime: 1.0 }
      Synced:
        motion: { clip: synced }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
      # Display holds the word while the woken cell flushes to the hand; swap lands only when populated.
