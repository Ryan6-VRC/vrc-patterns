# GrabSyncPersist glue controller — GENERATED by generate.py from ../grab-sync/controller.yaml; never hand-edit it, re-run the generator.
# grab-sync's header owns every design decision this graph carries unchanged; generate.py's docstring owns the delta item by item,
# and persist/controller.yaml (bridge-persist's layer) owns the exchange with the bridge. This glue reads no reserved name.
# State↔clip mapping, beyond grab-sync's: Place→dropped, Persist Place→persist_place.
# Glue value-sets gain the mux's fourth slot (source3 on both channels, the sync build's reconstruction): 0 in every grab-sync clip, 1 only in persist_place, which is `anchored` with the mux moved there.
# Detached lives at BridgePersist/GrabSyncPersist/Detached: payload, synced, unsaved, default false — grab-sync's bit under the namespace.
# Persist/GrabSyncPersist/Hold is the persist layer's flag, up for the hold while Enable is off; Persist Place rides it.

schema: 1
controller: GrabSyncPersist_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  BridgePersist/GrabSyncPersist/Detached: { type: bool, default: false, vrc: { synced: true, saved: false } }   # grab-sync's Detached, as payload
  GrabSyncPersist/Place: { type: bool, default: false, vrc: { synced: false, saved: false } }   # the wearer's no-grab drop; published bare
  Persist/GrabSyncPersist/Hold: { type: bool, default: false, scratch: true }   # the persist layer's flag; local, never published
  Grab_IsGrabbed:      bool               # sensing — minted by the grab physbone (parameter: Grab)
  ObjectSync/Enable:   { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready:            { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal:             bool               # VRC built-in
  IsAnimatorEnabled:   { type: bool, default: true }   # VRC built-in — longform default-true MATCHES the entry's declaration; the shorthand `bool` form defaults false and, first-wins, would send the entry's Ch/Reset to Disabling at startup

layers:
  - name: Prop
    states:
      # Boot dwell — all routing is level transitions here (entry rungs evaluate before IsLocal lands).
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Disabled, when: [ IsLocal is true ] }
          - { to: Waiting,  when: [ IsLocal is false ], exitTime: 1.0 }
      Disabled:
        motion: { clip: disabled }
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/GrabSyncPersist/Detached: 0 } }   # off-is-reset: recall home
          - driver: { localOnly: true, set: { GrabSyncPersist/Place: 0 } }   # a Place written while the prop was away does not fire at the next Anchored
        transitions:
          - { to: Persist Place, when: [ IsLocal is true, Persist/GrabSyncPersist/Hold is true, BridgePersist/GrabSyncPersist/Detached is true ] }   # the persist layer's hold
          - { to: Waiting,  when: [ IsLocal is false, BridgePersist/GrabSyncPersist/Detached is true, ObjectSync/Enable greater 0.5 ] }   # a restore's return: hidden until the word, never shown at home
          - { to: Anchored, when: [ ObjectSync/Enable greater 0.5 ] }
      Anchored:
        motion: { clip: anchored }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Place,    when: [ IsLocal is true, GrabSyncPersist/Place is true ] }
          # the cull-resume rung: a remote resuming with detached truth on the wire must not sit showing
          # home. Direct to Synced: the prop is visible and solving at home, so the
          # damped entry is value-continuous — a glide to the word, never Acquire's hide/flush (whose
          # only entry is now from hidden Waiting, so its delayed show can never blink a visible prop).
          - { to: Synced,   when: [ IsLocal is false, BridgePersist/GrabSyncPersist/Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      Grabbed:
        motion: { clip: grabbed }
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/GrabSyncPersist/Detached: 1 } }   # detached-on-grab: the bit means "away from home"
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
      # No early exit — the pulse is the re-grab lockout; Enable-off lands one pulse late via Dropped/Bridge.
      Released:
        motion: { clip: released }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Dropped, when: [ IsLocal is true ],  exitTime: 1.0 }
          - { to: Bridge,  when: [ IsLocal is false ], exitTime: 1.0 }
      Dropped:
        motion: { clip: dropped }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
      Waiting:
        motion: { clip: waiting }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          # the late-join level path
          - { to: Acquire,  when: [ BridgePersist/GrabSyncPersist/Detached is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
          # home is unambiguous given the bit: show an anchored prop immediately
          - { to: Anchored, when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
      Acquire:
        motion: { clip: acquire }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
          - { to: Synced,    when: [], exitTime: 1.0 }   # damper transient zero — Container already on the word
      Bridge:
        motion: { clip: bridge }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Synced,   when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, BridgePersist/GrabSyncPersist/Detached is true ], exitTime: 1.0 }
          - { to: Waiting,  when: [ BridgePersist/GrabSyncPersist/Detached is false ], exitTime: 1.0 }
      Synced:
        motion: { clip: synced }
        transitions:
          - { to: Disabled,  when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,   when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
      # Display holds the word while the woken cell flushes to the hand; swap lands only when populated.
      Reacquire:
        motion: { clip: reacquire }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
      # The cull park. Entered on the pre-halt frame, so the pause BEGINS here and the clip's remaining
      # dwell measures from the resume — the playhead freezes with the animator, which is what lets a
      # clip length express "wait this long after coming back".
      Resume:
        motion: { clip: resume }
        transitions:
          - { to: Disabled,    when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume_Grab, when: [ Grab_IsGrabbed is true ] }
          - { to: Waiting,     when: [ BridgePersist/GrabSyncPersist/Detached is false ] }
          - { to: Synced,      when: [ OS/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
      # Re-grab out of the park: hidden while the cell populates, so the prop appears at the hand and the
      # pre-pause pose is never rendered.
      Resume_Grab:
        motion: { clip: resume_grab }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
      # Place: the wearer's no-grab drop, from a menu button or OSC. The cell rests on its home tip, so it
      # freezes where it stands with no release pulse to heal it, and the stamp is the grab's own. The driver consumes the control.
      Place:
        behaviours:
          - driver: { localOnly: true, set: { BridgePersist/GrabSyncPersist/Detached: 1, GrabSyncPersist/Place: 0 } }
        motion: { clip: dropped }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Dropped,  when: [ ], exitTime: 1.0 }   # the stamp landed at entry
      # The restored placement, wearer-only, while the persist layer holds its flag up with Enable off: the cell
      # rides the reconstruction of the restored words. No Enable rung: Enable returns in the evaluation the flag falls.
      Persist Place:
        motion: { clip: persist_place }
        transitions:
          - { to: Dropped, when: [ Persist/GrabSyncPersist/Hold is false ] }
    default: Timer
    # Hand arrangement. A window rearrange lives only in the built asset until folded back:
    # DecompileController, take the layout block, recompile — never regenerate over it.
    layout:
      nodes: { Timer: [30, 180], Disabled: [260, 250], Anchored: [30, 390], Grabbed: [30, 530], Released: [260, 530], Dropped: [490, 530], Waiting: [-200, 250], Acquire: [-200, 320], Bridge: [320, 390], Synced: [320, 320], Reacquire: [30, 460], Resume: [560, 320], Resume_Grab: [560, 460], Place: [260, 460], Persist Place: [490, 250] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

# Every clip = grab-sync's bindings plus the mux's source3 weight on both channels.
clips:
  timer:        # cell `timer` + HOME hidden  [EMPIRICAL: dwell = clip length]
    seconds: 1.0
    set:
      "Prop/GameObject.m_IsActive": 1
      "Prop/GrabProp/Container/GameObject.m_IsActive": 0
      "Prop/GrabProp/GrabPosition/GrabBone/GameObject.m_IsActive": 1
