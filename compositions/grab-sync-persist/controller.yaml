        motion: { clip: disabled }
        transitions:
          - { to: Persist Announce, when: [ ], exitTime: 1.0 }
      Persist Announce:
        behaviours:
          - driver: { localOnly: true, copy: { BridgePersist/GrabSyncPersist/Announce: BridgePersist/GrabSyncPersist/Id } }
          - driver: { localOnly: true, set: { ObjectSync/Enable: 0 } }   # the quiesce again, a state later
