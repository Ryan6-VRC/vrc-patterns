# grab-sync's header owns every design decision this graph carries unchanged; generate.py's docstring owns the persistence delta item by item, and README.md §Design notes what shapes it as a whole.
# State↔clip mapping, beyond grab-sync's: Place→dropped, Persist Announce→persist_announce, Persist Wait→persist_boot_wait, Persist Write→persist_write_wait, Persist Place→persist_place, Persist Resume→dropped, every other Persist state→disabled.
# Glue value-sets gain the mux's fourth slot (source3 on both channels, the sync build's reconstruction): 0 in every grab-sync clip, 1 only in persist_place, which is `anchored` with the mux moved there.
# Detached lives at BridgePersist/GrabSyncPersist/Detached: payload, synced, unsaved, default false — grab-sync's bit under the namespace.
# Enabled (BridgePersist/GrabSyncPersist/Enabled) mirrors Enable into payload: Disabled copies it, Anchored writes 1, no state in the restore branch copies Enable into it (its resets write the default). Its default equals Enable's.
# Id default 238 is this prefab's identity; a variant declares its own in a controller listed first in both FullController lists. 0 is off.

