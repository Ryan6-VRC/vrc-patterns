controller: GrabSyncPersist_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  BridgePersist/GrabSyncPersist/Detached: { type: bool, default: false, vrc: { synced: true, saved: false } }   # grab-sync's Detached, as payload
  BridgePersist/GrabSyncPersist/Id: { type: int, default: 238, vrc: { synced: false, saved: false } }   # this prefab's identity, carried as the default; 0 = off
  BridgePersist/GrabSyncPersist/Announce: { type: int, default: 0, vrc: { synced: false, saved: false } }   # a driver copy of Id, written before Boot
