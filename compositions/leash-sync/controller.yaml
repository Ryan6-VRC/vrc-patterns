# LeashSync_Fx — GENERATED by compositions/leash-sync/generate.py; never hand-edit this file.
# The leash entry's controller as leash/generate.py emits it at its shipped CONFIG, then two deviations:
# every clip keys Stake's two source weights, and a remote branch rides object-sync's reconstruction
# while LeashSync/Planted and OS/Ready hold. generate.py's docstring is the design record.
# Announce 2.0 s, settle 3 frames.

schema: 1
controller: LeashSync_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  Leash/Enable: { type: bool, default: true, vrc: { synced: true, saved: true } }
  Leash/Right: { type: float, vrc: { synced: false, saved: false, osc: true } }   # face-proximity box, sensing
  Leash/Up: { type: float, vrc: { synced: false, saved: false, osc: true } }   # face-proximity box, sensing
  Leash/Forward: { type: float, vrc: { synced: false, saved: false, osc: true } }   # face-proximity box, sensing
  Leash/Present: { type: bool, vrc: { synced: false, saved: false, osc: true } }   # Constant box, sensing
  Leash/Held: { type: bool, vrc: { synced: false, saved: false, osc: true } }   # latching, driven here
  Leash/Planted: { type: bool, vrc: { synced: false, saved: false, osc: true } }   # latching, driven here
  Leash/Chain_IsGrabbed: { type: bool, vrc: { synced: false, saved: false } }   # the proxy physbone
  Leash/Chain_IsPosed: { type: bool, vrc: { synced: false, saved: false } }   # the proxy physbone
  LeashSync/Planted: { type: bool, default: false, vrc: { synced: true, saved: false } }   # the one bit this composition adds
  ObjectSync/Enable: { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready: { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal: bool   # VRC built-in

layers:
  - name: Leash
    states:
      # The default: its clear is repeated by whichever state it hands to, one evaluation later.
      Load:
        motion: { clip: disabled }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Free, when: [ Leash/Enable is true ] }
          - { to: Disabled, when: [ Leash/Enable is false ] }
      Disabled:
        motion: { clip: disabled }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Free, when: [ Leash/Enable is true ] }
      Free:
        motion: { clip: free }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Held, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: SyncSettle, when: [ IsLocal is false, LeashSync/Planted is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      # _IsPosed is a level read when _IsGrabbed falls: posed plants, plain goes home.
      Held:
        motion: { clip: free }
        behaviours: [ { driver: { set: { Leash/Held: 1, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Plant, when: [ Leash/Chain_IsGrabbed is false, Leash/Chain_IsPosed is true ] }
          - { to: Free, when: [ Leash/Chain_IsGrabbed is false, Leash/Chain_IsPosed is false ] }
      # Freeze at entry, fades, one settled frame, then the proxy cycle; the grab exit is listed before the hop.
      Plant:
        motion: { clip: plant }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: PHeld, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: Planted, when: [], exitTime: 1.0 }
      Planted:
        motion: { clip: planted }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: PHeld, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: SyncShift, when: [ IsLocal is false, LeashSync/Planted is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      PHeld:
        motion: { clip: pheld }
        behaviours: [ { driver: { set: { Leash/Held: 1, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Plant, when: [ Leash/Chain_IsGrabbed is false, Leash/Chain_IsPosed is true ] }
          - { to: Free, when: [ Leash/Chain_IsGrabbed is false, Leash/Chain_IsPosed is false ] }
      # A remote with no stake of its own: Stake onto the reconstruction for 3 frames, StakeAim live.
      SyncSettle:
        motion: { clip: sync_settle }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Held, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: SyncPlant, when: [], exitTime: 1.0 }
      # The entry's plant with Stake live on the reconstruction; StakeAim freezes on the first frame.
      SyncPlant:
        motion: { clip: sync_plant }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: SyncPHeld, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: SyncPlanted, when: [], exitTime: 1.0 }
      # A remote that froze its own capture: Stake onto the reconstruction, StakeAim live for 3 frames.
      SyncShift:
        motion: { clip: sync_shift }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: SyncPHeld, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: SyncPlanted, when: [], exitTime: 1.0 }
      SyncPlanted:
        motion: { clip: sync_planted }
        behaviours: [ { driver: { set: { Leash/Held: 0, Leash/Planted: 1 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: SyncPHeld, when: [ Leash/Chain_IsGrabbed is true ] }
          - { to: Free, when: [ LeashSync/Planted is false ] }
      # A pick-up from the reconstruction: Stake back on the tip where the entry would unfreeze it.
      SyncPHeld:
        motion: { clip: sync_pheld }
        behaviours: [ { driver: { set: { Leash/Held: 1, Leash/Planted: 0 } } } ]
        transitions:
          - { to: Disabled, when: [ Leash/Enable is false ] }
          - { to: Plant, when: [ Leash/Chain_IsGrabbed is false, Leash/Chain_IsPosed is true ] }
          - { to: Free, when: [ Leash/Chain_IsGrabbed is false, Leash/Chain_IsPosed is false ] }
    default: Load
    layout:
      nodes: { Load: [30, 180], Disabled: [-210, 260], Free: [30, 260], Held: [30, 340], Plant: [30, 420], Planted: [30, 500], PHeld: [270, 420], SyncSettle: [270, 180], SyncPlant: [510, 260], SyncShift: [270, 580], SyncPlanted: [510, 500], SyncPHeld: [510, 420] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

  # Wearer-only: the synced flag follows Leash/Planted, rising ANNOUNCE seconds late and falling at once.
  - name: Announce
    states:
      Idle:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { LeashSync/Planted: 0 } } } ]
        transitions:
          - { to: Arming, when: [ IsLocal is true, Leash/Planted is true ] }
      Arming:
        motion: ~
        transitions:
          - { to: Idle, when: [ Leash/Planted is false ] }
          - { to: Raised, when: [], exitTime: 2.0 }
      Raised:
        motion: ~
        behaviours: [ { driver: { localOnly: true, set: { LeashSync/Planted: 1 } } } ]
        transitions:
          - { to: Idle, when: [ Leash/Planted is false ] }
    default: Idle
    layout:
      nodes: { Idle: [30, 180], Arming: [270, 180], Raised: [270, 260] }
      entry: [50, 120]
      any: [50, 40]
      exit: [50, 80]

