          - { to: Run_Prop0_0, when: [ ObjectSync/Sense/Sh/CX greater 0.0125, ObjectSync/Sense/Sh/CY greater 0.0125, ObjectSync/Sense/Sh/CZ greater 0.0125, ObjectSync/Sense/Sh/RA/X greater 0.0125, ObjectSync/Sense/Sh/RA/Z greater 0.0125 ] }
          - { to: Enter_Prop2_0, when: [], exitTime: 0.6833 }   # a rig that never wakes must not starve the other slices
