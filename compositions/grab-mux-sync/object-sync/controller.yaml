      CoarseStart:
        motion: ~
        behaviours:
          - driver:
              set:
                ObjectSync/S/Sh/PX/C: 0
                ObjectSync/S/Sh/PX/Kacc: 0
                ObjectSync/S/Sh/PX/C0: 0
                ObjectSync/S/Sh/PX/C1: 0
