                ObjectSync/S/Sh/PX/C3: 0
              copy:
                ObjectSync/R/Sh/PX/C: { source: ObjectSync/Sense/Sh/CX, sourceMin: 0.05, sourceMax: 0.966666667, destMin: 0, destMax: 1 }
        transitions:
          - { to: C0A, when: [ ObjectSync/R/Sh/PX/C greater 0.49995 ] }
          - { to: C0R, when: [ ObjectSync/R/Sh/PX/C less 0.50005 ] }
      C0A:
        motion: ~
        behaviours:
          - driver:
              add:
                ObjectSync/R/Sh/PX/C: -0.5
                ObjectSync/S/Sh/PX/C: 128
                ObjectSync/S/Sh/PX/Kacc: 2048
