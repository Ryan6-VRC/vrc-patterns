  - name: ObjectSync/Follow
    states:
      Release:
        motion: { clip: follow_target }
      Local:
        motion: { clip: follow_target }
      Follow:
        motion: { clip: follow_recon }
    any:
      - { to: Local, when: [ IsLocal is true ], canTransitionToSelf: false }   # the wearer's pose is authoritative from frame 1
      - { to: Follow, when: [ IsLocal is false, ObjectSync/Enable greater 0.5, ObjectSync/B/Acquired greater 0.5 ], canTransitionToSelf: false }   # a complete word table has landed on THIS client, read through the Floatify copy so the gate and the decode inputs share one latency path
      - { to: Release, when: [ IsLocal is false, ObjectSync/Enable less 0.5 ], canTransitionToSelf: false }
    default: Release
    layout:
      nodes:
        Release: [30, 180]
        Local:   [270, 260]
        Follow:  [270, 100]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]
  - name: ObjectSync/Slice
    states:
      Enter_Prop0_0:
        motion: { clip: slice_gate_prop0 }
        behaviours:
          - driver:
              set:
                ObjectSync/Sense/Sh/CX: 0
                ObjectSync/Sense/Sh/FX: 0
                ObjectSync/Sense/Sh/CY: 0
                ObjectSync/Sense/Sh/FY: 0
                ObjectSync/Sense/Sh/CZ: 0
                ObjectSync/Sense/Sh/FZ: 0
                ObjectSync/Sense/Sh/RA/X: 0
                ObjectSync/Sense/Sh/RA/Z: 0
                ObjectSync/Slice/Prop0: 0
                ObjectSync/Slice/Prop1: 0
                ObjectSync/Slice/Prop2: 0
                ObjectSync/Slice/Prop3: 0
                ObjectSync/Slice/Live: 0
