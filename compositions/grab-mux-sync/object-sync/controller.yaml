# One control, so a bare Toggle rather than a menu asset — and the module is
# single-instance per avatar anyway, since its collision tags are fixed strings
# VRCFury's param prefixing does not reach (the README's Rig section).
menu:
  - toggle: Object Sync
    param: ObjectSync/Enable
    value: 1
