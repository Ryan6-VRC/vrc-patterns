# SyncOnPlayer glue controller — the ONE controller of the sync-on-player composition; the README owns the arc, this header owns only what the graph cannot say.
# The clip table below the BEGIN marker is EMITTED by generate.py (its `the glue document` section is the design record) — cell bindings read live from ../../drop-on-player/controller.yaml's clip table — values unchanged, entry-Container's own mux weights included (a harmless inner duplicate of Source's selection — the outer mux exists to add the word without touching the cell ring), paths gaining the Prop/DropOnPlayer/ prefix. State↔clip map (the wearer and remote lanes share clips by name; a state's last word keys it): Timer→timer, Disabled→disabled, Anchored→anchored, Grabbed→grabbed, Released→released (pulse curve included), Dropped→dropped, Tracked→tracked (readout DBT included), WaitWord→waiting, Seeking→seeking (tracked-cell + box-tracker-Searching cage, carved), AcquireFlush→acquireflush, Synced→synced, Acquiring→acquiring (`synced` with the cage filters shut, carved), Bridge→bridge, Reacquire→reacquire, Resume→resume, Resume_Grab→resume_grab. Exceptions carved from the verbatim rule, and only these: the GrabPosition repoint weight pair (word states hold (1,0) so the parked cell root rides the word through the repointed Display — grab-prop §How it works sanctions the two-source repoint), the added park/word source-weight pair on TrackingPoints/VRCParentConstraint (a NEW binding pair on every clip — the entry never animates its park sources), Seeking's self-hold set, and Acquiring's four allowOthers written 0.
# Glue value-sets — digits are an echo of generate.py's VALUE_SETS, which is their canon (mux = Prop/Source position sources [AnchorOffset, cell Container, cage RideOffset, word Sync], damper = Prop/Container [Source, self], park = TrackingPoints/VRCParentConstraint [Container/TrackingOffset, ObjectSync/Sync/CagePark]):
#   HIDDEN     = mux (0,1,0,0), damper (1,0), Display off, park (1,0)   (Timer, Disabled, WaitWord)
#   ANCHOR     = mux (1,0,0,0), damper (1,0), Display on,  park (1,0)   (Anchored — shows immediately: it never needed the word)
#   CELL       = mux (0,1,0,0), damper (1,0), Display on,  park (1,0)   (Grabbed, Released, Dropped, Bridge)
#   CAGE       = mux (0,0,1,0), damper (1,0), Display on,  park inert   (Tracked; Seeking — parent constraint disabled, cage owns its own position)
#   WORD-RIGID = mux (0,0,0,1), damper (1,0),              park (0,1)   (AcquireFlush — Display shown 0.1 s delayed while the park↔word ring flushes; Resume — Display off)
#   WORD-DAMPED= mux (0,0,0,1), damper (0.1,1), Display on, park (0,1)  (Synced; Acquiring — the same set with the four cage filters shut; damper weights are grab-sync's shipped position value)
#   WORD-CELL  = mux (0,0,0,1), grabbed cell, park (0,1); damper (0.1,1) on Reacquire, (1,0) on Resume_Grab  (Reacquire — Display on, holding the word while the cell flies to the hand; DAMPED so a grab landing mid-convergence rides value-continuous rather than snapping onto the undamped word — grab-sync's SYNC set spans its Synced AND Reacquire, and this is that parity. Measured residual, grab-sync-shared: the cell pins to the display at grab ENTRY, so the dwell's remaining ride pays back in one frame at the Grabbed hop — gap-at-grab × ~44% at the 0.1 s dwell, plus the 20 mm cell offset, shrinking as the damper converges. Resume_Grab — Display off, passthrough: a resume must not integrate from a stale pose; grab-sync's resume_grab likewise)
# The cage park geometry: the word encodes the PROP (Sync_Target measures the mux output = cage + RideOffset), so word states park the cage on ObjectSync/Sync/CagePark — a plain constraint-free child of Sync carrying the below-the-prop offset (−RideOffset), never on bare Sync (one ride-offset high: mis-centered catch column, full-offset pop at every latch). At the latch the cage sits at word − RideOffset, the prop at cage + RideOffset = word: value-continuous. Cell/anchor states keep the entry's own park (Container/TrackingOffset). Offsets live on the child GO's transform, never in constraint fields (runtime.md §Constraints — the client scales source offsets by avatar scale).
# One flat machine in two lanes under one boot dwell; state names carry the lane as a leading word (Local X / Remote X), the entry's scheme. IsLocal is constant per client, so Timer routes each client once, by level transitions (the frame-0 trap below), into the wearer half or the remote half, and the two never meet again; the only IsLocal conditions left are Timer's. The wearer half is the entry's wearer half lifted under one transcription rule, state to same-named state — every driver gains the Carried write and Grabbed gains a driver setting it, Tracked's loss rungs target Seeking instead of Dropped, Seeking is added, and Enable and the grab param take this composition's names (ObjectSync/Enable read as a float, Grab_IsGrabbed); any other difference is a defect in one of the two documents. The remote half carries every word state and no driver. A mirror clone reads IsLocal true, takes the wearer half, and runs no drivers (runtime.md §Parameters). No wearer state pre-arms on cull: a wearer is never distance-hidden from themselves.
# Engage predicate: "engaged" := ObjectSync/Enable AND OS/Ready, the entry's certification read DIRECTLY in remote-half rungs, grab-sync's shipped shape; the entry's IsLocal arm is structural here, because only the remote half reads the word. No Ready-lag layer exists here or in shipped grab-sync: OS/Ready is already the Floatify copy aligned with the decoded words, so lagging it buys nothing.
# The Enable and OS/Ready declarations MATCH the sync build's animator declarations — float, with vrc.type the bool wire type — because VRCFury's param merge is first-wins and types must agree. ObjectSync/Enable declares default 1 HERE while the build's enableDefault stays 0 (the pattern spawns armed; grab-sync's exact mechanism, and like it un-scratch with the vrc flags matched to the entry's) — which only works because this glue sits BEFORE the sync build in the shared FullController's controllers list AND its params asset before the build's in prms (grab-sync's header owns the two first-wins lists, and the failure symptom of either inversion is Enable baking default-0, the prop hidden on spawn). ObjectSync/Enable is ONE bare param across every sealed object-sync build on the avatar — composed beside grab-sync, this menu toggle arms that build too, by design (the entry's §Seam), and the baked default is first-wins across components, so default-on holds unconditionally only while this is the avatar's sole build.
# The synced pair DropOnPlayer/Out+Worn is the entry's 2-bit mode transport unchanged: 00 disabled · 01 anchored · 11 tracked · 10 dropped; stamped only by the wearer's localOnly drivers; the word disambiguates position for both Out=1 codes (hide until the word is certified when the pair reads 10/11; 01 shows immediately). `Lost` is dissolved: remote loss falls to riding the word (Tracked → Synced), never a permanent freeze. Synced cost: 2 (pair) + 1 (Carried) + 1 (Enable) + 26 (this build's wire) = 30 bits.
# DropOnPlayer/Carried (bool, synced, unsaved): Local Grabbed's driver sets it 1; every wearer rest-state driver writes it 0 IN THE SAME DRIVER as its pair stamp, so pair and Carried land in one coherent sync snapshot (runtime.md §Parameters) and a remote never reads Carried 0 beside a stale pair. That is what lets Remote Grabbed enter Remote Tracked on grab-end with all four boxes and stay deaf to the pre-carry pair until the stamp — the stamp is recognised by Carried falling, not by the pair changing, so an 11-lifted-and-11-dropped release (no pair edge) works. One gating rule, no exceptions: every rung that reads the pair also reads Carried is false, 00 included, because a torn 00-with-Carried-1 read would otherwise ping-pong Disabled ⇄ WaitWord. Carried-true rungs live only where a joiner, or the fumble below, can sit with a stale pair: Timer, Disabled and Anchored route it to the word arc (Anchored to Synced when engaged, else WaitWord — Anchored is visible and solving, so the damped entry is a glide where WaitWord's hide and AcquireFlush's delayed show would blink), Resume's engaged rung takes it without reading the pair; a present, running client always witnesses a grab natively, so Carried true arriving anywhere else without a grab is a cull artefact, which lands in Resume. Accepted corner: a grab-and-release shorter than one sync tick enters Tracked reading Carried 0 with the stale pair and routes on it for one tick; the real stamp then corrects it — Anchored → Synced → Acquiring → Tracked, ~1.5 s, damped throughout. The snapshot argument holds only while the three bits are uncompressed: a host avatar past the 256-bit budget puts them on the Parameter Compressor's multiplexed channel and the coherence is gone — read the compressed membership off the baked VRCFuryDebugInfo component at compose time.
# Acquiring — the remote acquisition dwell. A remote riding a moving word must not latch onto whichever head the sweeping catch column passes over; the discriminator is dwell-in-column: the target's head rides with the word and stays in the column, a bystander is in it only for the crossing time. Entered from Synced when the pair reads 11, Carried is false, and all four boxes read above ACQ_MIN = 0.2 [EMPIRICAL, derived: face proximity reads the sender's deepest point over the face's depth, so 0.2 is the head's leading surface ~3 cm inside the 0.15 m X/Z faces and ~6 cm inside the 0.30 m Y face — hysteresis over the 0.00001 loss floor, so a head grazing the column does not cycle the state every frame]. Its clip is `synced` with the four allowOthers written 0: filters are checked only at acquisition (runtime.md §Contacts), so the boxes lock onto the head they held at entry and a second head entering mid-dwell cannot keep the readings alive. Exits to Synced on ANY-loss (filters reopen), to Tracked at exitTime = DWELL = 0.75 s [EMPIRICAL, derived: the column is 0.15 m across — TrackingPoints rest scale × 3, held in metres by the root scale pin — plus a ~0.1 m head sender radius each side, so a crossing spans ~0.35 m and the dwell rejects one at or above ~0.5 m/s, while a target at rest latches 0.75 s after the remote's parked cage settles on it — the cage parks on the word, so that clock starts one wire refresh plus the wearer's measure cycle after the head itself stops, and a head that moves again inside that window restarts the dwell]. Nothing visible moves during the dwell: cage parked on the word park, acquisition scale, display unchanged, so a rejected bystander costs no motion; the pop at the swap is the damper residual (≈ 3 cm worst case at the admitted speed). Carried from box-tracker's Searching → Tracking re-latch, not separately measured: a box whose latch broke re-acquires the head on re-entry once allowOthers reopens — Acquiring's loss → Synced → Acquiring cycle is that path's hot loop. Residuals: two heads stationary in one column; a still target off-centre by more than the tolerance never latches and rides the word, which is where the prop is; and a word still walking toward its rest below the admitted speed can complete the dwell on a head it passes over — the detector's stillness gate had no dwell-in-column blind spot there, and the dwell has no stillness gate.
# Seeking (wearer-side loss grace + swap-reacquire, 5 s, wearer half only): box-tracker's Searching configuration ported verbatim (cage self-holds — position constraint on with Output pinned to cage center, no chase regardless of gain; filters REOPENED; zone recollapsed at the ORDINARY acquisition scale) + the tracked clip's cell (the inner cell keeps riding the cage, so the Dropped exit's transcribed freeze captures the seek point); pair STILL 11, no stamp — remotes see only the word freezing and stay armed in Synced on their own clocks. At 5 s exitTime → Dropped (stamps 10). The armed-window residuals this buys are accepted (the two-client checklist).
# Four routing deltas against the entry's remote half, beyond the states the word adds: Remote Released routes an arrived 11, or a still-carried pair, to Synced when engaged, else WaitWord — never Tracked, since this client's boxes did not fire and there is nothing to latch, and a Tracked visit would pop the cage onto the entry's own park for a frame; Remote Tracked routes an arrived 10 to Synced, so the boxes-fired-but-wearer-said-world-drop case shows the head for ~one tick, then a damped glide to the word as it converges on the drop (≤ ~1 s), where Bridge would freeze the head position for the bridge timer; Acquiring carries Synced's pair rungs, so a wearer recall or world-drop stamp mid-dwell does not wait out the dwell and then pay a spurious one-frame Tracked latch; Resume's engaged rung is one — anything not 00 or 01 rides the word, a carry in progress included, because Resume is already rigid on the word, so Synced is value-continuous there where Timer, Disabled and Anchored are not.
# Bridge timer [EMPIRICAL, derived — NEVER copied from grab-sync's]: pulse 0.5 + bridge 2.0 = 2.5 s. Worst-case release→committed-word for THIS build ≈ 0.55 s measure cycle + ~0.07 s unpark + 0.35 s wire refresh ≈ 0.97 s (all three read off the generated document header), plus grab-sync's proportional buffer (its 2.4 covered a 1.3 s worst case). Resume's dwell = pulse + bridge FROM the resume (grab-sync's sizing argument verbatim: Ready certifies a walk, not that the table reflects the rest point, and a resume cannot date the last release) = 2.5 s; the clip playhead freezes with the animator, which is what lets a clip length express it. Eight remote states pre-arm on IsAnimatorEnabled false (the one-frame pre-halt contract, runtime.md §Parameters): Grabbed, Released, Tracked, Bridge, AcquireFlush, Synced, Acquiring (damped or word-exposed), Reacquire (→ Resume_Grab). Resume is WORD-RIGID with Display off — never HIDDEN-on-cell, which resurrects the stale-pose flight it exists to prevent.
# Exit-priority template per remote state: pair-00, cull pre-arm, grab, carried and pair rungs, loss, exitTime — pair before loss, so a recall arriving on the loss frame lands Anchored directly. Per wearer state: Enable-off, grab, recall, sensors, exitTime. Released keeps no early exit but the cull pre-arm on the remote half and the entry's Enable-off rung on the wearer half (the pulse is the re-grab lockout).
# Off-state hygiene inherits the entry's unchanged: disabled kills the grab-bone GO and the four cage-receiver GOs (frozen floats are safe — read only from states whose receivers have been live for many frames); NO force-release driver, the stale-_IsGrabbed off-state simplification stays accepted as the entry ships it — while a stale true holds the wearer in Grabbed, Carried holds 1 and remotes ride the word, which is the wearer's real state; Disabled's driver clears Carried with the pair on the way out.
# Routing trap, non-derivable: entry rungs evaluate at playable frame 0, before the runtime writes IsLocal — all boot routing is level transitions on the dwell state (Timer), never entry-edge rungs.
# Grab_IsGrabbed is minted by the nested entry's grab physbone with its parameter field overridden to `Grab` (a VRC-SDK component override — survives the build; VRCFury rewrites the component field and the conditions here with one instance prefix, the safe match-nothing branch — off every globalParams list).

schema: 1
controller: SyncOnPlayer_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  # The synced mode bits — the entry's pair plus Carried (header), written only by the wearer's
  # localOnly drivers, pair and Carried in one driver each.
  DropOnPlayer/Out:     { type: bool, default: false, vrc: { synced: true, saved: false } }
  DropOnPlayer/Worn:    { type: bool, default: false, vrc: { synced: true, saved: false } }
  DropOnPlayer/Carried: { type: bool, default: false, vrc: { synced: true, saved: false } }
  # Menu intent — local-only (unsynced); the pair carries the outcome. (The entry's own Enable intent
  # dissolves into ObjectSync/Enable below — one gate for the whole composition.)
  DropOnPlayer/ToHead: { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Sensing — never synced, never menu-exposed (entry declarations verbatim).
  DropOnPlayer/SelfDetect: float   # standard-Head proximity (own head sender -> prop receiver; allowSelf, localOnly)
  DropOnPlayer/X+: float           # cage face-proximity (Head tag, allowOthers, localOnly:0 — remotes re-derive)
  DropOnPlayer/X-: float
  DropOnPlayer/Y+: float
  DropOnPlayer/Z+: float
  # Constant-1 direct weight carrying the latch clip inside the readout trees; never driven.
  DropOnPlayer/One: { type: float, default: 1, scratch: true }
  Grab_IsGrabbed: bool             # sensing — minted by the grab physbone (parameter: Grab); native grab sync
  # The sync build's interface, declared MATCHING (first-wins; header). Sealed names — reachable only
  # because this glue merges through the same FullController component as the build.
  ObjectSync/Enable: { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready:          { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  IsLocal:            bool                               # VRC built-in
  IsAnimatorEnabled:  { type: bool, default: true }      # VRC built-in — longform default-true MATCHES the build's declaration; the shorthand form defaults false and, first-wins, would send the build's Ch/Reset to Disabling at startup

# The shipped menu (asset form — menu ASSET controls, never bare VRCFury Toggles; the shared
# FullController's menus: block places it and RewriteParamName rewrites control and parameter
# together). Enable latches (fronts the whole composition — and every sealed object-sync build on
# the avatar, header); ToHead is the momentary recall, so it is a Button.
menu:
  - toggle: Enable
    param: ObjectSync/Enable
  - button: Recall to Head
    param: DropOnPlayer/ToHead

layers:
  # One flat machine in two lanes (header). State names carry the lane as a leading word (Local X /
  # Remote X), the entry's scheme, so the transcription rule maps wearer state to wearer state by name.
  - name: SyncOnPlayer/Control
    states:
      # Boot dwell — all routing is level transitions here (the frame-0 IsLocal trap, header); the
      # exit-time rungs read IsLocal false too, so a first frame longer than the dwell cannot carry an
      # unwritten wearer into the remote half, which has no way back. A carried pair rides the word
      # from the start (header, Carried).
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Local Disabled,  when: [ IsLocal is true ] }
          - { to: Remote WaitWord, when: [ IsLocal is false, DropOnPlayer/Carried is true ], exitTime: 1.0 }
          - { to: Remote Anchored, when: [ IsLocal is false, DropOnPlayer/Out is false, DropOnPlayer/Worn is true, DropOnPlayer/Carried is false ], exitTime: 1.0 }
          - { to: Remote WaitWord, when: [ IsLocal is false, DropOnPlayer/Carried is false, DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: Remote Disabled, when: [ IsLocal is false ], exitTime: 1.0 }
      # ---- The wearer half (Local …) — the entry's wearer half under the transcription rule (header).
      # Every driver stamps pair and Carried together. Every entry into it is Timer's explicit rung.
      Local Disabled:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 0, DropOnPlayer/Worn: 0, DropOnPlayer/Carried: 0 } }
        motion: { clip: disabled }
        transitions:
          - { to: Local Anchored, when: [ ObjectSync/Enable greater 0.5 ] }
      # Anchored — own head (the reset target: Enable-on and ToHead land here).
      Local Anchored:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 0, DropOnPlayer/Worn: 1, DropOnPlayer/Carried: 0 } }
        motion: { clip: anchored }
        transitions:
          - { to: Local Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Local Grabbed,  when: [ Grab_IsGrabbed is true ] }
      # Grabbed — the carry; Carried goes up, the pair holds its previous code. Release ladder,
      # priority top-down: own head beats another player's head beats world.
      Local Grabbed:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Carried: 1 } }
        motion: { clip: grabbed }
        transitions:
          - { to: Local Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Local Anchored, when: [ Grab_IsGrabbed is false, DropOnPlayer/SelfDetect greater 0 ] }
          - { to: Local Tracked,  when: [ Grab_IsGrabbed is false, DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: Local Released, when: [ Grab_IsGrabbed is false ] }
      # The pulse: only the world branch enters; stamps 10 AT ENTRY so the pair beats the
      # remotes' pulse end. No grab exit: the pulse is the re-grab lockout.
      Local Released:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 0, DropOnPlayer/Carried: 0 } }
        motion: { clip: released }
        transitions:
          - { to: Local Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Local Dropped,  when: [], exitTime: 1.0 }
      # The world-freeze rest; stamps 10. The transcribed freeze holds whatever the cell last
      # captured — a Seeking expiry's seek point included.
      Local Dropped:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 0, DropOnPlayer/Carried: 0 } }
        motion: { clip: dropped }
        transitions:
          - { to: Local Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Local Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Local Anchored, when: [ DropOnPlayer/ToHead is true ] }
      # Cage latched and crawling; stamps 11. ANY-loss → Seeking (one transition per box; a
      # layer takes one edge per frame). ToHead is the entry's recall failsafe.
      Local Tracked:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 1, DropOnPlayer/Carried: 0 } }
        motion:
          tree: direct
          name: BoxReadout
          normalized: false
          children:
            - { clip: tracked, directWeight: DropOnPlayer/One }
            - { clip: readout_xp, directWeight: DropOnPlayer/X+ }
            - { clip: readout_xn, directWeight: DropOnPlayer/X- }
            - { clip: readout_yp, directWeight: DropOnPlayer/Y+ }
            - { clip: readout_zp, directWeight: DropOnPlayer/Z+ }
        transitions:
          - { to: Local Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Local Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Local Anchored, when: [ DropOnPlayer/ToHead is true ] }
          - { to: Local Seeking, when: [ DropOnPlayer/X+ less 0.00001 ] }
          - { to: Local Seeking, when: [ DropOnPlayer/X- less 0.00001 ] }
          - { to: Local Seeking, when: [ DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Local Seeking, when: [ DropOnPlayer/Z+ less 0.00001 ] }
      # The 5 s loss-grace / swap-reacquire dwell (header). Prop frozen fail-visible at the loss
      # point, filters reopened, pair STILL 11 — no stamp. A fresh all-four acquisition
      # re-latches; expiry freezes in place via Dropped's transcribed capture.
      Local Seeking:
        motion: { clip: seeking }
        transitions:
          - { to: Local Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Local Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Local Anchored, when: [ DropOnPlayer/ToHead is true ] }
          - { to: Local Tracked,  when: [ DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: Local Dropped,  when: [], exitTime: 1.0 }
      # ---- The remote half (Remote …). Every other client: poses from the pair, Carried, the synced
      # grab and the word. No drivers. Every pair rung also reads Carried false (header, the one
      # gating rule).
      Remote Disabled:
        motion: { clip: disabled }
        transitions:
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote WaitWord, when: [ DropOnPlayer/Carried is true ] }
          - { to: Remote WaitWord, when: [ DropOnPlayer/Carried is false, DropOnPlayer/Out is true ] }
      # Own head — every 01 read lands here. A pair change without a witnessed grab is a missed
      # carry — treat as late-join (→ WaitWord); a carried pair glides to the word (header).
      Remote Anchored:
        motion: { clip: anchored }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Synced,   when: [ DropOnPlayer/Carried is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
          - { to: Remote WaitWord, when: [ DropOnPlayer/Carried is true ] }
          - { to: Remote WaitWord, when: [ DropOnPlayer/Carried is false, DropOnPlayer/Out is true ] }
      # The carry, witnessed. Grab-end with all four boxes live latches Tracked at once — the
      # wearer's authority arrives as the stamp, recognised by Carried falling (header).
      Remote Grabbed:
        motion: { clip: grabbed }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Remote Tracked,  when: [ Grab_IsGrabbed is false, DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: Remote Released, when: [ Grab_IsGrabbed is false ] }
      # The pulse for a release this client's boxes did not catch: route by the ARRIVED pair at
      # exitTime; an arrived 11, or a still-carried pair, rides the word (header, routing
      # deltas). No grab exit: the pulse is the re-grab lockout.
      Remote Released:
        motion: { clip: released }
        transitions:
          - { to: Remote Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the one sanctioned early exit
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ], exitTime: 1.0 }
          - { to: Remote Bridge,   when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false, DropOnPlayer/Carried is false ], exitTime: 1.0 }
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ], exitTime: 1.0 }
          - { to: Remote Synced,   when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ], exitTime: 1.0 }
          - { to: Remote WaitWord, when: [], exitTime: 1.0 }
      # Cage latched and crawling on this client's own sensors. An arrived 10 glides to the word
      # (header, routing deltas); ANY-loss rides the word, never a permanent freeze.
      Remote Tracked:
        motion:
          tree: direct
          name: BoxReadout
          normalized: false
          children:
            - { clip: tracked, directWeight: DropOnPlayer/One }
            - { clip: readout_xp, directWeight: DropOnPlayer/X+ }
            - { clip: readout_xn, directWeight: DropOnPlayer/X- }
            - { clip: readout_yp, directWeight: DropOnPlayer/Y+ }
            - { clip: readout_zp, directWeight: DropOnPlayer/Z+ }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Remote Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Synced,   when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Out is false, DropOnPlayer/Worn is true, DropOnPlayer/Carried is false ] }
          - { to: Remote Synced, when: [ DropOnPlayer/X+ less 0.00001 ] }
          - { to: Remote Synced, when: [ DropOnPlayer/X- less 0.00001 ] }
          - { to: Remote Synced, when: [ DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Remote Synced, when: [ DropOnPlayer/Z+ less 0.00001 ] }
      # Out=1 or carried, word not certified: HIDDEN (fail-visible preserved — the entry's exact
      # gap, kept until the word can speak). The pair rungs sit ABOVE the engaged rung
      # (engaged-first walks a just-recalled prop into the flush).
      Remote WaitWord:
        motion: { clip: waiting }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote AcquireFlush, when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      # The rigid word flush: entered only from hidden states (WaitWord, Resume's not-engaged
      # fallback re-entry), so the 0.1 s delayed show never blinks a visible prop; the dwell covers
      # the park↔word ring's one-hop-per-frame value flush. Grab → Reacquire (direct-to-Grabbed
      # re-opens the stale-cell flash).
      Remote AcquireFlush:
        motion: { clip: acquireflush }
        transitions:
          - { to: Remote Disabled,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Remote Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Anchored,  when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Synced,    when: [], exitTime: 1.0 }
      # Riding the word, damped, filters open — placed (10), tracked-elsewhere (11) or carried.
      # THE acquisition rung: 11, not carried, all four boxes above ACQ_MIN → Acquiring (header).
      Remote Synced:
        motion: { clip: synced }
        transitions:
          - { to: Remote Disabled,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Remote Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Acquiring, when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is true, DropOnPlayer/Carried is false, DropOnPlayer/X+ greater 0.2, DropOnPlayer/X- greater 0.2, DropOnPlayer/Y+ greater 0.2, DropOnPlayer/Z+ greater 0.2 ] }
          - { to: Remote Anchored,  when: [ DropOnPlayer/Out is false, DropOnPlayer/Worn is true, DropOnPlayer/Carried is false ] }
      # The acquisition dwell (header): `synced` with the filters shut; loss → Synced reopens
      # them; the pair rungs ride along so a mid-dwell stamp routes at once; Tracked at exitTime.
      Remote Acquiring:
        motion: { clip: acquiring }
        transitions:
          - { to: Remote Disabled,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Remote Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Synced,    when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Anchored,  when: [ DropOnPlayer/Out is false, DropOnPlayer/Worn is true, DropOnPlayer/Carried is false ] }
          - { to: Remote Synced, when: [ DropOnPlayer/X+ less 0.00001 ] }
          - { to: Remote Synced, when: [ DropOnPlayer/X- less 0.00001 ] }
          - { to: Remote Synced, when: [ DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Remote Synced, when: [ DropOnPlayer/Z+ less 0.00001 ] }
          - { to: Remote Tracked,   when: [], exitTime: 1.0 }
      # Witnessed world-drop (grab-sync's arc verbatim): the frozen witnessed capture is IK-close,
      # shown while the wire catches up; at the timer the word takes over if engaged, else fall
      # back hidden (fail-visible).
      Remote Bridge:
        motion: { clip: bridge }
        transitions:
          - { to: Remote Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Remote Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ] }
          - { to: Remote Synced,   when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ], exitTime: 1.0 }
          - { to: Remote WaitWord, when: [], exitTime: 1.0 }
      # Grab-from-word dwell: the display holds the word while the woken cell flies to the hand (a
      # CELL-mux Reacquire would show the just-woken frozen cell — the exact flash being guarded).
      # A sub-dwell release exits to Released so the capture choreography still replays.
      Remote Reacquire:
        motion: { clip: reacquire }
        transitions:
          - { to: Remote Resume_Grab, when: [ IsAnimatorEnabled is false ] }   # a cull mid-re-grab parks hidden
          - { to: Remote Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Remote Grabbed,  when: [], exitTime: 1.0 }
      # The cull pre-arm park: WORD-RIGID with Display off — the pause begins here, hidden and rigid
      # on the word, and the clip's remaining dwell measures from the resume. At exitTime route by
      # pair, anything not home or off riding the word if engaged; not-engaged falls back hidden.
      Remote Resume:
        motion: { clip: resume }
        transitions:
          - { to: Remote Resume_Grab, when: [ Grab_IsGrabbed is true ] }
          - { to: Remote Anchored,    when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ], exitTime: 1.0 }
          - { to: Remote Disabled,    when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false, DropOnPlayer/Carried is false ], exitTime: 1.0 }
          - { to: Remote Synced,      when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
          - { to: Remote WaitWord,    when: [], exitTime: 1.0 }
      # Grab during a resume dwell (a grab that fires after a resume STARTS after it — an in-progress
      # grab does not reach a paused client; runtime.md §PhysBones): hidden while the cell populates,
      # so the prop appears at the hand and the pre-pause pose is never rendered. Grab-sync verbatim.
      Remote Resume_Grab:
        motion: { clip: resume_grab }
        transitions:
          - { to: Remote Resume,   when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Remote Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Remote Grabbed,  when: [], exitTime: 1.0 }
    default: Timer
    # Two lanes under Timer, wearer left (negative x), remotes right. The wearer lane descends
    # Disabled → Anchored → Grabbed → Tracked → Seeking with the release pulse falling outboard to
    # Dropped. The remote lane's first column is the same spine (Disabled, Anchored, Grabbed, Tracked)
    # with the pulse falling outboard to Bridge on the wearer's Released/Dropped rows; the word arc
    # takes the third column (WaitWord → AcquireFlush → Synced descending beside the spine, Acquiring
    # below, off Tracked's row so its exit-time edge does not run through Bridge); the cull lane
    # (Reacquire, Resume_Grab, Resume) parks furthest out.
    layout:
      nodes:
        Timer:               [30, 180]
        Local Disabled:      [-210, 270]
        Local Anchored:      [-210, 360]
        Local Grabbed:       [-210, 450]
        Local Released:      [-450, 450]
        Local Tracked:       [-210, 540]
        Local Dropped:       [-450, 540]
        Local Seeking:       [-210, 630]
        Remote Disabled:     [270, 270]
        Remote Anchored:     [270, 360]
        Remote Grabbed:      [270, 450]
        Remote Released:     [510, 450]
        Remote Tracked:      [270, 540]
        Remote Bridge:       [510, 540]
        Remote WaitWord:     [750, 270]
        Remote AcquireFlush: [750, 360]
        Remote Synced:       [750, 450]
        Remote Acquiring:    [750, 630]
        Remote Reacquire:    [990, 360]
        Remote Resume_Grab:  [990, 540]
        Remote Resume:       [990, 630]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

