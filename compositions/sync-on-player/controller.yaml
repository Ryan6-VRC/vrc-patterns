  # Readout leaves (entry verbatim, prefixed; coefficients and box geometry are ONE unit —
  # the entry's clip table owns them). Padded to the pulse length (header).
  readout_xp:
    length: 0.5
    set:
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.x": 1.5
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.y": -1.5
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.z": -1.5
  readout_xn:
    length: 0.5
    set:
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.x": -1.5
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.y": -1.5
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.z": -1.5
  readout_yp:
    length: 0.5
    set:
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.y": 3
  readout_zp:
    length: 0.5
    set:
      "Prop/DropOnPlayer/TrackingPoints/Output/Transform.m_LocalPosition.z": 3

  # Settle-layer clips — all animator-parameter writes (no scene bindings). Constants: cellSize
  # 2.0 m, fine LSB 0.00078125 m (the generated document header); ε shoulders live in the window
  # trees' thresholds, not here.
  mx_cell: { set: { SOP/MX: 2.0 } }
  mx_lsb:  { set: { SOP/MX: 0.00078125 } }
  my_cell: { set: { SOP/MY: 2.0 } }
  my_lsb:  { set: { SOP/MY: 0.00078125 } }
  mz_cell: { set: { SOP/MZ: 2.0 } }
  mz_lsb:  { set: { SOP/MZ: 0.00078125 } }
  prevx_set: { set: { SOP/PrevX: 1.0 } }
  prevy_set: { set: { SOP/PrevY: 1.0 } }
  prevz_set: { set: { SOP/PrevZ: 1.0 } }
  dx_pos: { set: { SOP/DX: 1.0 } }
  dx_neg: { set: { SOP/DX: -1.0 } }
  dy_pos: { set: { SOP/DY: 1.0 } }
  dy_neg: { set: { SOP/DY: -1.0 } }
  dz_pos: { set: { SOP/DZ: 1.0 } }
  dz_neg: { set: { SOP/DZ: -1.0 } }
  nx_zero_lo: { set: { SOP/NX: 0.0 } }
  nx_one_lo:  { set: { SOP/NX: 1.0 } }
  nx_one_hi:  { set: { SOP/NX: 1.0 } }
  nx_zero_hi: { set: { SOP/NX: 0.0 } }
  ny_zero_lo: { set: { SOP/NY: 0.0 } }
  ny_one_lo:  { set: { SOP/NY: 1.0 } }
  ny_one_hi:  { set: { SOP/NY: 1.0 } }
  ny_zero_hi: { set: { SOP/NY: 0.0 } }
  nz_zero_lo: { set: { SOP/NZ: 0.0 } }
  nz_one_lo:  { set: { SOP/NZ: 1.0 } }
  nz_one_hi:  { set: { SOP/NZ: 1.0 } }
  nz_zero_hi: { set: { SOP/NZ: 0.0 } }
  # Owned frametime rig (blendtree-math verbatim, renamed): tangents linear is REQUIRED — flat
  # tangents would stair-step Time and Dt would read 0 most frames.
  time_ramp: { curves: { SOP/Time: { tangents: linear, keys: [ [0, 0], [10000000, 10000000] ] } } }
  dt_pos:   { set: { SOP/Dt: 1.0 } }
  dt_neg:   { set: { SOP/Dt: -1.0 } }
  last_set: { set: { SOP/Last: 1.0 } }
  quiet_carry: { set: { SOP/Quiet: 1.0 } }
  quiet_inc:   { set: { SOP/Quiet: 1.0 } }
