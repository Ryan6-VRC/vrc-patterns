# SyncOnPlayer glue controller — the ONE controller of the sync-on-player composition; the README owns the arc, this header owns only what the graph cannot say. Build spec: the G6 operator rulings (signed off 2026-08-30, rev 4; shipped-behavior conflicts re-ruled 2026-08-31).
# Cell bindings transcribed VERBATIM from ../../drop-on-player/controller.yaml's clip table — values unchanged, entry-Container's own mux weights included (a harmless inner duplicate of Source's selection — the outer mux exists to add the word without touching the cell ring), paths gaining the Prop/DropOnPlayer/ prefix. State↔cell-clip map, total: Timer→timer, Disabled→disabled, Anchored→anchored, Grabbed→grabbed, Released→released (pulse curve included), Dropped→dropped, WaitWord→waiting, Tracked→tracked (readout DBT included), Bridge/AcquireFlush/SyncedRest/SyncedTrack/Resume→dropped, Reacquire/Resume_Grab→grabbed, TrackedProvisional→released-cell + tracked-cage FUSION (carved), Seeking→tracked-cell + box-tracker-Searching cage (carved). Exceptions carved from the verbatim rule, and only these: the GrabPosition repoint weight pair (word states hold (1,0) so the parked cell root rides the word through the repointed Display — grab-prop §How it works sanctions the two-source repoint), the added park/word source-weight pair on TrackingPoints/VRCParentConstraint (a NEW binding pair on every clip — the entry never animates its park sources), TrackedProvisional's fusion, and Seeking's self-hold set.
# Glue value-sets (G6 rulings; mux = Prop/Source position sources [AnchorOffset, cell Container, cage RideOffset, word Sync], damper = Prop/Container [Source, self], park = TrackingPoints/VRCParentConstraint [Container/TrackingOffset, ObjectSync/Sync/CagePark]):
#   HIDDEN     = mux (0,1,0,0), damper (1,0), Display off, park (1,0)   (Timer, Disabled, WaitWord)
#   ANCHOR     = mux (1,0,0,0), damper (1,0), Display on,  park (1,0)   (Anchored — shows immediately, ruling 4: it never needed the word)
#   CELL       = mux (0,1,0,0), damper (1,0), Display on,  park (1,0)   (Grabbed, Released, Dropped, Bridge)
#   CAGE       = mux (0,0,1,0), damper (1,0), Display on,  park inert   (Tracked; TrackedProvisional; Seeking — parent constraint disabled, cage owns its own position)
#   WORD-RIGID = mux (0,0,0,1), damper (1,0),              park (0,1)   (AcquireFlush — Display shown 0.1 s delayed while the park↔word ring flushes; Resume — Display off)
#   WORD-DAMPED= mux (0,0,0,1), damper (0.1,1), Display on, park (0,1)  (SyncedRest, SyncedTrack — ONE clip, `synced`: the sets are binding-identical, only the rungs differ; damper weights are grab-sync's shipped position value, ruling 6 final)
#   WORD-CELL  = mux (0,0,0,1), grabbed cell, park (0,1); damper (0.1,1) on Reacquire, (1,0) on Resume_Grab  (Reacquire — Display on, holding the word while the cell flies to the hand; DAMPED so a grab landing mid-convergence rides value-continuous rather than snapping onto the undamped word — grab-sync's SYNC set spans its Synced AND Reacquire, and this is that parity [operator-directed 2026-08-31]. Measured residual, grab-sync-shared: the cell pins to the display at grab ENTRY, so the dwell's remaining ride pays back in one frame at the Grabbed hop — gap-at-grab × ~44% at the 0.1 s dwell, plus the 20 mm cell offset, shrinking as the damper converges. Resume_Grab — Display off, passthrough: a resume must not integrate from a stale pose; grab-sync's resume_grab likewise)
# The cage park geometry (rulings 8/9, review-corrected): the word encodes the PROP (Sync_Target measures the mux output = cage + RideOffset), so word states park the cage on ObjectSync/Sync/CagePark — a plain constraint-free child of Sync carrying the below-the-prop offset (−RideOffset), never on bare Sync (one ride-offset high: mis-centered catch column, full-offset pop at every latch). At the latch the cage sits at word − RideOffset, the prop at cage + RideOffset = word: value-continuous. Cell/anchor states keep the entry's own park (Container/TrackingOffset). Offsets live on the child GO's transform, never in constraint fields (runtime.md §Constraints — the client scales source offsets by avatar scale).
# Engage predicate ("engaged" := IsLocal OR (ObjectSync/Enable AND OS/Ready)) — the entry's own three-term derivation (object-sync README §Params out), read DIRECTLY in transition rungs, grab-sync's shipped shape. No Ready-lag layer exists here or in shipped grab-sync: OS/Ready is already the Floatify copy aligned with the decoded words, so lagging it buys nothing (operator-approved 2026-08-31). The rungs are plain conjunctions [Enable, Ready] with no IsLocal arm — the IsLocal term is carried by reachability: WaitWord and Bridge are remote-only structurally (Released's IsLocal → Dropped split keeps the wearer out of the word arc), and Resume's only local entries are pre-arm rungs, whose IsAnimatorEnabled-false condition never fires on the wearer (a wearer is never distance-hidden from themselves — runtime.md §Parameters; grab-sync ships the same un-gated pre-arms).
# The Enable and OS/Ready declarations MATCH the sync build's animator declarations — float, with vrc.type the bool wire type — because VRCFury's param merge is first-wins and types must agree. ObjectSync/Enable declares default 1 HERE while the build's enableDefault stays 0 (operator-ruled 2026-08-31: the pattern spawns armed; grab-sync's exact mechanism, and like it un-scratch with the vrc flags matched to the entry's) — which only works because this glue sits BEFORE the sync build in the shared FullController's controllers list AND its params asset before the build's in prms (both orders pinned by generate.py --check; grab-sync's header owns the two first-wins lists, and the failure symptom of either inversion is Enable baking default-0, the prop hidden on spawn). ObjectSync/Enable is ONE bare param across every sealed object-sync build on the avatar — composed beside grab-sync, this menu toggle arms that build too, by design (the entry's §Seam), and the baked default is first-wins across components, so default-on holds unconditionally only while this is the avatar's sole build.
# The synced pair DropOnPlayer/Out+Worn is the entry's 2-bit mode transport unchanged (ruling 3): 00 disabled · 01 anchored · 11 tracked · 10 dropped; stamped only by the wearer's localOnly drivers; the word disambiguates position for both Out=1 codes (ruling 4: hide until the word is certified when the pair reads 10/11; 01 shows immediately). `Lost` is dissolved (ruling 5): remote loss falls to riding the word (Tracked → SyncedTrack), never a permanent freeze. Synced cost: 2 (pair) + 1 (Enable) + 26 (this build's wire) = 29 bits.
# Settle layer — the word-quiet gate (ruling 8/15, §Settled detector). No single metres AAP exists in the build, so this glue assembles it: per axis M = C × cellSize + F × fineLSB = OS/D/Prop/Pa/C × 2.0 + OS/D/Prop/Pa/F × 0.00078125 (constants read off object-sync/controller.yaml's generated header — 2 m cells, 0.78125 mm fine LSB; re-derive both if the wire geometry changes). Comparing C alone IS the rejected byte-compare (FBT sway near a cell boundary dithers the committed coarse word ~1 event/s while the assembled value moves only by the true centimetres). Mechanism, all animator-local, zero bits, zero contacts: Prev = one-frame-delayed copy of M (blendtree-math's staging idiom), D = M − Prev (signed, read only as a 1D param — never a directWeight, blendtree-math's hard constraint), NM_a = a ±ε window on D_a (1D saturation, ε = 0.1 m/step — ruling 15: ε ≈ v_threshold × refresh; this wire refreshes ~0.35 s, so 0.1 m restores the ~0.3 m/s intent while FBT sway steps clear by an order of magnitude), and Quiet = NM_x·NM_y·NM_z × (Quiet + Dt) — a feedback-add in true seconds (owned frametime rig, blendtree-math) that any axis's motion collapses to 0. The word is piecewise constant, so D is exactly 0 between commits and the window only ever adjudicates commit steps; torn or excursion frames can only fabricate motion, never stillness — the failure direction is a delayed latch. Acquisition rung: Quiet greater 0.75 [EMPIRICAL, derived]: T = max(2 wire refreshes, 4τ) = max(0.70, 0.70) + margin — 2 × 0.35 s refresh, τ ≈ 0.175 s at the (0.1,1) damper — so at the latch the word equals the carrier's true position AND the damper has fully converged onto it: the swap is value-continuous by the same gate. Acquisition always reads the UNDAMPED word (the cage parks on Sync's child, never on the damped display — ruling 9).
# TrackedProvisional (ruling 13 — remotes acquire SENSOR-FIRST at the release edge, never waiting on the pair): entered from Grabbed on [grab end AND all four boxes > 0], UNGATED by the settled detector (the witnessed edge-latch, ruling 8). CAGE display with the released clip's cell choreography running underneath (the fusion: the capture runs regardless, so a 10-routed exit shows a valid witnessed drop); filters shut at entry; dwell = 0.5 s × max(1 + Σ box readings, 1) ∈ (0.5, 2.5] s, ~1.55 s at this cage's latched readings [EMPIRICAL, measured; operator-accepted 2026-08-31] — exitTime 1.0 on a Direct-tree state, and Unity's effective duration there is Σ(weight × child length) normalized only below a weight-sum of 1, so live box weights stretch the dwell past the pulse; the 0.5 s floor (One's constant weight, and the sub-1 clamp independently) is what the release-settle "must cover the sync tick" contract needs, and the ceiling's cost is a longer self-correcting flash plus pair rungs landing up to 2.5 s late on this path; NO pair rungs during the dwell; the arrived pair routes at exitTime — the follow-then-revert (≤ the dwell) is ruling 13's accepted, self-correcting flash. ANY-loss during the dwell exits to Released (operator-approved 2026-08-31): Released IS this state's loss semantics — CELL display over the same capture, a pulse dwell, the identical arrived-pair ladder — the display cannot drop value-discontinuously (the capture froze at the same release), the restart only widens the suppression window, and the cost is that path inheriting the pulse's re-grab lockout. The DBT's readout clips are padded to the pulse length so no child can pull the dwell below it — equal child lengths bound the duration below, they do NOT make it weight-independent (the formula above).
# Seeking (ruling 12 — wearer-side loss grace + swap-reacquire, 5 s, local-only by reachability): box-tracker's Searching configuration ported verbatim (cage self-holds — position constraint on with Output pinned to cage center, no chase regardless of gain; filters REOPENED; zone recollapsed at the ORDINARY acquisition scale) + the tracked clip's cell (the inner cell keeps riding the cage, so the Dropped exit's transcribed freeze captures the seek point); pair STILL 11, no stamp — remotes see only the word freezing and stay armed in SyncedTrack on their own clocks. At 5 s exitTime → Dropped (stamps 10). The armed-window residuals this buys are accepted (spec §Known semantics; T5 checklist).
# Bridge timer [EMPIRICAL, derived — NEVER copied from grab-sync's]: pulse 0.5 + bridge 2.0 = 2.5 s. Worst-case release→committed-word for THIS build ≈ 0.55 s measure cycle + ~0.07 s unpark + 0.35 s wire refresh ≈ 0.97 s (all three read off the generated document header), plus grab-sync's proportional buffer (its 2.4 covered a 1.3 s worst case). Resume's dwell = pulse + bridge FROM the resume (grab-sync's sizing argument verbatim: Ready certifies a walk, not that the table reflects the rest point, and a resume cannot date the last release) = 2.5 s; the clip playhead freezes with the animator, which is what lets a clip length express it. Nine states pre-arm on IsAnimatorEnabled false (the one-frame pre-halt contract, runtime.md §Parameters): Grabbed, Released, TrackedProvisional, Tracked, Bridge, AcquireFlush, SyncedRest, SyncedTrack (damped or word-exposed), Reacquire (→ Resume_Grab). Resume is WORD-RIGID with Display off — never HIDDEN-on-cell, which resurrects the stale-pose flight it exists to prevent (review-corrected). Local-only states (Dropped, Seeking) never pre-arm: a wearer is never distance-hidden from themselves.
# Exit-priority template per state (G6 §The machine): pair-00 first, then cull pre-arm, then grab, then recall intent, then pair/level rungs. On REMOTES the off-exit is the pair-00 rung alone — Enable-off rungs are IsLocal-gated (the wearer's 00 stamp is the off broadcast; a remote acting on raw Enable would two-cycle against a stale pair). Released keeps NO early exits but the cull pre-arm (the pulse is the re-grab lockout; Enable-off lands one pulse late via Dropped — grab-sync's split: IsLocal → Dropped at exitTime, without which the wearer's own pair routes them into the remote word arc where engaged's remote terms never fire).
# Off-state hygiene inherits the entry's unchanged: disabled kills the grab-bone GO and the four cage-receiver GOs (frozen floats are safe — read only from states whose receivers have been live for many frames); ruling 14: NO force-release driver, the stale-_IsGrabbed off-state simplification stays accepted as the entry ships it.
# Routing trap, non-derivable: entry rungs evaluate at playable frame 0, before the runtime writes IsLocal — all boot routing is level transitions on the dwell state (Timer), never entry-edge rungs.
# Grab_IsGrabbed is minted by the nested entry's grab physbone with its parameter field overridden to `Grab` (a VRC-SDK component override — survives the build; VRCFury rewrites the component field and the conditions here with one instance prefix, the safe match-nothing branch — off every globalParams list).

schema: 1
controller: SyncOnPlayer_Fx
basis: mount-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  # The synced pair — the rest mode, written only by the wearer's localOnly drivers (entry declarations verbatim).
  DropOnPlayer/Out:    { type: bool, default: false, vrc: { synced: true, saved: false } }
  DropOnPlayer/Worn:   { type: bool, default: false, vrc: { synced: true, saved: false } }
  # Menu intent — local-only (unsynced); the pair carries the outcome. (The entry's own Enable intent
  # dissolves into ObjectSync/Enable below — one gate for the whole composition.)
  DropOnPlayer/ToHead: { type: bool, default: false, vrc: { synced: false, saved: false } }
  # Sensing — never synced, never menu-exposed (entry declarations verbatim).
  DropOnPlayer/SelfDetect: float   # standard-Head proximity (own head sender -> prop receiver; allowSelf, localOnly)
  DropOnPlayer/X+: float           # cage face-proximity (Head tag, allowOthers, localOnly:0 — remotes re-derive)
  DropOnPlayer/X-: float
  DropOnPlayer/Y+: float
  DropOnPlayer/Z+: float
  # Constant-1 direct weight carrying the latch clip inside the readout trees; never driven.
  DropOnPlayer/One: { type: float, default: 1, scratch: true }
  Grab_IsGrabbed: bool             # sensing — minted by the grab physbone (parameter: Grab); native grab sync
  # The sync build's interface, declared MATCHING (first-wins; header). Sealed names — reachable only
  # because this glue merges through the same FullController component as the build.
  ObjectSync/Enable: { type: float, default: 1, vrc: { type: bool, synced: true, saved: false } }
  OS/Ready:          { type: float, default: 0, vrc: { type: bool, synced: false, saved: false } }
  # The build's decoded stage AAPs, per axis: assembled cell index (C, 0..4095) and fine index (F).
  # Scratch HERE (the build's own params asset already lists them); types match the build's floats.
  OS/D/Prop/PX/C: { type: float, scratch: true }
  OS/D/Prop/PX/F: { type: float, scratch: true }
  OS/D/Prop/PY/C: { type: float, scratch: true }
  OS/D/Prop/PY/F: { type: float, scratch: true }
  OS/D/Prop/PZ/C: { type: float, scratch: true }
  OS/D/Prop/PZ/F: { type: float, scratch: true }
  # Settle-layer scratch (§header): assembled metres, the one-frame-delayed copy, the signed step,
  # the per-axis quiet windows, the owned frametime rig, and the quiet clock itself.
  SOP/MX:    { type: float, aap: true, scratch: true }
  SOP/MY:    { type: float, aap: true, scratch: true }
  SOP/MZ:    { type: float, aap: true, scratch: true }
  SOP/PrevX: { type: float, aap: true, scratch: true }
  SOP/PrevY: { type: float, aap: true, scratch: true }
  SOP/PrevZ: { type: float, aap: true, scratch: true }
  SOP/DX:    { type: float, aap: true, scratch: true }   # signed — read only as a 1D param
  SOP/DY:    { type: float, aap: true, scratch: true }
  SOP/DZ:    { type: float, aap: true, scratch: true }
  SOP/NX:    { type: float, aap: true, scratch: true }   # 1 while |DX| < ε
  SOP/NY:    { type: float, aap: true, scratch: true }
  SOP/NZ:    { type: float, aap: true, scratch: true }
  SOP/Time:  { type: float, aap: true, scratch: true }
  SOP/Last:  { type: float, aap: true, scratch: true }
  SOP/Dt:    { type: float, aap: true, scratch: true }
  SOP/Quiet: { type: float, aap: true, scratch: true }   # seconds the word has been still; the acquisition gate reads it
  IsLocal:            bool                               # VRC built-in
  IsAnimatorEnabled:  { type: bool, default: true }      # VRC built-in — longform default-true MATCHES the build's declaration; the shorthand form defaults false and, first-wins, would send the build's Ch/Reset to Disabling at startup

# The shipped menu (asset form — menu ASSET controls, never bare VRCFury Toggles; the shared
# FullController's menus: block places it and RewriteParamName rewrites control and parameter
# together). Enable latches (fronts the whole composition — and every sealed object-sync build on
# the avatar, header); ToHead is the momentary recall, so it is a Button.
menu:
  - toggle: Enable
    param: ObjectSync/Enable
  - button: Recall to Head
    param: DropOnPlayer/ToHead

layers:
  - name: SyncOnPlayer/Control
    states:
      # Remote boot dwell — all routing is level transitions here (the frame-0 IsLocal trap, header).
      Timer:
        motion: { clip: timer }
        transitions:
          - { to: Disabled, when: [ IsLocal is true ] }
          - { to: Anchored, when: [ DropOnPlayer/Out is false, DropOnPlayer/Worn is true ], exitTime: 1.0 }
          - { to: WaitWord, when: [ DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: Disabled, when: [], exitTime: 1.0 }
      Disabled:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 0, DropOnPlayer/Worn: 0 } }
        motion: { clip: disabled }
        transitions:
          - { to: Anchored, when: [ IsLocal is true, ObjectSync/Enable greater 0.5 ] }
          - { to: Anchored, when: [ IsLocal is false, DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: WaitWord, when: [ IsLocal is false, DropOnPlayer/Out is true ] }
      # Anchored — own head (the reset target: Enable-on, ToHead, and every 01 read land here). A pair
      # change without a witnessed grab is a missed carry — treat as late-join (→ WaitWord).
      Anchored:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 0, DropOnPlayer/Worn: 1 } }
        motion: { clip: anchored }
        transitions:
          - { to: Disabled, when: [ IsLocal is false, DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Disabled, when: [ IsLocal is true, ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: WaitWord, when: [ IsLocal is false, DropOnPlayer/Out is true ] }
      # Grabbed — the carry, both sides. Local release ladder, priority top-down: own head beats
      # another player's head beats world. Remote, above the Released rung: the sensor-first
      # edge-latch (ruling 13) — grab end with all four boxes live → TrackedProvisional, never
      # waiting on the pair.
      Grabbed:
        motion: { clip: grabbed }
        transitions:
          - { to: Disabled, when: [ IsLocal is false, DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Disabled, when: [ IsLocal is true, ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Anchored, when: [ IsLocal is true, Grab_IsGrabbed is false, DropOnPlayer/SelfDetect greater 0 ] }
          - { to: Tracked,  when: [ IsLocal is true, Grab_IsGrabbed is false, DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: TrackedProvisional, when: [ IsLocal is false, Grab_IsGrabbed is false, DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
      # The remote edge-latch (ruling 13): cage latched and crawling over the released choreography's
      # capture; dwell = the pulse; NO pair rungs during it (the stale-bit suppression window). The
      # arrived pair becomes authoritative at exitTime — 11 enters Tracked with the cage already
      # latched (continuous); 10 shows Bridge a valid witnessed drop (the capture ran underneath;
      # the cage→capture snap is ruling 13's accepted ≤-pulse flash). ANY-loss → Released (header).
      TrackedProvisional:
        motion:
          tree: direct
          name: ProvisionalReadout
          normalized: false
          children:
            - { clip: provisional, directWeight: DropOnPlayer/One }
            - { clip: readout_xp, directWeight: DropOnPlayer/X+ }
            - { clip: readout_xn, directWeight: DropOnPlayer/X- }
            - { clip: readout_yp, directWeight: DropOnPlayer/Y+ }
            - { clip: readout_zp, directWeight: DropOnPlayer/Z+ }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Released, when: [ DropOnPlayer/X+ less 0.00001 ] }  # ANY-loss during the dwell (header)
          - { to: Released, when: [ DropOnPlayer/X- less 0.00001 ] }
          - { to: Released, when: [ DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Released, when: [ DropOnPlayer/Z+ less 0.00001 ] }
          - { to: Tracked,   when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: Bridge,    when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false ], exitTime: 1.0 }
          - { to: Anchored,  when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ], exitTime: 1.0 }
          - { to: Disabled,  when: [], exitTime: 1.0 }
      # The pulse, both sides. Local: only the world branch enters; stamps 10 AT ENTRY so the pair
      # beats the remotes' pulse end; IsLocal → Dropped at exitTime (grab-sync's split, header).
      # Remote (boxes-did-not-fire releases): routes at exitTime by ARRIVED pair — 11 means the pair
      # says caught but this client's boxes were empty: enter Tracked and fall through ANY-loss to
      # SyncedTrack, ruling 5 working as designed. No grab exit: the pulse is the re-grab lockout.
      Released:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 0 } }
        motion: { clip: released }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the one sanctioned early exit
          - { to: Dropped,  when: [ IsLocal is true ], exitTime: 1.0 }
          - { to: Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ], exitTime: 1.0 }
          - { to: Tracked,  when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: Bridge,   when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false ], exitTime: 1.0 }
          - { to: Disabled, when: [], exitTime: 1.0 }
      # The local world-freeze rest (local-only by reachability); stamps 10. The transcribed freeze
      # holds whatever the cell last captured — a Seeking expiry's seek point included.
      Dropped:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 0 } }
        motion: { clip: dropped }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored, when: [ DropOnPlayer/ToHead is true ] }
      # Cage latched and crawling, both sides; stamps 11. Local ANY-loss → Seeking (ruling 12);
      # remote ANY-loss → SyncedTrack (ruling 5 — riding the word, never a permanent freeze);
      # ToHead is the entry's recall failsafe (review-restored).
      Tracked:
        behaviours:
          - driver: { localOnly: true, set: { DropOnPlayer/Out: 1, DropOnPlayer/Worn: 1 } }
        motion:
          tree: direct
          name: BoxReadout
          normalized: false
          children:
            - { clip: tracked, directWeight: DropOnPlayer/One }
            - { clip: readout_xp, directWeight: DropOnPlayer/X+ }
            - { clip: readout_xn, directWeight: DropOnPlayer/X- }
            - { clip: readout_yp, directWeight: DropOnPlayer/Y+ }
            - { clip: readout_zp, directWeight: DropOnPlayer/Z+ }
        transitions:
          - { to: Disabled, when: [ IsLocal is false, DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Disabled, when: [ IsLocal is true, ObjectSync/Enable less 0.5 ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored, when: [ IsLocal is true, DropOnPlayer/ToHead is true ] }
          # ANY-loss, local → Seeking (one transition per box; a layer takes one edge per frame).
          - { to: Seeking, when: [ IsLocal is true, DropOnPlayer/X+ less 0.00001 ] }
          - { to: Seeking, when: [ IsLocal is true, DropOnPlayer/X- less 0.00001 ] }
          - { to: Seeking, when: [ IsLocal is true, DropOnPlayer/Y+ less 0.00001 ] }
          - { to: Seeking, when: [ IsLocal is true, DropOnPlayer/Z+ less 0.00001 ] }
          # ANY-loss, remote → SyncedTrack (the word is live and certified — the 11 pair got us here).
          - { to: SyncedTrack, when: [ IsLocal is false, DropOnPlayer/X+ less 0.00001 ] }
          - { to: SyncedTrack, when: [ IsLocal is false, DropOnPlayer/X- less 0.00001 ] }
          - { to: SyncedTrack, when: [ IsLocal is false, DropOnPlayer/Y+ less 0.00001 ] }
          - { to: SyncedTrack, when: [ IsLocal is false, DropOnPlayer/Z+ less 0.00001 ] }
          - { to: SyncedRest, when: [ IsLocal is false, DropOnPlayer/Out is true, DropOnPlayer/Worn is false ] }
          - { to: Anchored,   when: [ IsLocal is false, DropOnPlayer/Out is false, DropOnPlayer/Worn is true ] }
      # The 5 s loss-grace / swap-reacquire dwell (ruling 12), local-only by reachability. Prop frozen
      # fail-visible at the loss point (cage self-held, cell riding it), filters reopened at the
      # ordinary zone, pair STILL 11 — no stamp. A fresh all-four acquisition re-latches; expiry
      # freezes in place via Dropped's transcribed capture. The dwell only has to outlast the
      # WEARER's own reload of the target's avatar — remotes self-serve through SyncedTrack.
      Seeking:
        motion: { clip: seeking }
        transitions:
          - { to: Disabled, when: [ ObjectSync/Enable less 0.5 ] }
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored, when: [ DropOnPlayer/ToHead is true ] }
          - { to: Tracked,  when: [ DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: Dropped,  when: [], exitTime: 1.0 }
      # Remote, Out=1, word not certified: HIDDEN (fail-visible preserved — the entry's exact gap,
      # kept until the word can speak). The pair rungs sit ABOVE the engaged rung (review: engaged-
      # first walks a just-recalled prop into the flush).
      WaitWord:
        motion: { clip: waiting }
        transitions:
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: AcquireFlush, when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5 ] }
      # The rigid word flush: entered only from hidden states (WaitWord, Resume's not-engaged
      # fallback re-entry), so the 0.1 s delayed show never blinks a visible prop; the dwell covers
      # the park↔word ring's one-hop-per-frame value flush. Grab → Reacquire (direct-to-Grabbed
      # re-opens the stale-cell flash).
      AcquireFlush:
        motion: { clip: acquireflush }
        transitions:
          - { to: Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored,  when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: Disabled,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: SyncedRest,  when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false ], exitTime: 1.0 }
          - { to: SyncedTrack, when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is true ], exitTime: 1.0 }
      # Remote, placed at rest on the word (pair 10). 11 → SyncedTrack DIRECT (both word states, the
      # display already on the entering value — routing through AcquireFlush would blink).
      SyncedRest:
        motion: { clip: synced }
        transitions:
          - { to: Disabled,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: SyncedTrack, when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is true ] }
          - { to: Anchored,    when: [ DropOnPlayer/Out is false, DropOnPlayer/Worn is true ] }
      # Remote, riding the word unlatched (pair 11): the damped glide, cage parked on the Sync park
      # child at the ordinary zone, filters open. THE acquisition rung (rulings 8/9/15): settled word
      # AND all four boxes — always attempted from the undamped word the cage parks on.
      SyncedTrack:
        motion: { clip: synced }
        transitions:
          - { to: Disabled,  when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Resume,    when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Reacquire, when: [ Grab_IsGrabbed is true ] }
          - { to: Tracked,   when: [ SOP/Quiet greater 0.75, DropOnPlayer/X+ greater 0, DropOnPlayer/X- greater 0, DropOnPlayer/Y+ greater 0, DropOnPlayer/Z+ greater 0 ] }
          - { to: SyncedRest, when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false ] }
          - { to: Anchored,   when: [ DropOnPlayer/Out is false, DropOnPlayer/Worn is true ] }
      # Remote witnessed world-drop (grab-sync's arc verbatim): the frozen witnessed capture is
      # IK-close, shown while the wire catches up; at the timer the word takes over if engaged,
      # else fall back hidden (fail-visible). The stale-01 mid-carry wart is accepted at zero bits
      # (ruling 11).
      Bridge:
        motion: { clip: bridge }
        transitions:
          - { to: Disabled, when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ] }
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # pre-arm: the pre-halt frame
          - { to: Grabbed,  when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored, when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ] }
          - { to: SyncedRest, when: [ ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, DropOnPlayer/Out is true ], exitTime: 1.0 }
          - { to: WaitWord,   when: [], exitTime: 1.0 }
      # Remote grab-from-word dwell: the display holds the word while the woken cell flies to the
      # hand (a CELL-mux Reacquire would show the just-woken frozen cell — the exact flash being
      # guarded; review-corrected value-set). A sub-dwell release exits to Released so the capture
      # choreography still replays.
      Reacquire:
        motion: { clip: reacquire }
        transitions:
          - { to: Resume_Grab, when: [ IsAnimatorEnabled is false ] }   # a cull mid-re-grab parks hidden
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
      # The cull pre-arm park: WORD-RIGID with Display off — the pause begins here, hidden and rigid
      # on the word, and the clip's remaining dwell measures from the resume. At exitTime route by
      # pair with engaged; not-engaged falls back hidden (WaitWord).
      Resume:
        motion: { clip: resume }
        transitions:
          - { to: Resume_Grab, when: [ Grab_IsGrabbed is true ] }
          - { to: Anchored,    when: [ DropOnPlayer/Worn is true, DropOnPlayer/Out is false ], exitTime: 1.0 }
          - { to: Disabled,    when: [ DropOnPlayer/Worn is false, DropOnPlayer/Out is false ], exitTime: 1.0 }
          - { to: SyncedRest,  when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is false, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
          - { to: SyncedTrack, when: [ DropOnPlayer/Out is true, DropOnPlayer/Worn is true, ObjectSync/Enable greater 0.5, OS/Ready greater 0.5, IsAnimatorEnabled is true ], exitTime: 1.0 }
          - { to: WaitWord,    when: [], exitTime: 1.0 }
      # Grab during a resume dwell (a grab that fires after a resume STARTS after it — an in-progress
      # grab does not reach a paused client; runtime.md §PhysBones): hidden while the cell populates,
      # so the prop appears at the hand and the pre-pause pose is never rendered. Grab-sync verbatim.
      Resume_Grab:
        motion: { clip: resume_grab }
        transitions:
          - { to: Resume,   when: [ IsAnimatorEnabled is false ] }   # a second cull re-arms rather than resuming visible
          - { to: Released, when: [ Grab_IsGrabbed is false ] }
          - { to: Grabbed,  when: [], exitTime: 1.0 }
    default: Timer
    # Hand arrangement (animator-schema.md §Arranging for legibility): boot spine descends Timer →
    # Disabled; home (Anchored) and the carry hub (Grabbed) hold the center column over the cage
    # column (Tracked, Seeking); the release pulse falls right to Dropped with Bridge beneath it;
    # the word arc occupies the left lane (WaitWord → AcquireFlush → SyncedRest/SyncedTrack) with
    # Reacquire between it and the hub; TrackedProvisional sits between the hub and the word lane
    # (the remote edge-latch); the cull lane (Resume, Resume_Grab) parks far right.
    layout:
      nodes:
        Timer:      [30, 180]
        Disabled:   [270, 250]
        WaitWord:   [-450, 250]
        AcquireFlush: [-450, 320]
        Anchored:   [30, 320]
        SyncedRest: [-450, 390]
        Reacquire:  [-210, 390]
        Grabbed:    [30, 460]
        SyncedTrack: [-450, 460]
        TrackedProvisional: [-210, 530]
        Released:   [270, 530]
        Dropped:    [510, 530]
        Bridge:     [270, 610]
        Tracked:    [30, 610]
        Seeking:    [30, 690]
        Resume:     [630, 320]
        Resume_Grab: [630, 460]
      entry: [50, 120]
      any:   [50, 40]
      exit:  [50, 80]

  # The settled detector (header §Settle): one always-on WD-ON Direct root. Signal flow, one AAP hop
  # per stage (each stage reads the prior stage's frame-start value): C/F → M (assembly) → Prev
  # (staging) → D (signed step) → NM (window) → Quiet (gated feedback-add, in true seconds via the
  # owned frametime rig). Total pipeline lag ~4 frames — noise against T. Every directWeight here is
  # >=0 by construction (indices, metres-assembled-from-indices, window outputs, Quiet, Dt); the one
  # signed value (D) is read only as a 1D blend param, which is never clamped (blendtree-math).
  - name: SyncOnPlayer/Settle
    states:
      "Settle (WD ON)":
        motion:
          tree: direct
          name: Settle
          children:
            # M = C × cellSize + F × fineLSB, per axis (constants: the generated document header).
            - tree: direct
              name: "MX = C×2.0 + F×lsb"
              directWeight: DropOnPlayer/One
              children:
                - { clip: mx_cell, directWeight: OS/D/Prop/PX/C }
                - { clip: mx_lsb,  directWeight: OS/D/Prop/PX/F }
            - tree: direct
              name: "MY = C×2.0 + F×lsb"
              directWeight: DropOnPlayer/One
              children:
                - { clip: my_cell, directWeight: OS/D/Prop/PY/C }
                - { clip: my_lsb,  directWeight: OS/D/Prop/PY/F }
            - tree: direct
              name: "MZ = C×2.0 + F×lsb"
              directWeight: DropOnPlayer/One
              children:
                - { clip: mz_cell, directWeight: OS/D/Prop/PZ/C }
                - { clip: mz_lsb,  directWeight: OS/D/Prop/PZ/F }
            # Prev = last frame's M (the staging idiom: the weight reads M at frame start).
            - tree: direct
              name: "Prev staging"
              directWeight: DropOnPlayer/One
              children:
                - { clip: prevx_set, directWeight: SOP/MX }
                - { clip: prevy_set, directWeight: SOP/MY }
                - { clip: prevz_set, directWeight: SOP/MZ }
            # D = M − Prev (signed; the subtract idiom — the sign lives in the clip value).
            - tree: direct
              name: "D = M − Prev"
              directWeight: DropOnPlayer/One
              children:
                - { clip: dx_pos, directWeight: SOP/MX }
                - { clip: dx_neg, directWeight: SOP/PrevX }
                - { clip: dy_pos, directWeight: SOP/MY }
                - { clip: dy_neg, directWeight: SOP/PrevY }
                - { clip: dz_pos, directWeight: SOP/MZ }
                - { clip: dz_neg, directWeight: SOP/PrevZ }
            # NM_a = 1 while |D_a| < ε (ε = 0.1 m/step, ruling 15): a 1D window with hard shoulders —
            # the word is piecewise constant, so D is exactly 0 between commits and the shoulders
            # only ever adjudicate a commit's step size.
            - tree: 1d
              name: "NX window (±0.1)"
              param: SOP/DX
              directWeight: DropOnPlayer/One
              children:
                - { clip: nx_zero_lo, threshold: -0.1 }
                - { clip: nx_one_lo,  threshold: -0.099 }
                - { clip: nx_one_hi,  threshold: 0.099 }
                - { clip: nx_zero_hi, threshold: 0.1 }
            - tree: 1d
              name: "NY window (±0.1)"
              param: SOP/DY
              directWeight: DropOnPlayer/One
              children:
                - { clip: ny_zero_lo, threshold: -0.1 }
                - { clip: ny_one_lo,  threshold: -0.099 }
                - { clip: ny_one_hi,  threshold: 0.099 }
                - { clip: ny_zero_hi, threshold: 0.1 }
            - tree: 1d
              name: "NZ window (±0.1)"
              param: SOP/DZ
              directWeight: DropOnPlayer/One
              children:
                - { clip: nz_zero_lo, threshold: -0.1 }
                - { clip: nz_one_lo,  threshold: -0.099 }
                - { clip: nz_one_hi,  threshold: 0.099 }
                - { clip: nz_zero_hi, threshold: 0.1 }
            # The owned frametime rig (blendtree-math verbatim, renamed): Dt in true seconds, so
            # Quiet is frame-rate independent and T compares in the wire's own units.
            - { clip: time_ramp, directWeight: DropOnPlayer/One }
            - tree: direct
              name: "Dt = Time − Last"
              directWeight: DropOnPlayer/One
              children:
                - { clip: dt_pos,   directWeight: SOP/Time }
                - { clip: dt_neg,   directWeight: SOP/Last }
                - { clip: last_set, directWeight: SOP/Time }
            # Quiet = NM_x·NM_y·NM_z × (Quiet + Dt): nested weights multiply, so any axis's motion
            # collapses the carry AND the increment to 0 that frame — the reset.
            - tree: direct
              name: "Quiet (gated carry)"
              directWeight: SOP/NX
              children:
                - tree: direct
                  name: "× NY"
                  directWeight: SOP/NY
                  children:
                    - tree: direct
                      name: "× NZ"
                      directWeight: SOP/NZ
                      children:
                        - { clip: quiet_carry, directWeight: SOP/Quiet }
                        - { clip: quiet_inc,   directWeight: SOP/Dt }
    default: "Settle (WD ON)"

# Every Control clip = the entry's full rig-property set (transcribed verbatim at the
# Prop/DropOnPlayer/ prefix — the per-state binding-set diff against the entry's clip table is the
# transcription assert, exceptions carved in the header) + the 9 glue bindings (root active, 4 mux
# weights, 2 damper weights, Display active, 2 park weights). Constraint source maps this document
# adds (the entry's own are its header's):
#   Prop/Source/VRCPositionConstraint:    source0 Prop/DropOnPlayer/HeadMount/AnchorOffset (anchor),
#                                         source1 Prop/DropOnPlayer/Container (the CELL node),
#                                         source2 Prop/DropOnPlayer/TrackedPoint/RideOffset (cage),
#                                         source3 ObjectSync/Sync (the word)
#   Prop/Container/VRCPositionConstraint: source0 Prop/Source (the mux), source1 self (the damper)
#   Prop/DropOnPlayer/TrackingPoints/VRCParentConstraint: source0 Container/TrackingOffset (the
#                                         entry's own park), source1 ObjectSync/Sync/CagePark (the
#                                         word park, added by this composition — the header owns the
#                                         geometry; the T1 frame-lag sweep owns the new ring's edges)
#   Sync_Target's shipped constraint gains [Prop/Source w=1] — static, never animated: the encoder
#                                         measures the mux output, undamped (ruling 9).
